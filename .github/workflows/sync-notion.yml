name: Sync to Notion
on:
  schedule:
    - cron: '*/30 * * * *'    # 每 30 分鐘檢查一次；沒有新的學習活動時幾秒內結束，不碰 Notion
  workflow_dispatch:
    inputs:
      force:
        description: '忽略「沒有新活動」的判斷，強制完整同步'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: notion-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FORCE: ${{ inputs.force }}
    steps:
      - name: 檢查是否已設定 Secrets
        id: gate
        run: |
          if [ -z "$NOTION_TOKEN" ] || [ -z "$NOTION_PARENT_PAGE_ID" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "尚未設定 NOTION_TOKEN / NOTION_PARENT_PAGE_ID / FIREBASE_SERVICE_ACCOUNT，略過同步。"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
      - name: 安裝 firebase-admin（不寫入倉庫）
        if: steps.gate.outputs.run == 'true'
        run: npm install --no-save --no-package-lock firebase-admin@12.7.0
      - name: 生成 catalog.json
        if: steps.gate.outputs.run == 'true'
        run: node scripts/build-catalog.mjs
      - name: 同步 Firestore → Notion
        if: steps.gate.outputs.run == 'true'
        run: node scripts/sync-notion.mjs
