<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>學習記錄 · E_learning Hub</title>
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .rec-stats { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); }
  .rec-stat { background: var(--card); border: 1px solid var(--line); border-radius: 1rem; padding: 1rem 1.2rem; }
  .rec-stat b { display: block; font-size: 2rem; color: var(--accent); }
  .rec-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 1rem; overflow: hidden; font-size: 1rem; }
  .rec-table th, .rec-table td { padding: .7rem .9rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  .rec-table th { background: #efe7d8; font-weight: 800; white-space: nowrap; }
  .rec-scroll { overflow-x: auto; }
  .rec-sess { background: var(--card); border: 1px solid var(--line); border-radius: 1rem; padding: .8rem 1.1rem; margin-bottom: .8rem; }
  .rec-sess summary { cursor: pointer; font-weight: 700; min-height: 2.6rem; display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; }
  .rec-pts { color: #b26a00; font-weight: 800; }
  .rec-stat small { color: var(--muted); display: block; }
  .rec-ok { color: #157a3a; font-weight: 800; } .rec-bad { color: #b42318; font-weight: 800; } .rec-skip { color: #8a5a12; font-weight: 800; }
  .rec-q { padding: .5rem 0; border-top: 1px dashed var(--line); }
  .rec-q small { color: var(--muted); display: block; }
</style>
</head>
<body>
<div class="elh-wrap" id="wrap"><div id="app"><p class="elh-empty">載入中…</p></div></div>
<script src="assets/js/points.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/sync.js"></script>
<script>
(async () => {
  const app = document.getElementById('app');
  const esc = ELH.esc;
  const mins = (s) => (s < 60 ? `${s} 秒` : `${Math.round(s / 6) / 10} 分鐘`);
  const when = (t) => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  try {
    const d = await ELH.loadAll();
    const sid = new URLSearchParams(location.search).get('s');
    const stu = ELH.student(d, sid);
    if (!stu) { app.innerHTML = '<p class="elh-empty">找不到這個學習空間。<a href="index.html">回首頁</a></p>'; return; }
    document.title = `${stu.name}的學習記錄 · E_learning Hub`;
    document.getElementById('wrap').style.setProperty('--accent', stu.color);

    const ptSummary = (p) => (p ? `<span class="rec-pts">+${p.pts} 分</span>` : '<span class="rec-skip">舊規則時期，不計新分</span>');
    const ptDetail = (p) => (!p ? '' : `<div class="rec-q"><b>積分明細：</b>${p.parts.map((x) => esc(x.label) + ' +' + x.pts).join('；') || '本場次沒有得分'}${p.note ? '<small>' + esc(p.note) + '</small>' : ''}</div>`);
    function render() {
      const sessions = ELH.sessionsOf(sid);
      const pinfo = ELH.pointsInfo(sid);
      const mine = d.items.filter((i) => i.student === sid);
      const totalSec = sessions.reduce((a, s) => a + (s.activeSeconds || 0), 0);
      const sum = sessions.reduce((a, s) => ({ c: a.c + (s.correct || 0), t: a.t + (s.total || 0) }), { c: 0, t: 0 });
      const rows = mine.map((i) => {
        const st = ELH.itemState(sid, i.id);
        const ss = sessions.filter((s) => s.material === i.id);
        const lastQ = ss.find((s) => s.total > 0);
        return { i, st, n: ss.length, sec: ss.reduce((a, s) => a + (s.activeSeconds || 0), 0),
          acc: lastQ ? Math.round((lastQ.correct / lastQ.total) * 100) : null, last: st.last };
      }).sort((a, b) => (b.last || 0) - (a.last || 0));

      app.innerHTML = `
        <header class="elh-top">
          <a class="btn btn-outline-secondary elh-btn" href="student.html?s=${encodeURIComponent(sid)}">← 返回</a>
          <h1 style="color:var(--accent)">${esc(stu.icon)} ${esc(stu.name)}的學習記錄</h1>
        </header>
        <div class="rec-stats">
          <div class="rec-stat">積分<b>⭐ ${ELH.points(sid)}</b><small>舊積分 ${pinfo.legacy}（已凍結）＋ 新積分 ${pinfo.fresh}</small></div>
          <div class="rec-stat">已完成教材<b>${ELH.doneCount(sid)} / ${mine.length}</b></div>
          <div class="rec-stat">累計學習時間<b>${esc(mins(totalSec))}</b></div>
          <div class="rec-stat">作答正確率<b>${sum.t ? Math.round((sum.c / sum.t) * 100) + '%' : '—'}</b></div>
        </div>
        <section class="elh-section"><h2>每份教材</h2>
          <div class="rec-scroll"><table class="rec-table"><thead><tr>
            <th>教材</th><th>完成次數</th><th>學習場次</th><th>累計時間</th><th>最近正確率</th><th>最近學習</th></tr></thead><tbody>
            ${rows.map((r) => `<tr><td><a href="viewer.html?id=${encodeURIComponent(r.i.id)}"><b>${esc(r.i.title)}</b></a><br><small>${esc(ELH.stageLabel(d, r.i.stage))}</small></td>
              <td>${ELH.completedTimes(sid, r.i.id)}</td><td>${r.n}</td><td>${esc(mins(r.sec))}</td>
              <td>${r.acc === null ? '—' : r.acc + '%'}</td><td>${r.last ? esc(when(r.last)) : '—'}</td></tr>`).join('') || '<tr><td colspan="6">暫無教材</td></tr>'}
          </tbody></table></div>
        </section>
        <section class="elh-section"><h2>最近作答場次</h2>
          ${sessions.slice(0, 30).map((s) => {
            const t = s.total || 0;
            const bad = (s.answers || []).filter((a) => a.correct === false);
            const skip = (s.answers || []).filter((a) => a.choice == null);
            return `<details class="rec-sess"><summary>
              <span>${esc(when(s.startedAt))}</span><span>${esc(s.title || s.material)}</span>
              <span>用時 ${esc(mins(s.activeSeconds || 0))}</span>
              ${t ? `<span class="rec-ok">對 ${s.correct}</span><span class="rec-bad">錯 ${s.wrong}</span><span class="rec-skip">未做 ${s.unanswered}</span>` : '<span>（此教材沒有作答記錄）'+'</span>'}
              ${s.completed ? '<span class="rec-ok">✓ 已按完成</span>' : ''}${ptSummary(pinfo.bySession[s.id])}</summary>${ptDetail(pinfo.bySession[s.id])}
              ${[...bad.map((a) => ['rec-bad', '答錯', a]), ...skip.map((a) => ['rec-skip', '跳過', a])].map(([c, l, a]) => `<div class="rec-q">
                <span class="${c}">${l}</span> 第 ${esc(a.q)} 題：${esc(a.text)}
                <small>${a.picked ? '所選：' + esc(a.picked) + '　' : ''}正確答案：${esc(a.answer)}</small></div>`).join('') || '<div class="rec-q">沒有錯題。</div>'}
            </details>`;
          }).join('') || '<p class="elh-empty">還沒有作答場次。學習超過幾秒或作答後會自動記錄。</p>'}
        </section>`;
    }
    render();
    ELH_SYNC.init().then((on) => on && ELH_SYNC.pull(sid)).then((got) => got && render());
    window.addEventListener('pageshow', render);
  } catch (e) { ELH.fail(app, e); }
})();
</script>
</body>
</html>
