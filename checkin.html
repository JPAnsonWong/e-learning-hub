<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>今日打卡 · E_learning Hub</title>
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/checkin.css">
</head>
<body>
<div class="elh-wrap" id="wrap">
  <header class="elh-top ck-top">
    <a class="btn btn-outline-secondary elh-btn" href="index.html">← 首頁</a>
    <h1 id="title">✅ 今日打卡</h1>
    <a class="btn elh-btn ck-link-btn" id="rewardBtn" href="rewards.html">🎁 獎勵兌換</a>
    <span class="spacer"></span>
    <div class="ck-clock-top">
      <div class="top-line"><span id="cDate"></span><span id="cGreet"></span></div>
      <div class="time"><span id="cHm"></span><span class="sec" id="cSec"></span></div>
      <div class="ck-dayline"><div class="ck-bar"><i id="cBar"></i></div><span id="cPct"></span></div>
    </div>
  </header>
  <div id="app"><p class="elh-empty">載入中…</p></div>
</div>
<div class="ck-toast" id="toast"></div>
<script src="assets/js/points.js"></script>
<script src="assets/js/daily-rules.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/sync.js"></script>
<script src="assets/js/fx.js"></script>
<script src="assets/js/checkin-core.js"></script>
<script>
(async () => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = ELH.esc, DR = ELH_DAILY, FX = ELH_FX, CK = ELH_CK;
  const app = $('#app');
  const toast = CK.makeToast($('#toast'));

  try {
    const d = await ELH.loadAll();
    const params = new URLSearchParams(location.search);
    const sid = params.get('s') || d.students[0].id;
    const stu = ELH.student(d, sid);
    if (!stu) { app.innerHTML = '<p class="elh-empty">找不到這個學習空間。<a href="index.html">回首頁</a></p>'; return; }
    document.title = `${stu.name} 今日打卡 · E_learning Hub`;
    $('#title').textContent = `✅ ${stu.name}今日打卡`;
    $('#rewardBtn').href = `rewards.html?s=${encodeURIComponent(sid)}`;
    $('#wrap').style.setProperty('--accent', stu.color);
    document.documentElement.style.setProperty('--tint', stu.color + '1f');

    // ---------- 版面 ----------
    app.innerHTML = `
      <div class="ck-who">${d.students.map((s) => `<a href="checkin.html?s=${encodeURIComponent(s.id)}" class="${s.id === sid ? 'on' : ''}" style="${s.id === sid ? 'background:' + s.color : ''}">${esc(s.icon)} ${esc(s.name)}</a>`).join('')}</div>
      <div class="ck-layout">
        <div class="ck-card" id="taskCol"><p class="ck-empty">載入今天的任務…</p></div>
        <div class="ck-side">
          <div class="ck-card"><h2>⏳ 倒數日</h2><div class="ck-cds" id="cds"><div class="ck-hint">載入中…</div></div></div>
          <div class="ck-card"><h2>⭐ 積分</h2>
            <div class="ck-pts3"><div><small id="yLabel">昨日</small><b id="yPts">+0</b></div><div class="exp" id="expBox"><small>待確認</small><b id="expPts" data-v="0">0</b></div><div><small>總分</small><b id="totalPts" data-v="0">0</b></div></div>
            <div class="ck-hint" id="ptsHint"></div>
            <details class="ck-more"><summary>▸ 看明細</summary><div id="ptsDetail"></div></details></div>
        </div>
      </div>`;

    const today = DR.hkDate(Date.now());
    CK.startClock({ date: 'cDate', hm: 'cHm', sec: 'cSec', greet: 'cGreet', pct: 'cPct', bar: 'cBar' }, today);

    // ---------- 資料 ----------
    await ELH_SYNC.init();
    const F = await ELH_SYNC.getFs();
    if (!F) {
      $('#taskCol').innerHTML = '<p class="ck-empty">今日打卡需要連線 Firebase。請確認網站已登入家庭密碼（右下角顯示「☁ 已連線」），或稍後再試。</p>';
      return;
    }
    const emptyHTML = '<p class="ck-empty">今天還沒有任務。<br>任務會在每天開始後，由同步程式從 Notion 自動建立（約每 15 分鐘檢查一次）。如果剛設定好，請稍候，或請爸爸到 GitHub 手動執行一次同步。</p>';
    const list = CK.createTaskList($('#taskCol'), { today, week: true, emptyHTML });
    let rows = [], celebrated = false;

    function renderPoints() {
      const s = DR.summarize(rows, today, Date.now()), ex = ELH.extraOf(sid);
      FX.countTo($('#expPts'), s.pending, 500);
      FX.countTo($('#totalPts'), ELH.totalPoints(sid), 700);
      $('#yPts').textContent = '+' + s.yesterday; $('#yLabel').textContent = s.yesterdayConfirmed ? '昨日確認' : '昨日（待確認）';
      $('#ptsHint').textContent = s.pending || s.pendingUnscored
        ? `待確認 +${s.pending}${s.pendingUnscored ? `（另有 ${s.pendingUnscored} 項待爸爸評分）` : ''}，還沒進入總分；次日 12:00 前沒被爸爸更正就自動確認。`
        : '點一下任務卡片打卡，積分會先變成「待確認」，爸爸沒有更正就會自動確認。';
      $('#ptsDetail').innerHTML = `<div class="ck-row2"><span>舊總分（起始，已凍結）</span><b>${ex.base}</b></div><div class="ck-row2"><span>學習積分（作答）</span><b>${ELH.points(sid)}</b></div><div class="ck-row2"><span>打卡積分（已確認）</span><b>${ex.confirmed}</b></div>`;
    }

    $('#taskCol').addEventListener('click', (e) => { const t = e.target.closest('.ck-task'); if (t) CK.toggle(F, list.get(t.dataset.id), t, $('#expBox'), toast); });
    $('#taskCol').addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && e.target.classList.contains('ck-task')) { e.preventDefault(); e.target.click(); } });

    CK.watch(F, today, (all) => {
      rows = all.filter((r) => r.student === sid);
      const changed = list.update(rows);
      renderPoints();
      const s = DR.summarize(rows, today, Date.now());
      const required = rows.filter((r) => r.date === today && r.cat !== 'week' && !r.optional);
      if (required.length && s.todayRequiredLeft === 0) { if (!celebrated && changed.length) { FX.sfx.fanfare(); toast('🎉 今天的任務全部完成了！太棒了！'); } celebrated = true; } else celebrated = false;
    }, (e) => {
      console.warn('snapshot', e);
      $('#taskCol').innerHTML = `<p class="ck-empty">${e && e.code === 'permission-denied' ? '還沒有讀取權限。請爸爸先到 Firebase 更新 Firestore 安全規則（見 docs/DAILY-CHECKIN-SETUP.md）。' : '讀取今天的任務失敗，請稍後再試。'}</p>`;
    });

    CK.loadCountdowns(F).then((cds) => { $('#cds').innerHTML = CK.countdownsHTML(cds, sid, today); })
      .catch(() => { $('#cds').innerHTML = '<div class="ck-hint">暫時讀不到倒數日</div>'; });

    renderPoints();
    ELH_SYNC.pull(sid).then(() => renderPoints());
    setInterval(renderPoints, 60000); // 每分鐘更新一次（跨過次日 12:00 時，昨日積分會變成「已確認」）
  } catch (e) { ELH.fail(app, e); }
})();
</script>
</body>
</html>
