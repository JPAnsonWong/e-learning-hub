<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Unit 4 Let's go shopping! 預習・練習・複習</title>
<style>
html,body,#app{height:100%;overflow:hidden;margin:0;padding:0}
:root{--bg:#f4efe6;--card:#ffffff;--text:#22272b;--accent:#2d6cdf;--accent2:#1b4fb0;--green:#1e9e50;--red:#d93a3a;--line:#d8d2c6;--soft:#f0e9dc}
*{box-sizing:border-box}
body{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{display:grid;grid-template-columns:56% 44%;height:100%}
.left{padding:1.6vmin 2vmin;overflow:auto;height:100%;border-right:2px solid var(--line)}
.right{padding:1.6vmin 2vmin;overflow:auto;height:100%;background:var(--card)}
h1{font-size:clamp(1.5rem,5vmin,3.2rem);margin:.2em 0}
h2{font-size:clamp(1.3rem,4.2vmin,2.6rem);margin:.2em 0}
h3{font-size:clamp(1.1rem,3.4vmin,2rem);margin:.3em 0}
.topic{font-size:clamp(1.15rem,3.8vmin,2.4rem);margin:.5rem 0;line-height:1.35}
.option{font-size:clamp(1.05rem,3.2vmin,2rem);margin:.3rem 0;line-height:1.3}
.hint{font-size:clamp(0.95rem,2.4vmin,1.4rem);color:#5a5347;margin:.3rem 0;line-height:1.4}
.small{font-size:clamp(0.9rem,2.4vmin,1.35rem);color:#6b6355}
.btn{display:inline-block;min-height:max(3rem,7vmin);min-width:max(3rem,7vmin);padding:.35em .9em;background:var(--accent);color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:clamp(1rem,3vmin,1.7rem);font-family:inherit;touch-action:manipulation;margin:.25rem .25rem .25rem 0;line-height:1.2}
.btn:active{transform:scale(.97)}
.btn-secondary{background:#6c757d}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-ghost{background:#fff;color:var(--accent2);border:2px solid var(--accent2)}
.btn-gray{background:#e9ecef;color:#212529}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.cover-btn{display:block;width:100%;min-height:max(3rem,14vmin);margin:1.2vmin 0;font-size:clamp(1.3rem,4.2vmin,2.6rem);background:#fff;border:3px solid var(--accent);color:var(--accent2);border-radius:14px;touch-action:manipulation;font-family:inherit;font-weight:700}
.opt{display:block;width:100%;text-align:left;min-height:max(3rem,8vmin);margin:.4vmin 0;padding:.4em .8em;font-size:clamp(1.05rem,3.2vmin,2rem);border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--text);font-family:inherit;touch-action:manipulation;line-height:1.3}
.opt.ok{background:#d9f2e0;border-color:var(--green);color:#0d5c2c}
.opt.bad{background:#fbdada;border-color:var(--red);color:#8a1414}
.opt.sel{border-color:var(--accent);background:#e7efff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.2vmin}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.2vmin}
.shop-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.8vmin;align-items:stretch}
.shop-grid .opt{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:.3em .3em .4em;min-height:max(3rem,7vmin);margin:0;font-size:clamp(0.9rem,2.4vmin,1.35rem);line-height:1.2}
.shop-grid .opt svg{width:100%;height:auto;max-height:9vmin;display:block}
.floor-grid .opt{margin:.3vmin 0}
.card{min-height:max(3rem,9vmin);border:2px solid var(--line);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:.6vmin;font-size:clamp(1rem,3vmin,1.8rem);cursor:pointer;touch-action:manipulation;line-height:1.25}
.card.ok{border-color:var(--green);background:#d9f2e0}
.card.bad{border-color:var(--red);background:#fbdada}
.card.pick{border-color:var(--accent);background:#e7efff}
.card .svgwrap svg{width:100%;height:auto;max-height:11vmin}
.pill{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:.15em .7em;margin:.15em .1em;font-size:clamp(1rem,3vmin,1.8rem);min-height:max(2.6rem,6vmin);line-height:1.4}
.wordbank .pill{cursor:pointer}
.wordbank .pill.used{opacity:.35;pointer-events:none}
.sent .pill{cursor:pointer;background:#fff7e0;border-color:#d9b45c}
.progress{font-size:clamp(1rem,2.8vmin,1.7rem);color:#4a4436;margin:.2rem 0;font-weight:700}
.navrow{margin-top:1.2vmin}
.passage{white-space:pre-wrap;font-size:clamp(1.05rem,3.2vmin,2rem);line-height:1.55;background:#fffdf7;border:1px solid var(--line);border-radius:10px;padding:1.4vmin}
table.dir{border-collapse:collapse;width:100%;font-size:clamp(1rem,3vmin,1.8rem)}
table.dir th,table.dir td{border:1px solid var(--line);padding:.5vmin .8vmin;text-align:left}
table.dir th{background:#eef3ff}
.speaker{display:inline-flex;align-items:center;justify-content:center;min-width:max(3rem,9vmin);min-height:max(3rem,9vmin);border-radius:50%;background:#fff3c4;border:2px solid #d9b45c;cursor:pointer;touch-action:manipulation;padding:.4vmin}
.speaker svg{width:60%;height:auto}
.bigspeaker{width:22vmin;height:22vmin;background:#ffe9a8;border:3px solid #d9b45c;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;margin:1vmin 0}
.bigspeaker svg{width:60%;height:60%}
.feedback{min-height:2.2em;font-size:clamp(1.05rem,3.2vmin,2rem);font-weight:700;margin:.4rem 0}
.feedback.ok{color:var(--green)}
.feedback.bad{color:var(--red)}
.narrow{grid-template-columns:100% !important}
.scroll-area::after{content:"";display:block;height:50vh}
html{scroll-padding-top:12vh}
input,textarea{scroll-margin-top:12vh}
.mapbox{background:#fff;border:2px solid var(--line);border-radius:12px;padding:1vmin}
.mapbox svg{width:100%;height:auto;display:block}
.hl{fill:#ffe08a !important;stroke:#c98a00 !important;stroke-width:3}
.centerwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:2vmin}
@media (max-width:900px),(orientation:portrait){
  #app{grid-template-columns:100% !important;grid-template-rows:auto auto}
  .left{height:auto;max-height:55%;border-right:none;border-bottom:2px solid var(--line)}
  .right{height:auto;max-height:45%}
}
</style>
</head>
<body>
<div id="app">
  <div class="left" id="left"></div>
  <div class="right" id="right"></div>
</div>

":"rv","title":"複習","modules":["rv-words","rv-grammar"]}],"modules":[{"id":"pv-words","section":"pv","title":"必記單詞（聽讀點選、翻牌配對）","short":"必記單詞"},{"id":"pv-text","section":"pv","title":"課文重點（課本 pp.40–41）","short":"課文重點"},{"id":"pv-grammar","section":"pv","title":"重點語法（位置與問路）","short":"重點語法","demos":2},{"id":"pr-words","section":"pr","title":"單詞與樓層","short":"單詞與樓層"},{"id":"pr-pos","section":"pr","title":"位置（next to / between / opposite）","short":"位置"},{"id":"pr-dir","section":"pr","title":"問路與方向","short":"問路與方向"},{"id":"pr-read","section":"pr","title":"課文技能理解","short":"課文技能理解"},{"id":"rv-words","section":"rv","title":"必記單詞抽認","short":"單詞抽認"},{"id":"rv-grammar","section":"rv","title":"重點語法再練","short":"語法再練"}],"grammarDemos":[{"id":"demo-a","map":"mapA","title":"位置語法示範","lines":["The pet shop is next to the hair salon.","The pet shop is between the gift shop and the hair salon.","The pet shop is opposite the shoe shop."]},{"id":"demo-b","map":"mapB","title":"問路語法示範","lines":["Turn left.","Turn right.","Walk along Lake Street.","Walk across the road.","It is on your left.","It is on your right.","How can I get to the toy shop?"]}],"questions":[{"q":"pv-s01","module":"pv-words","type":"listen-shop","prompt":"點選你聽到的商店","tts":"a hair salon","answer":"a hair salon","shop":"hair-salon","hint":"剛才聽到的是 a hair salon（髮廊）。"},{"q":"pv-s02","module":"pv-words","type":"listen-shop","prompt":"點選你聽到的商店","tts":"a pet shop","answer":"a pet shop","shop":"pet-shop","hint":"剛才聽到的是 a pet shop（寵物店）。"},{"q":"pv-s03","module":"pv-words","type":"listen-shop","prompt":"點選你聽到的商店","tts":"a bookshop","answer":"a bookshop","shop":"bookshop","hint":"剛才聽到的是 a bookshop（書店）。"},{"q":"pv-s04","module":"pv-words","type":"listen-shop","prompt":"點選你聽到的商店","tts":"a toy shop","answer":"a toy shop","shop":"toy-shop","hint":"剛才聽到的是 a toy shop（玩具店）。"},{"q":"pv-s05","module":"pv-words","type":"listen-shop","prompt":"點選你聽到的商店","tts":"a cafe","answer":"a cafe","shop":"cafe","hint":"剛才聽到的是 a cafe（咖啡店）。"},{"q":"pv-s06"," /* ============ TTS ============ */
function speak(text){
  try{
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-GB";
    var vs = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
    for(var i=0;i<vs.length;i++){
      if(vs[i] && /en/i.test(vs[i].lang||"")){ u.voice = vs[i]; break; }
    }
    window.speechSynthesis.speak(u);
  }catch(e){}
}
if(window.speechSynthesis && window.speechSynthesis.getVoices){ try{ window.speechSynthesis.getVoices(); }catch(e){} }

function showSection(sid){
  sectionId = sid;
  var sec = sectionById(sid);
  if(!sec) return;
  var html = '<h2>'+esc(sec.title)+' 目錄</h2>';
  html += '<p class="progress">'+esc(sec.title)+'｜'+esc(sec.id==="pv"?"預習":(sec.id==="pr"?"練習":"複習"))+'</p>';
  html += '<p class="option">請選擇一個模塊，或依序做完本塊：</p>';
  for(var i=0;i<MODULES.length;i++){
    var m = MODULES[i];
    if(m.section!==sid) continue;
    var done = countModuleDone(m.id);
    html += '<button class="opt" data-mod="'+esc(m.id)+'">'+esc(m.title)+' <span class="small">（'+done+'）</span></button>';
  }
  html += '<div class="navrow"><button class="btn btn-green" data-seq="1">依序做完本塊</button>'+
          '<button class="btn btn-secondary" data-go="cover">返回封面</button></div>';
  setLeft(html);
  setRight('<h3>本塊模塊</h3><p class="hint">'+esc(sec.title)+' 共有 '+MODULES.filter(function(m){return m.section===sid;}).length+' 個模塊。依序模式會由第一個模塊自動做到最後一個。</p>');
  bindNav();
}
function countModuleDone(mid){
  var qs = questionsOfModule(mid);
  var n=0; for(var i=0;i<qs.length;i++) if(revealed[qs[i].q.q]) n++;
  return n+' / '+qs.length;
}
function questionsOfModule(mid){
  var out=[];
  for(var i=0;i<QUESTIONS.length;i++){
    if(QUESTIONS[i].module===mid) out.push({q:QUESTIONS[i], idx:i});
  }
  return out;
}
function enterModule(mid, seq){
  var m = moduleById(mid);
  if(!m) return;
  moduleId = mid;
  moduleQs = questionsOfModule(mid);
  li = 0;
  if(m.demos && m.demos>0){
    view="demo"; demoStep=1;
    var gd = grammarDemoFor(mid);
    demoMap = gd ? gd.map : "mapA";
    demoLines = gd ? gd.lines : [];
    demoNext = "q";
    qIndex = qIndexByQid("pv-g01");
    if(qIndex<0) qIndex = 0;
    renderDemo();
  }else{
    startQuestion();
  }
}
function grammarDemoFor(mid){
  if(mid==="pv-g02") return GRAMMAR_DEMOS[1]||null;
  return GRAMMAR_DEMOS[0]||null;
}

  var i = (demoStep===2) ? 1 : 0;
  return GRAMMAR_DEMOS[i]||null;
}
function renderDemo(){
  var gd = currentDemo();
  if(gd && gd.lines) demoLines = gd.lines;
  var left = (gd && gd.map==="mapB") || demoStep===2 ? mapB() : mapA({demo:true});

  right += '<button class="btn btn-green" data-demo="start">開始作答</button>';

  right += '<button class="btn btn-secondary" data-go="cover">返回封面</button></div>';

function bindDemo(){
  var bs = document.querySelectorAll("[data-demo]");
  for(var i=0;i<bs.length;i++){
    bs[i].onclick = (function(v){ return function(){
      if(v==="2"){ demoStep=2; renderDemo(); }
      else { startQuestion(); }
    }; })(bs[i].getAttribute("data-demo"));
  }
}

/* ============ 作答主流程 ============ */
var qIndex = -1;   // 目前題目在全體 123 題中的索引
function curQ(){ return (qIndex>=0 && qIndex<QUESTIONS.length) ? QUESTIONS[qIndex] : null; }
function startQuestion(){
  if(moduleQs && moduleQs.length){
    if(li<0) li=0;
    if(li>=moduleQs.length) li=moduleQs.length-1;
    qIndex = moduleQs[li].idx;
  }
  view="q";
  var q = curQ();
  if(!q){ showSection(sectionId); return; }
  lastResult = null;
  if(q.type==="listen-shop" || q.type==="listen-floor"){
    if(!listenOrder[q.q]){ listenOrder[q.q] = shuffledIndexes(q.type==="listen-shop"?SHOPS.length:FLOORS.length); }
  }
  if(q.type==="match"){
    if(!matchOrder[q.q]){ matchOrder[q.q] = shuffledIndexes((q.pairs||[]).length*2); }
    if(!matchPairs[q.q]) matchPairs[q.q] = {};
    if(matchSel[q.q]==null) matchSel[q.q] = null;
  }
  if(q.type==="build"){
    if(!buildSeq[q.q]) buildSeq[q.q] = [];
  }
  renderQuestion();
  if(q.tts){ try{ speak(q.tts); }catch(e){} }
}
function shuffledIndexes(n){
  var a=[]; for(var i=0;i<n;i++) a.push(i);
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function renderQuestion(){
  var q = curQ(); if(!q) return;
  var sec = sectionById(sectionId);
  var mod = moduleById(moduleId);
  var leftHtml = "", rightHtml = "";
  var prog = esc(sec.title)+'｜'+esc(mod?mod.title:'')+'　'+(li+1)+' / '+moduleQs.length;
  var head = '<p class="progress">'+prog+'</p>';

  /* ---- 左欄 ---- */
  leftHtml += head;
  var leftId = q.left;
  if(q.type==="listen-shop"){
    leftHtml += '<p class="topic">請聽喇叭，點選正確的商店。</p>';
    leftHtml += '<button class="bigspeaker" data-speak="1" aria-label="播放">'+speakerSvg(true)+'</button>';
    leftHtml += '<p class="hint">進入題目時會自動播放一次，可重複按喇叭。</p>';
  }else if(q.type==="listen-floor"){
    leftHtml += '<p class="topic">請聽喇叭，點選正確的樓層。</p>';
    leftHtml += '<button class="bigspeaker" data-speak="1" aria-label="播放">'+speakerSvg(true)+'</button>';
  }else if(q.type==="match"){
    leftHtml += '<p class="topic">翻牌配對：先點一張，再點另一張。</p>';
    leftHtml += '<p class="hint">全部配對成功才算答對。</p>';
  }else if(q.type==="mcq"){
    leftHtml += '<p class="topic">'+esc(q.stem||'')+'</p>';
    if(q.icon){ leftHtml += '<div style="width:16vmin">'+iconSvg(q.icon)+'</div>'; if(q.icon_zh) leftHtml += '<p class="hint">'+esc(q.icon_zh)+'</p>'; }
    leftHtml += leftContent(leftId, q);
  }else if(q.type==="build"){
    leftHtml += '<p class="topic">'+esc(q.stem||'')+'</p>';
    leftHtml += leftContent(leftId, q);
  }
  setLeft(leftHtml);

  /* ---- 右欄 ---- */
  rightHtml += '<p class="progress">第 '+(qIndex+1)+' / '+TOTAL+' 題（共 '+TOTAL+' 題）</p>';
  if(q.type==="listen-shop"){
    rightHtml += '<p class="topic">聽到哪一間商店？</p>';
    rightHtml += '<div class="shop-grid">';
    var order = listenOrder[q.q]||[];
    for(var i=0;i<order.length;i++){
      var si = order[i];
      rightHtml += '<button class="opt" data-shop="'+si+'">'+shopSvg(SHOPS[si].id)+'<span>'+esc(SHOPS[si].en)+'</span></button>';
    }
    rightHtml += '</div>';
  }else if(q.type==="listen-floor"){
    rightHtml += '<p class="topic">聽到哪一層樓？</p><div class="floor-grid">';
    var fo = listenOrder[q.q]||[];
    for(var i=0;i<fo.length;i++){
      var fi = fo[i];
      rightHtml += '<button class="opt" data-floor="'+fi+'"><b>'+esc(FLOORS[fi].short)+'</b>　'+esc(FLOORS[fi].en)+'</button>';
    }
    rightHtml += '</div>';
  }else if(q.type==="match"){
    rightHtml += '<p class="topic">把相同的配對起來</p>';
    rightHtml += matchGrid(q);
  }else if(q.type==="mcq"){
    rightHtml += '<p class="topic">請選擇正確答案。</p>';
    var opts = q.options||[];
    for(var i=0;i<opts.length;i++){
      rightHtml += '<button class="opt" data-mcq="'+i+'">'+esc(opts[i])+'</button>';
    }
  }else if(q.type==="build"){
    rightHtml += '<p class="topic">點詞語組句。</p>';
    rightHtml += buildArea(q);
  }
  rightHtml += '<div class="feedback" id="fb"></div>';
  rightHtml += '<div class="navrow">'+
    '<button class="btn btn-ghost" data-act="showAnswer">看答案</button>'+
    '<button class="btn" data-act="next" '+(revealed[q.q]?'':'disabled')+'>下一題</button>'+
    '<button class="btn btn-secondary" data-act="prev" '+(li>0?'':'disabled')+'>上一題</button>'+
    '<button class="btn btn-secondary" data-nav="module">返回本塊目錄</button>'+
    '<button class="btn btn-secondary" data-go="cover">返回封面</button></div>';
  if(q.hint && revealed[q.q]) rightHtml += '<p class="hint">提示：'+esc(q.hint)+'</p>';
  setRight(rightHtml);

  bindQuestion(q);
  applyRevealed(q);
  elhState();
}
function leftContent(leftId, q){
  var h = "";
  if(!leftId) return h;
  if(leftId==="pv-dir"){
    h += '<div class="passage">'+esc(PASSAGES["pv-t4"]||'')+'</div>';
    h += dirTable("wonder");
  }else if(leftId==="pr-t4dir"){
    h += '<div class="passage">'+esc(PASSAGES["pr-t4"]||'')+'</div>';
    h += dirTable("sunny");
  }else if(leftId==="pr-dir"){
    h += dirTable("sunny");
  }else if(leftId==="mapA"){ h += mapA(); }
  else if(leftId==="mapB"){ h += mapB(); }
  else if(leftId==="shop-scene"){
    h += '<p class="topic">'+esc(q.stem||'')+'</p>';
    if(q.icon) h += '<div style="width:20vmin">'+shopSvg(q.icon)+'</div>';
  }else if(leftId==="floor-scene"){
    var f = q.floor!=null ? floorById(q.floor) : FLOORS[0];
    h += '<div class="centerwrap" style="height:30vmin"><div style="font-size:clamp(3rem,12vmin,7rem);font-weight:800;color:#2d6cdf">'+esc(f?f.short:'')+'</div><p class="topic">'+esc(f?f.en:'')+'</p></div>';
  }else if(leftId==="spell"){
    h += '<div class="centerwrap" style="height:26vmin"><svg viewBox="0 0 52 52" style="width:18vmin"><path d="M8 12 h16 v28 h-16 z M28 12 h16 v28 h-16 z" fill="#8ecae6" stroke="#222" stroke-width="2"/><path d="M24 14 v24" stroke="#222" stroke-width="2"/></svg></div><p class="hint">Which one is correct? 點選正確的寫法。</p>';
  }else if(leftId==="review-icon"){
    if(q.icon) h += '<div style="width:22vmin">'+iconSvg(q.icon)+'</div>';
    if(q.icon_zh) h += '<p class="hint">提示：'+esc(q.icon_zh)+'</p>';
  }else if(PASSAGES[leftId]!=null){
    h += '<div class="passage">'+esc(PASSAGES[leftId])+'</div>';
  }else{
    h += '<p class="hint">（左欄內容）</p>';
  }
  return h;
}
function dirTable(which){
  var d = DIRS && DIRS[which] ? DIRS[which] : [];
  var h = '<h3>'+(which==="wonder"?"Wonder 商場目錄":"Sunny 商場目錄")+'</h3><table class="dir"><tr><th>樓層</th><th>商店</th></tr>';
  for(var i=0;i<d.length;i++){
    h += '<tr><td>'+esc(d[i].floor)+'</td><td>'+esc(d[i].shops.join("、"))+'</td></tr>';
  }
  h += '</table>';
  return h;
}
function matchGrid(q){
  var pairs = q.pairs||[];
  var order = matchOrder[q.q]||[];
  var h = '<div class="grid2">';
  for(var k=0;k<order.length;k++){
    var c = order[k];
    var pIdx = Math.floor(c/2), side = c%2;
    var p = pairs[pIdx]||{};
    var txt = "";
    if(p.kind==="shop"){
      if(side===0) txt = p.en;
      else txt = shopSvg(p.id);
    }else{
      if(side===0) txt = p.short;
      else txt = p.en;
    }
    var cls = "card";
    if(matchPairs[q.q] && matchPairs[q.q][pIdx]) cls += " ok";
    else if(matchSel[q.q]===c) cls += " pick";
    h += '<div class="'+cls+'" data-card="'+c+'" data-p="'+pIdx+'">'+txt+'</div>';
  }
  h += '</div>';
  return h;
}
function buildArea(q){
  var words = q.words||[];
  var seq = buildSeq[q.q]||[];
  var used = {};
  for(var i=0;i<seq.length;i++) used[seq[i]] = (used[seq[i]]||0)+1;
  var h = '<p class="hint">詞庫（點選加入句子）：</p><div class="wordbank">';
  for(var i=0;i<words.length;i++){
    var cnt = used[i]||0;
    h += '<span class="pill'+(cnt?' used':'')+'" data-word="'+i+'">'+esc(words[i])+'</span>';
  }
  h += '</div>';
  h += '<p class="hint">你的句子：</p><div class="sent" id="buildSent">';
  if(seq.length===0) h += '<span class="pill" style="opacity:.5">（尚未組句）</span>';
  for(var i=0;i<seq.length;i++){
    h += '<span class="pill" data-seq="'+i+'">'+esc(words[seq[i]])+'</span>';
  }
  h += '</div>';
  h += '<div class="navrow">'+
    '<button class="btn" data-build="back">退格</button>'+
    '<button class="btn btn-secondary" data-build="clear">清除</button>'+
    '<button class="btn btn-green" data-build="submit">提交</button></div>';
  return h;
}

/* ---- 綁定與批改 ---- */
function bindQuestion(q){
  var sp = document.querySelectorAll("[data-speak]");
  for(var i=0;i<sp.length;i++) sp[i].onclick = function(){ if(q.tts) speak(q.tts); };
  var sh = document.querySelectorAll("[data-shop]");
  for(var i=0;i<sh.length;i++) sh[i].onclick = (function(el){ return function(){ pickListen(q, Number(el.getAttribute("data-shop")), SHOPS[Number(el.getAttribute("data-shop"))].en, el); }; })(sh[i]);
  var fl = document.querySelectorAll("[data-floor]");
  for(var i=0;i<fl.length;i++) fl[i].onclick = (function(el){ return function(){ pickListen(q, Number(el.getAttribute("data-floor")), FLOORS[Number(el.getAttribute("data-floor"))].short+" "+FLOORS[Number(el.getAttribute("data-floor"))].en, el); }; })(fl[i]);
  var cd = document.querySelectorAll("[data-card]");
  for(var i=0;i<cd.length;i++) cd[i].onclick = (function(el){ return function(){ cardClick(q, Number(el.getAttribute("data-card"))); }; })(cd[i]);
  var mc = document.querySelectorAll("[data-mcq]");
  for(var i=0;i<mc.length;i++) mc[i].onclick = (function(el){ return function(){ pickMcq(q, Number(el.getAttribute("data-mcq")), el); }; })(mc[i]);
  var wb = document.querySelectorAll("[data-word]");
  for(var i=0;i<wb.length;i++) wb[i].onclick = (function(el){ return function(){ buildAdd(q, Number(el.getAttribute("data-word"))); }; })(wb[i]);
  var sq = document.querySelectorAll("[data-seq]");
  for(var i=0;i<sq.length;i++) sq[i].onclick = (function(el){ return function(){ buildRemoveAt(q, Number(el.getAttribute("data-seq"))); }; })(sq[i]);
  var bb = document.querySelectorAll("[data-build]");
  for(var i=0;i<bb.length;i++) bb[i].onclick = (function(el){ return function(){ buildAct(q, el.getAttribute("data-build")); }; })(bb[i]);
  bindCommon(q);
}
function bindCommon(q){
  var sa = document.querySelectorAll("[data-act]");
  for(var i=0;i<sa.length;i++){
    sa[i].onclick = (function(el){ return function(){
      var a = el.getAttribute("data-act");
      if(a==="showAnswer") showAnswer(q);
      else if(a==="next") nextQ();
      else if(a==="prev") prevQ();
    }; })(sa[i]);
  }
}
function bindNav(){
  var g = document.querySelectorAll("[data-go]");
  for(var i=0;i<g.length;i++) g[i].onclick = (function(el){ return function(){
    var v = el.getAttribute("data-go");
    if(v==="cover") showCover();
    else showSection(v);
  }; })(g[i]);
  var m = document.querySelectorAll("[data-mod]");
  for(var i=0;i<m.length;i++) m[i].onclick = (function(el){ return function(){ enterModule(el.getAttribute("data-mod"), false); }; })(m[i]);
  var s = document.querySelectorAll("[data-seq]");
  for(var i=0;i<s.length;i++) s[i].onclick = function(){ startSequential(); };
  var n = document.querySelectorAll("[data-nav]");
  for(var i=0;i<n.length;i++) n[i].onclick = (function(el){ return function(){
    var v = el.getAttribute("data-nav");
    if(v==="module") showSection(sectionId);
  }; })(n[i]);
}
function pickListen(q, stableIdx, text, el){
  var correct = false;
  if(q.type==="listen-shop"){
    correct = (SHOPS[stableIdx] && (SHOPS[stableIdx].en === q.answer || SHOPS[stableIdx].id === q.shop));
  }else if(q.type==="listen-floor"){
    correct = (FLOORS[stableIdx] && (FLOORS[stableIdx].id === q.floor || (FLOORS[stableIdx].short+" "+FLOORS[stableIdx].en) === q.answer));
  }
  applyPick(q, stableIdx, text, correct, el);
}
function pickMcq(q, idx, el){
  var correct = (idx === q.correct);
  applyPick(q, idx, q.options[idx], correct, el);
}
function applyPick(q, choice, text, correct, el){
  picked[q.q] = choice;
  if(correct){
    revealed[q.q] = true;
    if(el) el.classList.add("ok");
    showFb(q, true);
    reportAnswer(q, choice, true, text);
    lastResult = {qid:q.q, ok:true};
    if(sectionId==="rv") removeRvWrong(q.q);
    renderQuestion();
    var fb=document.getElementById("fb");
    if(fb){ fb.className="feedback ok"; fb.textContent = (praises[(praiseIdx=praiseIdx%praises.length)]||"Great!"); praiseIdx++; }
    elhState();
  }else{
    wrongOnce[q.q] = true;
    if(sectionId==="rv"){ if(rvWrong.indexOf(q.q)<0) rvWrong.push(q.q); }
    if(el) el.classList.add("bad");
    showFb(q, false);
    reportAnswer(q, choice, false, text);
    lastResult = {qid:q.q, ok:false};
    elhState();
    setTimeout(function(){
      revealed[q.q] = true;
      renderQuestion();
      var fb=document.getElementById("fb");
      if(fb){ fb.className="feedback bad"; fb.textContent="正確答案："+answerText(q)+"。 "+(q.hint||""); }
      elhState();
    }, 450);
  }
}
function showFb(q, ok){
  var fb = document.getElementById("fb");
  if(!fb) return;
  if(ok){
    praiseIdx = (praiseIdx+1)%praises.length;
    fb.className = "feedback ok";
    fb.textContent = praises[praiseIdx];
  }else{
    fb.className = "feedback bad";
    fb.textContent = "再想想：" + (q.hint || "請看提示。");
  }
}
function showAnswer(q){
  if(!revealed[q.q] && picked[q.q]==null){
    reportAnswer(q, null, false, null);
  }
  revealed[q.q] = true;
  if(q.type==="match"){ matchPairs[q.q] = {}; for(var i=0;i<(q.pairs||[]).length;i++) matchPairs[q.q][i]=true; renderQuestion(); }
  else renderQuestion();
  var fb = document.getElementById("fb");
  if(fb){ fb.className="feedback"; fb.textContent = "正確答案：" + answerText(q); }
  elhState();
}
function answerText(q){
  if(q.type==="listen-shop") return q.answer;
  if(q.type==="listen-floor") return q.answer;
  if(q.type==="match"){ var ps=q.pairs||[]; var a=[]; for(var i=0;i<ps.length;i++) a.push(ps[i].en); return a.join(" / "); }
  if(q.type==="mcq") return q.options[q.correct];
  if(q.type==="build") return q.answer;
  return "";
}
function applyRevealed(q){
  if(!revealed[q.q]) return;
  if(q.type==="mcq"){
    var opts = document.querySelectorAll("[data-mcq]");
    for(var i=0;i<opts.length;i++){
      var n = Number(opts[i].getAttribute("data-mcq"));
      if(n===q.correct) opts[i].classList.add("ok");
      else if(picked[q.q]!=null && n===picked[q.q] && n!==q.correct) opts[i].classList.add("bad");
    }
  }else if(q.type==="listen-shop"){
    var sh = document.querySelectorAll("[data-shop]");
    for(var i=0;i<sh.length;i++){
      var si = Number(sh[i].getAttribute("data-shop"));
      var isAns = SHOPS[si] && (SHOPS[si].en===q.answer || SHOPS[si].id===q.shop);
      if(isAns) sh[i].classList.add("ok");
      else if(picked[q.q]!=null && si===picked[q.q]) sh[i].classList.add("bad");
    }
  }else if(q.type==="listen-floor"){
    var fl = document.querySelectorAll("[data-floor]");
    for(var i=0;i<fl.length;i++){
      var fi = Number(fl[i].getAttribute("data-floor"));
      var isAnsF = FLOORS[fi] && (FLOORS[fi].id===q.floor || (FLOORS[fi].short+" "+FLOORS[fi].en)===q.answer);
      if(isAnsF) fl[i].classList.add("ok");
      else if(picked[q.q]!=null && fi===picked[q.q]) fl[i].classList.add("bad");
    }
  }else if(q.type==="match"){
    var cd = document.querySelectorAll("[data-card]");
    for(var i=0;i<cd.length;i++) cd[i].classList.add("ok");
  }else if(q.type==="build"){
    var bs = document.querySelectorAll("[data-seq]");
    for(var i=0;i<bs.length;i++) bs[i].classList.add("ok");
  }
  var fb = document.getElementById("fb");
  if(fb){ fb.className="feedback"; fb.textContent = "正確答案：" + answerText(q); }
}
function removeRvWrong(qid){
  var out=[];
  for(var i=0;i<rvWrong.length;i++) if(rvWrong[i]!==qid) out.push(rvWrong[i]);
  rvWrong = out;
}
function nextQ(){
  if(li < moduleQs.length-1){ li++; startQuestion(); }
  else moduleDone();
}
function prevQ(){
  if(li>0){ li--; startQuestion(); }
}
function moduleDone(){
  if(seqMode && moduleQueue.length){
    var next = moduleQueue.shift();
    enterModule(next, true);
    return;
  }
  if(sectionId==="rv"){
    var gm = moduleById("rv-grammar");
    var gmDone = true;
    if(gm){
      var gqs = questionsOfModule("rv-grammar");
      for(var i=0;i<gqs.length;i++) if(!revealed[gqs[i].q.q]){ gmDone=false; break; }
    }
    if(gmDone){ showReviewEnd(); return; }
    showSection("rv");
    return;
  }
  showSection(sectionId);
}

/* ---- 翻牌 ---- */
function cardClick(q, c){
  if(revealed[q.q]) return;
  var sel = matchSel[q.q];
  if(sel===c){ matchSel[q.q]=null; renderQuestion(); return; }
  if(sel==null){ matchSel[q.q]=c; renderQuestion(); return; }
  var a=sel, b=c;
  matchSel[q.q]=null;
  var pa=Math.floor(a/2), pb=Math.floor(b/2);
  if(pa===pb && a!==b){
    matchPairs[q.q][pa]=true;
    var all=true; for(var i=0;i<(q.pairs||[]).length;i++) if(!matchPairs[q.q][i]) all=false;
    if(all){
      revealed[q.q]=true;
      var combo=[]; for(var j=0;j<(q.pairs||[]).length;j++) combo.push(q.pairs[j].en);
      reportAnswer(q, 1, true, combo.join(" / "));
      lastResult={qid:q.q, ok:true};
      if(sectionId==="rv") removeRvWrong(q.q);
    }
  }else{
    var ca=document.querySelector('[data-card="'+a+'"]'), cb=document.querySelector('[data-card="'+b+'"]');
    if(ca) ca.classList.add("bad"); if(cb) cb.classList.add("bad");
    setTimeout(function(){ if(!revealed[q.q]) renderQuestion(); }, 450);
  }
  renderQuestion();
  elhState();
}

/* ---- 組句 ---- */
function buildAdd(q, wi){
  buildSeq[q.q].push(wi);
  renderQuestion();
  elhState();
}
function buildRemoveAt(q, pos){
  buildSeq[q.q].splice(pos,1);
  renderQuestion();
  elhState();
}
function buildAct(q, act){
  if(act==="back") buildSeq[q.q].pop();
  else if(act==="clear") buildSeq[q.q]=[];
  else if(act==="submit"){
    var words=q.words||[];
    var sent="";
    for(var i=0;i<buildSeq[q.q].length;i++) sent += (i?" ":"") + words[buildSeq[q.q][i]];
    sent = sent.replace(/\s+\./g,".").trim();
    var ok = (sent === q.answer);
    picked[q.q] = sent;
    if(ok){
      revealed[q.q]=true;
      reportAnswer(q, sent, true, sent);
      lastResult={qid:q.q, ok:true};
      if(sectionId==="rv") removeRvWrong(q.q);
    }else{
      wrongOnce[q.q]=true;
      revealed[q.q]=true;
      if(sectionId==="rv"){ if(rvWrong.indexOf(q.q)<0) rvWrong.push(q.q); }
      reportAnswer(q, sent, false, sent);
      lastResult={qid:q.q, ok:false};
    }
    renderQuestion();
    var fb=document.getElementById("fb");
    if(fb){ fb.className="feedback "+(ok?"ok":"bad"); fb.textContent = ok ? praises[praiseIdx=(praiseIdx+1)%praises.length] : ("正確句是：" + q.answer + "。" + (q.hint||"")); }
    elhState();
    return;
  }
  renderQuestion();
  elhState();
}

/* ---- 回報 ---- */
function reportAnswer(q, choice, correct, pickedText){
  elhReport({
    type:"answer",
    q: q.q,
    choice: choice,
    correct: !!correct,
    text: elhText(q.stem || q.prompt || q.hint || ""),
    picked: (pickedText==null? null : String(pickedText)),
    answer: elhText(answerText(q))
  });
}

/* ---- 斷點續做 ---- */
function elhState(){
  if(view==="cover" || view==="section" || view==="module" || qIndex<0) return;
  var d = {
    i: qIndex,
    m: moduleId,
    li: li,
    loc: (view==="demo" ? ("demo"+demoStep) : (view==="rvend" ? "rvend" : (redoList.length? "redo":"q"))),
    sec: sectionId,
    seq: seqMode?1:0,
    p: picked,
    r: revealed,
    lo: listenOrder,
    mo: matchOrder,
    mp: matchPairs,
    ms: matchSel,
    bs: buildSeq,
    rw: rvWrong,
    dl: redoList
  };
  elhReport({type:"state", data:d});
}

/* ---- 複習結尾與錯題重做 ---- */
function showReviewEnd(){
  view="rvend";
  var lastIdx = qIndexByQid("rv-g10");
  if(lastIdx<0) lastIdx = QUESTIONS.length-1;
  qIndex = lastIdx;
  var hasWrong = false;
  for(var i=0;i<QUESTIONS.length;i++){
    var q=QUESTIONS[i];
    if(q.module && q.module.indexOf("rv-")===0 && rvWrong.indexOf(q.q)>=0) hasWrong=true;
  }
  var left = '<h2>複習完成</h2><p class="topic">本場複習已做完。</p>';
  var right = "";
  if(hasWrong){
    right += '<p class="topic">本場有答錯的複習題，可以重做錯題。</p>';
    right += '<button class="btn btn-green" data-redo="1">重做錯題</button>';
  }else{
    right += '<p class="topic" style="color:var(--green)">Well done! You can go back and practise again tomorrow.</p>';
  }
  right += '<div class="navrow"><button class="btn btn-secondary" data-nav="module">返回本塊目錄</button><button class="btn btn-secondary" data-go="cover">返回封面</button></div>';
  setLeft(left); setRight(right);
  bindNav();
  var rb = document.querySelectorAll("[data-redo]");
  for(var i=0;i<rb.length;i++) rb[i].onclick = function(){ startRedo(); };
  elhState();
}
function startRedo(){
  redoList = rvWrong.slice();
  redoIdx = 0;
  if(!redoList.length){ showReviewEnd(); return; }
  var qid = redoList[redoIdx];
  var idx = qIndexByQid(qid);
  if(idx<0){ showReviewEnd(); return; }
  qIndex = idx;
  var q = QUESTIONS[idx];
  moduleId = q.module; moduleQs = questionsOfModule(moduleId);
  for(var i=0;i<moduleQs.length;i++) if(moduleQs[i].q && moduleQs[i].q.q===qid) li=i;
  revealed[qid] = false;
  view="q";
  startQuestion();
}
function redoNext(){
  redoIdx++;
  if(redoIdx < redoList.length){
    var qid = redoList[redoIdx];
    var idx = qIndexByQid(qid);
    if(idx>=0){
      qIndex=idx; var q=QUESTIONS[idx];
      moduleId=q.module; moduleQs=questionsOfModule(moduleId);
      for(var i=0;i<moduleQs.length;i++) if(moduleQs[i].q && moduleQs[i].q.q===qid) li=i;
      revealed[qid]=false;
      startQuestion(); return;
    }
  }
  showReviewEnd();
}

/* ---- 依序模式 ---- */
function startSequential(){
  seqMode = true;
  moduleQueue = [];
  for(var i=0;i<MODULES.length;i++) if(MODULES[i].section===sectionId) moduleQueue.push(MODULES[i].id);
  var first = moduleQueue.shift();
  enterModule(first, true);
}

/* ============ 畫面輔助 ============ */
function setLeft(h){ document.getElementById("left").innerHTML = h; }
function setRight(h){ document.getElementById("right").innerHTML = h; }
function render(){
  if(view==="cover") showCover();
  else if(view==="section") showSection(sectionId);
  else if(view==="demo") renderDemo();
  else if(view==="rvend") showReviewEnd();
  else if(view==="q") renderQuestion();
}

/* ============ restore ============ */
window.addEventListener("message", function(e){
  var m = e.data;
  if(!m || m.elh!==1 || m.type!=="restore" || e.source!==window.parent) return;
  var d = m.data || {};
  if(typeof d.i !== "number" || d.i<0 || d.i>=TOTAL) return;
  qIndex = d.i;
  if(typeof d.m === "string") moduleId = d.m;
  if(typeof d.li === "number") li = d.li;
  if(typeof d.sec === "string") sectionId = d.sec;
  if(typeof d.seq === "number") seqMode = !!d.seq;
  if(d.p) picked = d.p;
  if(d.r) revealed = d.r;
  if(d.lo) listenOrder = d.lo;
  if(d.mo) matchOrder = d.mo;
  if(d.mp) matchPairs = d.mp;
  if(d.ms) matchSel = d.ms;
  if(d.bs) buildSeq = d.bs;
  if(d.rw) rvWrong = d.rw;
  if(d.dl) redoList = d.dl;
  var loc = d.loc || "q";
  if(loc==="demo1" || loc==="demo2"){ view="demo"; demoStep = (loc==="demo1"?1:2); renderDemo(); }
  else if(loc==="rvend"){ showReviewEnd(); }
  else { view="q"; var q=QUESTIONS[qIndex]; moduleId = q.module; moduleQs = questionsOfModule(moduleId); for(var i=0;i<moduleQs.length;i++) if(moduleQs[i].q===q.q) li=i; startQuestion(); }
});

/* ============ init ============ */
elhReport({type:"init", total: TOTAL});
showCover();
</script>
