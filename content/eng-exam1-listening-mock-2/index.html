<head>
<meta charset="UTF-8">

<title>第一次評估 英文聆聽模擬題第三、四篇</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:"PingFang TC","Microsoft JhengHei",sans-serif;
  background:#eef3f6;color:#1c2430;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.app{display:grid;grid-template-columns:58fr 42fr;gap:2vmin;height:100%;padding:2vmin}
.col{background:#fff;border-radius:1.6vmin;padding:2.4vmin;overflow:auto;display:flex;flex-direction:column;gap:1.6vmin;box-shadow:0 .4vmin 1.4vmin rgba(28,36,48,.08);min-height:0}
.left{background:#f7fbfc;border:.35vmin solid #c5dbe3}
.kicker{font-size:clamp(14px,2.6vmin,36px);color:#1f6f8b;font-weight:700}
.title{font-size:clamp(20px,3.8vmin,56px);font-weight:800;line-height:1.3;margin:0}
.stem{font-size:clamp(18px,3.8vmin,58px);font-weight:700;line-height:1.45;margin:0}
.note,.status,.hint{font-size:clamp(14px,2.6vmin,36px);color:#5a6573;line-height:1.5}
.status{background:#e6f4f8;color:#173f50;border-radius:1vmin;padding:1.2vmin 1.6vmin;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:1vmin}
.chip{
  font:inherit;font-size:clamp(14px,2.8vmin,36px);font-weight:800;
  min-height:max(3rem,7vmin);min-width:max(3rem,7vmin);
  border:.35vmin solid #c5d0da;border-radius:1.2vmin;background:#fff;cursor:pointer;color:#1c2430
}
.chip.on{border-color:#1f6f8b;background:#1f6f8b;color:#fff}
.chip.ok{border-color:#157a3a;background:#dff6e8;color:#157a3a}
.chip.no{border-color:#b42318;background:#fde8e6;color:#b42318}
.chip.part{outline:.3vmin dashed #f0b429}
.opts{display:flex;flex-direction:column;gap:1.2vmin}
.opt,.btn,.key,.mbtn,.act{
  font:inherit;cursor:pointer;border:.35vmin solid #c5d0da;background:#fff;color:#1c2430;
  border-radius:1.4vmin;min-height:max(3rem,7vmin);padding:1.2vmin 1.8vmin;
  font-size:clamp(16px,3.2vmin,48px);text-align:left
}
.opt{display:flex;align-items:center;gap:1.6vmin}
.opt.on{border-color:#1f6f8b;background:#e6f4f8}
.opt.ok{border-color:#157a3a;background:#dff6e8}
.opt.no{border-color:#b42318;background:#fde8e6}
.circle{width:3.8vmin;height:3.8vmin;min-width:1.4rem;min-height:1.4rem;border:.4vmin solid #1c2430;border-radius:50%;flex:0 0 auto;background:#fff}
.opt.on .circle,.opt.ok .circle,.opt.no .circle{background:#1c2430}
.opt.ok .circle{background:#157a3a;border-color:#157a3a}
.opt.no .circle{background:#b42318;border-color:#b42318}
.lab{font-weight:800;flex:0 0 auto}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:.8vmin}
.pic-opt{display:flex;flex-direction:column;align-items:center;text-align:center;padding:1vmin}
.pic-opt svg{width:100%;height:auto;aspect-ratio:16/10;max-height:16vmin;display:block}
.pic-opt .cap{font-size:clamp(14px,2.6vmin,36px);font-weight:700;margin-top:.4vmin}
.blanks{display:flex;flex-direction:column;gap:1.2vmin}
.blank-row{display:flex;flex-wrap:wrap;align-items:center;gap:1vmin}
.blank-lab{font-size:clamp(14px,2.6vmin,36px);color:#5a6573;font-weight:700}
.blank{
  min-height:max(3rem,8vmin);min-width:18vmin;flex:1;
  font-size:clamp(18px,4vmin,52px);font-weight:700;text-align:center;
  border:.4vmin solid #c5d0da;border-radius:1.2vmin;background:#fff;color:#1c2430;padding:0 1.4vmin
}
.blank.on{border-color:#1f6f8b;background:#e6f4f8}
.blank.ok{border-color:#157a3a;background:#dff6e8}
.blank.no{border-color:#b42318;background:#fde8e6}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:1vmin}
.key{text-align:center;font-weight:800;min-height:max(3rem,8vmin);min-width:8vmin;padding:0}
.key.wide{grid-column:span 1}
.months,.acts{display:grid;grid-template-columns:1fr 1fr;gap:1vmin}
.mbtn,.act{text-align:center;font-weight:700}
.mbtn.on,.act.on{border-color:#1f6f8b;background:#e6f4f8}
.row{display:flex;flex-wrap:wrap;gap:1vmin}
.btn{text-align:center;font-weight:800;background:#1f6f8b;color:#fff;border-color:#1f6f8b;flex:1}
.btn.alt{background:#fff;color:#1f6f8b}
.btn.danger{background:#8f1d18;border-color:#8f1d18;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.fb{font-size:clamp(15px,3vmin,42px);line-height:1.5;padding:1.4vmin 1.6vmin;border-radius:1.2vmin;display:none}
.fb.show{display:block}
.fb.good{background:#dff6e8}
.fb.bad{background:#fde8e6}
.score{font-size:clamp(28px,8vmin,110px);font-weight:800;color:#1f6f8b;line-height:1.1}
.script{font-family:Georgia,"Times New Roman",serif;font-size:clamp(15px,2.8vmin,40px);line-height:1.7}
.script p{margin:0 0 .6em}
.hk{padding:.05em .25em;border-radius:.3em;font-weight:700}
.parent{background:#111827;color:#f8fafc;border-radius:1.2vmin;padding:1.6vmin;font-family:Georgia,"Times New Roman",serif;font-size:clamp(14px,2.6vmin,36px);line-height:1.7}
.confirm{background:#fff8e8;border:.35vmin solid #f0b429;border-radius:1.2vmin;padding:1.6vmin;display:flex;flex-direction:column;gap:1.2vmin}
.bigpick{display:flex;flex-direction:column;gap:1.6vmin}
.pick{font-size:clamp(18px,3.4vmin,48px);min-height:max(3.6rem,10vmin)}
@media (max-width:900px),(orientation:portrait){
  html,body{overflow:auto}
  .app{grid-template-columns:1fr;height:auto;min-height:100%}
}

</style>

function compact(s) {
  return String(s || "")
    .toLowerCase()
    .replace(/[’']/g, "")
    .replace(/a\.?\s*m\.?/g, "am")
    .replace(/p\.?\s*m\.?/g, "pm")
    .replace(/o'?clock/g, "")
    .replace(/in the morning/g, "am")
    .replace(/in the afternoon/g, "pm")
    .replace(/midday|noon/g, "noon")
    .replace(/to|–|—|~/g, "-")
    .replace(/(\d)\.(\d)/g, "$1:$2")
    .replace(/[,.]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}
function parseDate(str) {
  const raw = compact(str).replace(/(\d)(st|nd|rd|th)/g, "$1");
  let m = raw.match(/^(\d{1,2})\s*[\/\-]\s*(\d{1,2})$/);
  if (m) return { d:+m[1], m:+m[2] };
  m = raw.match(/^the\s+([a-z\-]+)\s+of\s+([a-z]+)$/);
  if (m && ORDINALS[m[1]] && MONTHS[m[2]]) return { d:ORDINALS[m[1]], m:MONTHS[m[2]] };
  m = raw.match(/^(\d{1,2})\s+([a-z]+)$/);
  if (m && MONTHS[m[2]]) return { d:+m[1], m:MONTHS[m[2]] };
  m = raw.match(/^([a-z]+)\s+(\d{1,2})$/);
  if (m && MONTHS[m[1]]) return { d:+m[2], m:MONTHS[m[1]] };
  const ord = raw.match(/^the\s+([a-z\-]+)\s+of\s+([a-z]+)/);
  if (ord && ORDINALS[ord[1]] && MONTHS[ord[2]]) return { d:ORDINALS[ord[1]], m:MONTHS[ord[2]] };
  return null;
}
function parseMonth(str) {
  const raw = compact(str).replace(/^in\s+/, "");
  return MONTHS[raw] || null;
}
function parseTime(str) {
  let raw = compact(str);
  raw = raw.replace(/half past two/g, "2:30pm").replace(/half past one/g, "1:30pm")
    .replace(/two thirty/g, "2:30").replace(/one thirty/g, "1:30")
    .replace(/eight thirty/g, "8:30").replace(/nine\s*(am)?$/g, "9:00am")
    .replace(/twelve\s*(noon)?/g, "12:00noon");
  let m = raw.match(/(\d{1,2})\s*[:.]\s*(\d{2})\s*(am|pm|noon)?/);
  if (m) {
    const h = +m[1], min = m[2], ap = m[3] || "";
    return `${h}:${min}${ap}`;
  }
  m = raw.match(/(\d{1,2})\s+(\d{2})\s*(am|pm|noon)?/);
  if (m) {
    const h = +m[1], min = m[2], ap = m[3] || "";
    return `${h}:${min}${ap}`;
  }
  m = raw.match(/\b(\d{1,2})\s*(am|pm)\b/);
  if (m) return `${m[1]}:00${m[2]}`;
  if (/12:00noon|12noon|noon/.test(raw)) return "12:00noon";
  return raw.replace(/\s+/g, "");
}
function timeEq(a, b) {
  const na = parseTime(a), nb = parseTime(b);
  const norm = (t) => {
    const m = String(t).match(/(\d{1,2}):(\d{2})(am|pm|noon)?/);
    if (!m) return t;
    return `${+m[1]}:${m[2]}${m[3]||""}`;
  };
  return norm(na) === norm(nb);
}
function dateEq(val, expect) {
  const got = parseDate(val);
  return got && got.d === expect.d && got.m === expect.m;
}
function checkText(q, val) {
  const s = compact(val);
  if (!s) return false;
  if (q.accept === "date") return dateEq(s, q.expect);
  if (q.accept === "month") return parseMonth(s) === q.expect;
  if (q.accept === "time") return timeEq(s, q.expect);
  if (q.accept === "daterange") {
    const parts = s.split("-").map(x => x.trim()).filter(Boolean);
    if (parts.length < 2) {
      const all = s.match(/(\d{1,2}\s*[\/\-]\s*\d{1,2}|the\s+[a-z\-]+\s+of\s+[a-z]+|\d{1,2}\s+[a-z]+)/g) || [];
      if (all.length >= 2) return dateEq(all[0], q.expect[0]) && dateEq(all[1], q.expect[1]);
      return false;
    }
    return dateEq(parts[0], q.expect[0]) && dateEq(parts[1], q.expect[1]);
  }
  if (q.accept === "timerange") {
    const parts = s.split("-").map(x => x.trim()).filter(Boolean);
    if (parts.length < 2) return false;
    const end = /noon/.test(parts[1]) ? "12:00noon" : parts[1];
    return timeEq(parts[0], q.expect.t1) && (timeEq(end, q.expect.t2) || (q.expect.t2 === "12:00noon" && /noon|12:00/.test(parts[1])));
  }
  if (q.accept === "datetime") {
    let got = parseDate(s);
    if (!got) {
      const m = s.match(/(\d{1,2}\s*[\/\-]\s*\d{1,2}|the\s+[a-z\-]+\s+of\s+[a-z]+|\d{1,2}\s+[a-z]+|[a-z]+\s+\d{1,2})/);
      if (m) got = parseDate(m[0]);
    }
    const okDate = got && got.d === q.expect.d && got.m === q.expect.m;
    const okTime = timeEq(s, q.expect.t);
    return !!(okDate && okTime);
  }
  return false;
}

}
function appendKey(s, k){
  if (k==="⌫") return String(s||"").slice(0,-1);
  if (k==="清除") return "";
  if (/^(a\.m\.|p\.m\.|noon|to)$/.test(k)) {
    if (s && !/\s$/.test(s)) s += " ";
    return s + k;
  }
  return String(s||"") + k;
}
function pressKey(k){
  if (submitted) return;
  ensureFill();
  ans[i].blanks[activeBlank] = appendKey(ans[i].blanks[activeBlank], k);
  render();
}
function setMonth(name){
  if (submitted) return;
  ensureFill();
  ans[i].blanks[activeBlank] = name;
  render();
}

function decorateScript(paper){
  const pairs = (HIGHLIGHTS[paper.id]||[]).slice().sort(function(a,b){ return b[1].length-a[1].length; });
  return paper.parts.map(function(part){
    const body = part.lines.map(function(line){
      let t = escapeHtml(line.text);
      pairs.forEach(function(pair){
        const qn = pair[0], phrase = escapeHtml(pair[1]);
        if (!phrase) return;
        const span = '<span class="hk" data-q="'+qn+'" style="background:'+(QCOLOR[qn]||"#ffe08a")+'">'+phrase+'</span>';
        t = t.split(phrase).join(span);
      });
      return "<p><b>"+escapeHtml(ROLE[line.role]||"Narrator")+":</b> "+t+"</p>";
    }).join("");
    return "<h3 style='font-size:clamp(16px,3vmin,40px);color:#1f6f8b'>"+escapeHtml(part.label)+"</h3>"+body;
  }).join("");
}
function plainScript(paper){
  return paper.parts.map(function(part){
    const body = part.lines.map(function(line){
      return (ROLE[line.role]||"Narrator")+": "+line.text;
    }).join("\n");
    return part.label+"\n"+part.intro+"\n"+body;
  }).join("\n\n");
}

function setStatus(text, partId){
  const el = document.getElementById("listenStatus");
  if (el) el.textContent = text;
  document.querySelectorAll(".chip").forEach(function(n){ n.classList.remove("part"); });
  if (!partId) return;
  const p = curPaper();
  p.questions.forEach(function(q, idx){
    if (q.part===partId) {
      const c = document.getElementById("chip-"+idx);
      if (c) c.classList.add("part");
    }
  });
}

async function playPart(part, round){
  if (round==="first") {
    setStatus("Now look at the questions. ("+part.label+")", part.id);
    await speak(part.intro, 1);
    if (cancelled) return;
    await silence(part.look || 8000);
    if (cancelled) return;
  }
  setStatus(part.label+"  ·  "+(round==="first"?"first time":"second time"), part.id);
  for (let k=0;k<(part.lines||[]).length;k++){
    if (cancelled) return;
    const line = part.lines[k];
    await speak(line.text, PITCH[line.role]||1);
    await silence(350);
  }
}
async function runExamAudio(){
  speaking = true;
  cancelled = false;
  const p = curPaper();
  for (let n=0;n<p.parts.length;n++){
    if (cancelled) break;
    await playPart(p.parts[n], "first");
    if (cancelled) break;
    await silence(1200);
    await playPart(p.parts[n], "second");
    if (cancelled) break;
    await silence(1000);
  }
  if (!cancelled) {
    await speak("This is the end of the listening test. Please check your answers and submit.", 1);
    setStatus("This is the end of the listening test. Please check your answers and submit.");
  }
  speaking = false;
}
function continueAudio(){
  if (speaking) return;
  unlockSpeech();
  cancelled = false;
  runExamAudio();
}
function togglePause(){
  if (!window.speechSynthesis) return;
  if (speechSynthesis.paused) speechSynthesis.resume();
  else speechSynthesis.pause();
  render();
}
function goHome(){
  stopSpeech();
  cancelled = true;
  if (phase==="exam" || phase==="result") syncPaper();
  phase = "home";
  paperId = null;
  i = -1;
  ans = [];
  submitted = false;
  showParent = false;
  confirmOpen = false;
  reviewTab = "q";
  render();
}
function choosePaper(id){
  paperId = id;
  phase = "intro";
  i = -1;
  submitted = false;
  showParent = false;
  render();
}
function startExam(){
  unlockSpeech();
  const p = curPaper();
  const pid = paperId;
  if (!allAns[pid] || allSubmitted[pid]) {
    allAns[pid] = p.questions.map(function(){ return null; });
    allSubmitted[pid] = false;
    i = 0;
  } else {
    i = 0;
  }
  ans = allAns[pid];
  submitted = false;
  confirmOpen = false;
  showParent = false;
  reviewTab = "q";
  activeBlank = 0;
  phase = "exam";
  syncPaper();
  render();
  runExamAudio();
}
function goQ(n){
  if (n<0 || n>10) return;
  i = n;
  activeBlank = 0;
  confirmOpen = false;
  render();
}
function trySubmit(){
  if (submitted) return;
  const p = curPaper();
  const left = p.questions.filter(function(q,idx){ return isUnanswered(q, ans[idx]); }).length;
  if (left>0 && !confirmOpen) { confirmOpen = true; render(); return; }
  confirmOpen = false;
  stopSpeech();
  submitted = true;
  phase = "result";
  syncPaper();
  reportAllAnswers();
  render();
}

function render(){
  const app = document.getElementById("app");
  if (phase==="home") { app.innerHTML = viewHome(); bindHome(); elhState(); return; }
  if (phase==="intro") { app.innerHTML = viewIntro(); bindIntro(); elhState(); return; }
  if (phase==="result") { app.innerHTML = viewResult(); bindResult(); elhState(); return; }
  app.innerHTML = viewExam();
  bindExam();
  elhState();
}

function viewHome(){
  return `<div class="col left">
    <div class="kicker">女兒　小三／3D　英文</div>
    <h1 class="title">第一次評估 英文聆聽模擬題第三、四篇</h1>
    <p class="note">兩篇都是 40 分、各 11 題。開考後以英文朗讀，每段錄音讀兩次。作答時不會顯示對錯，按「交卷」後才出分，並可查看錄音稿與答案。</p>
    <p class="note">請先選一篇。內容為 Unit 1–3 活動、科目、學校活動、日期與時間。</p>
  </div>
  <div class="col">
    <div class="kicker">請選擇</div>
    <div class="bigpick">
      <button class="btn pick" id="btn3" type="button">模擬題三</button>
      <button class="btn pick alt" id="btn4" type="button">模擬題四</button>
    </div>
  </div>`;
}
function bindHome(){
  document.getElementById("btn3").onclick = function(){ choosePaper("3"); };
  document.getElementById("btn4").onclick = function(){ choosePaper("4"); };
}
function viewIntro(){
  const p = curPaper();
  return `<div class="col left">
    <div class="kicker">女兒　小三／3D</div>
    <h1 class="title">${escapeHtml(p.title)}</h1>
    <p class="note">請允許網頁朗讀。開始後會先給你一點時間看題，再用英文讀出錄音，每段讀兩次。作答時不會顯示對錯。</p>
    <p class="note">如果沒有聲音，作答頁可以改由家長朗讀。</p>
  </div>
  <div class="col">
    <div class="row">
      <button class="btn" id="startBtn" type="button">開始作答並播放錄音</button>
    </div>
    <div class="row">
      <button class="btn alt" id="backBtn" type="button">返回封面</button>
    </div>
  </div>`;
}
function bindIntro(){
  document.getElementById("startBtn").onclick = startExam;
  document.getElementById("backBtn").onclick = goHome;
}

function chipClass(idx){
  let c = "chip"+(idx===i?" on":"");
  if (submitted) {
    const p = curPaper();
    c += isCorrect(p.questions[idx], ans[idx]) ? " ok" : " no";
  }
  return c;
}
function viewChips(){
  const p = curPaper();
  return `<div class="chips">${p.questions.map(function(q,idx){
    return `<button type="button" class="${chipClass(idx)}" id="chip-${idx}">${q.n}</button>`;
  }).join("")}</div>`;
}

function viewMcq(q, reviewed){
  const a = ans[i]||{};
  const items = q.options.map(function(opt, idx){
    let cls = "opt";
    if (q.type==="mcq-pic") cls += " pic-opt";
    if (a.choice===idx) cls += " on";
    if (reviewed) {
      if (idx===q.answer) cls += " ok";
      else if (a.choice===idx) cls += " no";
    }
    const pic = (q.type==="mcq-pic" && q.pics && q.pics[idx]) ? svgPic(q.pics[idx]) : "";
    const cap = q.type==="mcq-pic" ? `<div class="cap">${escapeHtml(opt)}</div>` : `<span>${escapeHtml(opt)}</span>`;
    return `<button type="button" class="${cls}" data-i="${idx}">
      <span class="circle" aria-hidden="true"></span>
      <span class="lab">${String.fromCharCode(65+idx)}.</span>
      ${pic}${cap}
    </button>`;
  }).join("");
  const wrap = q.type==="mcq-pic" ? "pics" : "opts";
  return `<div class="${wrap}">${items}</div>`;
}

function viewFill(q, reviewed){
  const a = ans[i] || {blanks: q.blanks.map(function(){ return ""; })};
  const rows = q.blanks.map(function(b, j){
    let cls = "blank";
    if (!reviewed && activeBlank===j) cls += " on";
    if (reviewed) cls += gradeBlank(b, a.blanks[j]||"") ? " ok" : " no";
    return `<div class="blank-row">
      <div class="blank-lab">${escapeHtml(b.label||("空格 "+(j+1)))}</div>
      <button type="button" class="${cls}" data-b="${j}">${escapeHtml(a.blanks[j]||"")||"　"}</button>
    </div>`;
  }).join("");
  let pad = "";
  if (!reviewed) {
    const kinds = q.blanks.map(function(b){ return b.accept; });
    if (kinds.length===1 && kinds[0]==="month") {
      pad = `<div class="months">${MONTH_NAMES.map(function(m){
        const on = (a.blanks[activeBlank]||"")===m ? " on":"";
        return `<button type="button" class="mbtn${on}" data-m="${escapeHtml(m)}">${m}</button>`;
      }).join("")}</div>`;
    } else {
      const keys = ["1","2","3","4","5","6","7","8","9","0","/",":","a.m.","p.m.","noon","to","⌫","清除"];
      pad = `<div class="keys">${keys.map(function(k){
        return `<button type="button" class="key" data-k="${escapeHtml(k)}">${k}</button>`;
      }).join("")}</div>`;
    }
  }
  return `<div class="blanks">${rows}</div>${pad}`;
}

function viewActivity(q, reviewed){
  const p = curPaper();
  const a = ans[i]||{};
  return `<div class="acts">${p.activities.map(function(name){
    let cls = "act";
    if (a.value===name) cls += " on";
    if (reviewed) {
      if (activityEq(name, q.answer)) cls += " ok";
      else if (a.value===name) cls += " no";
    }
    return `<button type="button" class="${cls}" data-a="${escapeHtml(name)}">${escapeHtml(name)}</button>`;
  }).join("")}</div>`;
}

function viewFeedback(q){
  if (!submitted) return "";
  const a = ans[i];
  const ok = isCorrect(q, a);
  const you = isUnanswered(q,a) ? "未作答" : pickedText(q,a);
  return `<div class="fb show ${ok?"good":"bad"}">${ok?"正確。":"還未全對。"} 你的答案：${escapeHtml(you)}<br>正確答案：${escapeHtml(correctText(q))}（${q.marks} 分）</div>`;
}

function viewExam(){
  const p = curPaper();
  const q = curQ();
  const paused = window.speechSynthesis && speechSynthesis.paused;
  let rightBody = "";
  if (q.type==="mcq"||q.type==="mcq-pic") rightBody = viewMcq(q, false);
  else if (q.type==="fill") rightBody = viewFill(q, false);
  else rightBody = viewActivity(q, false);
  const confirm = confirmOpen ? `<div class="confirm" id="confirmBox">
    <div>還有未作答的題目。確定要交卷嗎？</div>
    <div class="row">
      <button type="button" class="btn alt" id="cancelSub">繼續作答</button>
      <button type="button" class="btn danger" id="okSub">確定交卷</button>
    </div>
  </div>` : "";
  const parent = showParent ? `<div class="parent" id="parentBox">For the parent: please read this aloud in English. The student should look at the questions, not this script.<pre style="white-space:pre-wrap;font:inherit">${escapeHtml(plainScript(p))}</pre></div>` : "";
  return `<div class="col left">
    <div class="kicker">${escapeHtml(p.title)}　Part ${escapeHtml(q.part)}　第 ${q.n} 題／11</div>
    <div class="status" id="listenStatus">Listen and answer. You will hear each part twice.</div>
    ${viewChips()}
    <p class="stem">${escapeHtml(q.stem).replace(/\n/g,"<br>")}</p>
  </div>
  <div class="col">
    <div class="row">
      <button type="button" class="btn alt" id="prevBtn" ${i===0?"disabled":""}>上一題</button>
      <button type="button" class="btn alt" id="nextBtn" ${i===10?"disabled":""}>下一題</button>
      <button type="button" class="btn danger" id="submitBtn">交卷</button>
    </div>
    ${rightBody}
    <div class="row">
      <button type="button" class="btn alt" id="pauseBtn">${paused?"Resume":"Pause"}</button>
      <button type="button" class="btn alt" id="replayBtn">繼續播放錄音</button>
      <button type="button" class="btn alt" id="parentBtn">${showParent?"收起家長稿":"沒有聲音？改由家長朗讀"}</button>
    </div>
    ${confirm}${parent}
  </div>`;
}
function bindExam(){
  document.querySelectorAll(".chip").forEach(function(el){
    el.onclick = function(){ goQ(+el.id.replace("chip-","")); };
  });
  document.querySelectorAll(".opt").forEach(function(el){
    el.onclick = function(){ setAnsMcq(+el.getAttribute("data-i")); };
  });
  document.querySelectorAll(".blank").forEach(function(el){
    el.onclick = function(){ activeBlank = +el.getAttribute("data-b"); render(); };
  });
  document.querySelectorAll(".key").forEach(function(el){
    el.onclick = function(){ pressKey(el.getAttribute("data-k")); };
  });
  document.querySelectorAll(".mbtn").forEach(function(el){
    el.onclick = function(){ setMonth(el.getAttribute("data-m")); };
  });
  document.querySelectorAll(".act").forEach(function(el){
    el.onclick = function(){ setAct(el.getAttribute("data-a")); };
  });
  document.getElementById("prevBtn").onclick = function(){ goQ(i-1); };
  document.getElementById("nextBtn").onclick = function(){ goQ(i+1); };
  document.getElementById("pauseBtn").onclick = togglePause;
  document.getElementById("replayBtn").onclick = continueAudio;
  document.getElementById("parentBtn").onclick = function(){ showParent = !showParent; render(); };
  document.getElementById("submitBtn").onclick = trySubmit;
  const c = document.getElementById("cancelSub");
  const o = document.getElementById("okSub");
  if (c) c.onclick = function(){ confirmOpen=false; render(); };
  if (o) o.onclick = function(){ confirmOpen=true; trySubmit(); };
}

function totalScore(){
  const p = curPaper();
  return p.questions.reduce(function(s,q,idx){ return s+marksOf(q, ans[idx]); }, 0);
}
function viewResult(){
  const p = curPaper();
  const q = curQ();
  const score = totalScore();
  let right = "";
  if (reviewTab==="script") {
    right = `<div class="script">${decorateScript(p)}</div>`;
  } else {
    let body = "";
    if (q.type==="mcq"||q.type==="mcq-pic") body = viewMcq(q, true);
    else if (q.type==="fill") body = viewFill(q, true);
    else body = viewActivity(q, true);
    right = body + viewFeedback(q);
  }
  return `<div class="col left">
    <div class="kicker">${escapeHtml(p.title)}　交卷結果</div>
    <div class="score">${score} / 40</div>
    <p class="note">第 1–6 題每題 4 分，第 7–10 題每題 3 分（全對才得分），第 11 題 4 分。</p>
    ${viewChips()}
    <p class="stem">${escapeHtml(q.stem).replace(/\n/g,"<br>")}</p>
  </div>
  <div class="col">
    ${right}
    <div class="row">
      <button type="button" class="btn alt" id="tabQ">逐題查看</button>
      <button type="button" class="btn alt" id="tabS">看錄音稿</button>
    </div>
    <div class="row">
      <button type="button" class="btn alt" id="prevBtn" ${i===0?"disabled":""}>上一題</button>
      <button type="button" class="btn alt" id="nextBtn" ${i===10?"disabled":""}>下一題</button>
    </div>
    <div class="row">
      <button type="button" class="btn" id="homeBtn">返回封面</button>
    </div>
  </div>`;
}
function bindResult(){
  document.querySelectorAll(".chip").forEach(function(el){
    el.onclick = function(){ reviewTab="q"; goQ(+el.id.replace("chip-","")); };
  });
  document.getElementById("tabQ").onclick = function(){ reviewTab="q"; render(); };
  document.getElementById("tabS").onclick = function(){ reviewTab="script"; render(); };
  document.getElementById("prevBtn").onclick = function(){ reviewTab="q"; goQ(i-1); };
  document.getElementById("nextBtn").onclick = function(){ reviewTab="q"; goQ(i+1); };
  document.getElementById("homeBtn").onclick = goHome;
}

window.addEventListener("message", function(e){
  var m = e.data;
  if (!m || m.elh !== 1 || m.type !== "restore" || e.source !== window.parent) return;
  var d = m.data || {};
  if (typeof d.i !== "number" || d.i < 0 || d.i >= 22) return;
  allAns["3"] = Array.isArray(d.ans3) ? d.ans3 : null;
  allAns["4"] = Array.isArray(d.ans4) ? d.ans4 : null;
  allSubmitted["3"] = !!d.submitted3;
  allSubmitted["4"] = !!d.submitted4;
  if (d.paper==="3" || d.paper==="4") paperId = d.paper;
  else paperId = d.i >= 11 ? "4" : "3";
  i = (typeof d.i === "number") ? (d.i >= 11 ? d.i - 11 : d.i) : 0;
  if (i < 0 || i > 10) i = 0;
  if (!allAns[paperId]) allAns[paperId] = getPaper(paperId).questions.map(function(){ return null; });
  ans = allAns[paperId];
  submitted = allSubmitted[paperId] || d.phase==="result";
  phase = (d.phase==="result" || submitted) ? "result" : "exam";
  // 還原時不重報 init，也不重報答案
  reviewTab = d.tab==="script" ? "script" : "q";
  showParent = !!d.parent;
  activeBlank = typeof d.blank==="number" ? d.blank : 0;
  confirmOpen = false;
  render();
});

elhReport({type:"init", total:22});
render();
