<style>

  html.dark {
    --bg: #101826;
    --ink: #f3efe6;
    --muted: #b7c0cc;
    --card: #1a2536;
    --line: #2c3a50;
    --accent: #5ec8e6;
    --accent-2: #f0b429;
    --good: #5ee09a;
    --good-bg: #163528;
    --bad: #ff8d85;
    --bad-bg: #3a1d1c;

  html, body { height: 100%; margin: 0; }
  body {

  header.top {

  .brand { font-weight: 800; font-size: 2.2vmin; color: var(--accent); white-space: nowrap; }
  .unit {

  .progress { font-weight: 800; font-size: 2.3vmin; letter-spacing: .04em; }

  .split-clocks { display: flex; justify-content: center; gap: 5vmin; align-items: center; }

</head>

function clockSVG(h, m) {
  const cx=110, cy=110, r=100;
  const ha = ((h%12)+m/60)*30;
  const ma = m*6;
  const hx = cx + 50*Math.sin(ha*Math.PI/180);
  const hy = cy - 50*Math.cos(ha*Math.PI/180);
  const mx = cx + 70*Math.sin(ma*Math.PI/180);
  const my = cy - 70*Math.cos(ma*Math.PI/180);
  let ticks="";
  for (let k=0;k<12;k++){
    const a=k*30*Math.PI/180;
    ticks += `<line x1="${cx+88*Math.sin(a)}" y1="${cy-88*Math.cos(a)}" x2="${cx+96*Math.sin(a)}" y2="${cy-96*Math.cos(a)}" stroke="currentColor" stroke-width="3"/>`;
  }
  return `<svg class="clock-face" viewBox="0 0 220 220" aria-hidden="true">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--card)" stroke="currentColor" stroke-width="6"/>
    ${ticks}
    <line x1="${cx}" y1="${cy}" x2="${hx}" y2="${hy}" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${mx}" y2="${my}" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="6" fill="currentColor"/>
  </svg>`;
}

function rulerSVG(maxCm, markCm, markMm) {
  const unit = 90;
  const x0 = 40, y = 70, len = maxCm * unit;
  let t = `<rect x="${x0}" y="${y}" width="${len}" height="40" rx="4" fill="#f3e6c8" stroke="#8a6d3b"/>`;
  for (let cm=0; cm<=maxCm; cm++){
    const xx = x0 + cm*unit;
    t += `<line x1="${xx}" y1="${y}" x2="${xx}" y2="${y+32}" stroke="#333" stroke-width="2"/>
          <text x="${xx+3}" y="${y+38}" font-size="16" font-weight="700" fill="#333">${cm}</text>`;
    if (cm<maxCm){
      for (let mm=1;mm<10;mm++){
        const hh = mm===5?20:11;
        t += `<line x1="${xx+mm*unit/10}" y1="${y}" x2="${xx+mm*unit/10}" y2="${y+hh}" stroke="#333" stroke-width="1"/>`;
      }
    }
  }
  t += `<text x="${x0+len-36}" y="${y+36}" font-size="16" font-weight="700" fill="#333">cm</text>`;
  const end = x0 + markCm*unit + markMm*unit/10;
  t += `<rect x="${x0}" y="${y-36}" width="${end-x0}" height="22" rx="6" fill="#2a9d8f"/>
        <polygon points="${end},${y-36} ${end+18},${y-25} ${end},${y-14}" fill="#2a9d8f"/>
        <line x1="${x0}" y1="${y-8}" x2="${x0}" y2="${y}" stroke="#1f6f8b" stroke-width="2"/>
        <line x1="${end}" y1="${y-8}" x2="${end}" y2="${y}" stroke="#d97706" stroke-width="2"/>`;
  return `<svg class="ruler-svg" viewBox="0 0 ${x0+len+50} 140">${t}</svg>`;
}

function qBody(s) {
  if (s.kind === "mcq") {
    return `<div class="options${s.oneCol?" one-col":""}">` + s.options.map((opt,idx)=>{
      let cls = "opt";
      if (picked === idx) cls += " picked";
      if (revealed && idx === s.answer) cls += " correct";
      if (revealed && picked !== null && idx === picked && idx !== s.answer) cls += " wrong";
      return `<button class="${cls}" onclick="choose(${idx})"><span class="tag">${letters[idx]}</span><span>${opt}</span></button>`;
    }).join("") + `</div>`;
  }
  return `<div class="blank-list">` + s.blanks.map(b => {
    const cell = (val) => `<span class="blank${revealed?" show":""}">${revealed?val:"　"}</span>`;
    const mid = b.answer2 ? `${cell(b.answer)}${b.mid||""}${cell(b.answer2)}${b.after}` : `${cell(b.answer)}${b.after}`;
    return `<div class="blank-row">${b.before}${mid}</div>`;
  }).join("") + `</div>`;
}

function explainBox(s) {
  let verdict = "";
  if (s.kind === "mcq" && picked !== null) {
    verdict = picked === s.answer
      ? `<div class="verdict ok">答對了！</div>`
      : `<div class="verdict no">再看一看，正確答案是 ${letters[s.answer]}。</div>`;
  }
  return `<aside class="explain">
      ${verdict}
      <h3>講解</h3>
      <ol>${s.explain.map(x=>`<li>${x}</li>`).join("")}</ol>
      <div class="last">${s.last}</div>
    </aside>`;
}

        <div class="end">
          <h1>今天練完了！</h1>
          <p>如果還有不清楚的題，可以再走一遍。</p>
          <button class="act" style="font-size:3.2vmin;padding:1.4vmin 4vmin;margin-top:2vmin" onclick="start()">再練習一次</button>
        </div>
      </main>
      <footer class="bar">
        <button class="nav" onclick="i=slides.length-1;picked=null;revealed=false;render()">回上一題</button>
      </footer>`;
    return;
  }
  const s = slides[i];
  const vis = visualHTML(s.visual, revealed);
  const prog = i < CORE
    ? `第 ${i+1} 題／共 ${CORE} 題`
    : `選練　第 ${i+1} 題`;
  app.innerHTML = `
    <header class="top">
      <div class="brand">第一次評估　錯題練習</div>
      <div class="unit">${s.unit}</div>
      <div class="spacer"></div>
      <div class="progress">${prog}</div>
      <button class="icon" onclick="toggleDark()" title="深色模式">${dark?"淺色":"深色"}</button>
      <button class="icon" onclick="goFull()" title="全螢幕">全螢幕</button>
    </header>
    <main class="${revealed?"split":""}">
      <div class="col-q">
        <p class="prompt">${s.prompt}</p>
        <div class="visual">${vis}</div>
        ${qBody(s)}
      </div>
      ${revealed ? explainBox(s) : ""}
    </main>
    <footer class="bar">
      <button class="nav" ${i===0?"disabled":""} onclick="go(-1)">上一題</button>
      <div class="dots">${slides.map((_,k)=>`<span class="dot${k===i?" now":k<i?" done":""}"></span>`).join("")}</div>
      <button class="act${revealed?"":" ready"}" onclick="reveal()">${revealed?"已顯示答案":"顯示答案／講解"}</button>
      <button class="nav" onclick="go(1)">${i===slides.length-1?"完成":"下一題"}</button>
    </footer>`;
}

function start(){ i=0; picked=null; revealed=false; render(); }
function go(d){
  i = Math.min(slides.length, Math.max(0, i+d));
  picked=null; revealed=false; render();
}
function choose(idx){
  if (revealed) return;
  picked = idx;
  render();
}
function reveal(){ revealed = true; render(); }
function toggleDark(){
  dark = !dark;
  document.documentElement.classList.toggle("dark", dark);
  render();
}
function goFull(){
  const el = document.documentElement;
  if (!document.fullscreenElement) el.requestFullscreen?.();
  else document.exitFullscreen?.();
}

document.addEventListener("keydown", (e) => {
  if (e.key === "d" || e.key === "D") { toggleDark(); return; }
  if (e.key === "f" || e.key === "F") { goFull(); return; }
  if (i < 0) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); start(); } return; }
  if (i >= slides.length) { if (e.key === "ArrowLeft") { i=slides.length-1; picked=null; revealed=false; render(); } return; }
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(-1); }
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (!revealed) reveal(); else go(1); }
  else if (["1","2","3","4","a","b","c","d","A","B","C","D"].includes(e.key)) {
    const map = {a:0,b:1,c:2,d:3,A:0,B:1,C:2,D:3,"1":0,"2":1,"3":2,"4":3};
    const s = slides[i];
    if (s && s.kind === "mcq" && !revealed) choose(map[e.key]);
  }
});

function applyHash() {
  const h = (location.hash || "").replace("#","");
  picked = null;
  if (h === "dark") { dark = true; document.documentElement.classList.add("dark"); i = -1; revealed = false; }
  else if (!h || h === "cover") { i = -1; revealed = false; }
  else if (h === "end") { i = slides.length; revealed = false; }
  else {
    const m = h.match(/^(\\d+)(r)?(d)?$/);
    if (m) {
      i = Math.max(0, Math.min(slides.length-1, parseInt(m[1], 10)-1));
      revealed = !!m[2];
      dark = !!m[3];
      document.documentElement.classList.toggle("dark", dark);
    }
  }
  render();
}
window.addEventListener("hashchange", applyHash);
applyHash();
</script>
</body>
</html>
