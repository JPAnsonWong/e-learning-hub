*{box-sizing:border-box}

#app{display:flex;height:100%;gap:1.6vmin;padding:1.6vmin}

.qtext{font-size:clamp(18px,4vmin,60px);line-height:1.5}
.fig{margin-top:1.6vmin;display:flex;justify-content:center;align-items:center;gap:2vmin;flex-wrap:wrap}
.fig svg{max-width:100%;height:auto}
.digi{background:#111;color:#4ade80;font-family:monospace;font-size:clamp(22px,6vmin,90px);padding:1vmin 2.4vmin;border-radius:1.4vmin;letter-spacing:.3vmin}
.fig table{border-collapse:collapse;font-size:clamp(16px,3.4vmin,50px)}
.fig td,.fig th{border:.25vmin solid #789;padding:.8vmin 2.2vmin;text-align:center}

.row{display:flex;align-items:center;flex-wrap:wrap;gap:1vmin;margin:.8vmin 0}
.blank{min-width:14vmin;min-height:max(3rem,8vmin);border:.4vmin solid #94a3b8;border-radius:1.2vmin;display:inline-flex;align-items:center;justify-content:center;padding:0 1.4vmin;background:#f8fafc;font-size:clamp(18px,4.4vmin,66px);font-weight:bold;color:#0f3d7a}
.blank.small{min-width:9vmin}
.blank.active{border-color:#2563eb;background:#dbeafe;box-shadow:0 0 0 .5vmin #93c5fd}
.blank.ok{border-color:#16a34a;background:#dcfce7}
.blank.bad{border-color:#dc2626;background:#fee2e2}
.opts{display:flex;flex-wrap:wrap;gap:1.4vmin;margin-top:1.2vmin}
.opt{min-height:max(3rem,7.5vmin);min-width:14vmin;font-size:clamp(16px,3.6vmin,54px);border:.35vmin solid #94a3b8;border-radius:1.2vmin;background:#fff;padding:0 2vmin}
.opt.sel{background:#2563eb;color:#fff;border-color:#2563eb}
.mc{display:flex;flex-direction:column;gap:1.4vmin}
.mc .opt{text-align:left;width:100%}
.opt.right{background:#16a34a;color:#fff;border-color:#16a34a}
.opt.wrong{background:#dc2626;color:#fff;border-color:#dc2626}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vmin;margin-top:1.6vmin}
.pad.cn{grid-template-columns:repeat(5,1fr)}
.pad button{min-height:max(3rem,8vmin);font-size:clamp(18px,4.4vmin,64px);border:none;border-radius:1.2vmin;background:#e2e8f0;font-weight:bold}
.pad button.fn{background:#fde2c4;font-size:clamp(14px,3vmin,44px)}
.nav{display:flex;gap:1.2vmin;margin-top:1.6vmin;flex-wrap:wrap}
.nav button{flex:1;min-height:max(3rem,7.5vmin);font-size:clamp(15px,3.2vmin,48px);border:none;border-radius:1.2vmin;background:#cbd5e1;font-weight:bold;min-width:15vmin}
.nav .go{background:#2563eb;color:#fff}.nav .sub{background:#ea580c;color:#fff}
.hint{font-size:clamp(13px,2.5vmin,38px);color:#667;margin-top:1vmin}
.res{font-size:clamp(14px,2.8vmin,42px);margin-top:1.6vmin;padding:1.2vmin 1.6vmin;border-radius:1.2vmin;line-height:1.5}
.res.ok{background:#dcfce7}.res.bad{background:#fee2e2}
#ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-start;justify-content:center;padding-top:4vh;z-index:9}
#ovb{background:#fff;border-radius:2vmin;padding:2.6vmin;width:min(94vw,150vmin);max-height:90%;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(9,1fr);gap:1vmin;margin:1.6vmin 0}
.grid button{min-height:max(2.6rem,7vmin);font-size:clamp(14px,3vmin,44px);border:.3vmin solid #94a3b8;border-radius:1vmin;background:#fff;font-weight:bold}
.grid .done{background:#bfdbfe}.grid .g{background:#16a34a;color:#fff;border-color:#16a34a}.grid .r{background:#dc2626;color:#fff;border-color:#dc2626}
.big{font-size:clamp(28px,9vmin,140px);font-weight:bold;color:#1d4ed8;text-align:center}
.ovt{font-size:clamp(18px,4vmin,60px);font-weight:bold}
.ovp{font-size:clamp(14px,3vmin,44px);line-height:1.5}
@media (max-width:900px),(orientation:portrait){#app{flex-direction:column;height:auto;min-height:100%}.grid{grid-template-columns:repeat(5,1fr)}}

}
function rulerSvg(){
  var x0=40,u=40,s='<svg viewBox="0 0 700 330" width="700" style="width:100%;max-width:90vmin">';
  s+='<rect x="'+x0+'" y="40" width="'+(12.6*u)+'" height="152" fill="#fef3c7" stroke="#92400e" stroke-width="3"/>';
  s+='<circle cx="'+(x0+30)+'" cy="116" r="12" fill="#fff" stroke="#92400e" stroke-width="3"/>';
  s+='<text x="'+(x0+260)+'" y="128" font-size="34" text-anchor="middle" fill="#92400e">✿ 書籤 ✿</text>';
  var xr=x0+12.6*u+14;s+='<line x1="'+xr+'" y1="40" x2="'+xr+'" y2="192" stroke="#111" stroke-width="2"/><text x="'+(xr+10)+'" y="124" font-size="26">38 毫米</text>';
  s+='<rect x="'+(x0-14)+'" y="200" width="'+(15*u+28)+'" height="90" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>';
  for(var k=0;k<=150;k++){var x=x0+k*u/10,l=k%10==0?34:(k%5==0?24:14);s+='<line x1="'+x+'" y1="200" x2="'+x+'" y2="'+(200+l)+'" stroke="#111" stroke-width="'+(k%10==0?2:1)+'"/>';
    if(k%10==0)s+='<text x="'+x+'" y="'+(260)+'" font-size="20" text-anchor="middle">'+(k/10)+'</text>';}
  s+='<text x="'+(x0+15*u)+'" y="284" font-size="18" text-anchor="end">厘米(cm)</text>';
  s+='<line x1="'+x0+'" y1="40" x2="'+x0+'" y2="200" stroke="#dc2626" stroke-dasharray="6 5" stroke-width="2"/><line x1="'+(x0+12.6*u)+'" y1="40" x2="'+(x0+12.6*u)+'" y2="200" stroke="#dc2626" stroke-dasharray="6 5" stroke-width="2"/>';
  return s+'</svg>';
}
function fig(f){
  if(!f)return "";
  if(f=="FIG_BUS")return '<div>'+clock(8,50)+'<div class="arrow">等候巴士</div></div><div class="arrow">過了 15 分鐘 ➜</div><div>'+clock(0,0,1)+'<div class="arrow">登上巴士</div></div>';
  if(f=="CLOCK_9_5")return '<div>'+clock(9,5)+'<div class="arrow">離開公園</div></div>';
  if(f.indexOf("DIGI_")==0)return '<div><div class="digi">'+f.slice(5)+'</div><div class="arrow">香港現在時間</div></div>';
  if(f=="DIGI2")return '<div><div class="digi">2:50</div><div class="arrow">開始</div></div><div class="arrow">➜</div><div><div class="digi">3:20</div><div class="arrow">結束</div></div>';
  if(f=="TABLE_FILM")return '<table><tr><th>場次</th><th>放映時間</th></tr><tr><td>第一場</td><td>9:30 a.m.</td></tr><tr><td>第二場</td><td>12:10 p.m.</td></tr><tr><td>第三場</td><td>4:50 p.m.</td></tr></table>';
  if(f=="TABLE_SHOW")return '<table><tr><th>場次</th><th>開始</th><th>結束</th></tr><tr><td>第一場</td><td>下午 6:00</td><td>下午 6:40</td></tr><tr><td>第二場</td><td>下午 7:00</td><td>下午 7:40</td></tr><tr><td>第三場</td><td>下午 8:00</td><td>下午 8:40</td></tr></table>';
  if(f=="MAP")return mapSvg();
  if(f=="RULER")return rulerSvg();
  return "";
}
function norm(v,t){v=String(v==null?"":v).replace(/[\s,，]/g,"");if(t=="num"&&/^\d+$/.test(v))v=String(parseInt(v,10));return v;}
function isAnswered(i){var q=Q[i],a=ans[i];if(a==null)return false;if(q.mc)return a!=null;return a.some(function(x){return x!=null&&x!==""});}
function blankOk(q,a,k){var b=q.blanks[k];return b.a.some(function(x){return norm(x,b.t)===norm(a&&a[k],b.t)});}
function grade(i){var q=Q[i],a=ans[i];if(!isAnswered(i))return false;if(q.mc)return a===q.a;return q.blanks.every(function(_,k){return blankOk(q,a,k)});}
function ansText(i){var q=Q[i];return q.mc?String.fromCharCode(65+q.a)+". "+q.mc[q.a]:q.ans;}
function pickedText(i){var q=Q[i],a=ans[i];if(!isAnswered(i))return null;if(q.mc)return String.fromCharCode(65+a)+". "+q.mc[a];return a.map(function(x){return x==null||x===""?"（空）":x}).join(" / ");}

function render(){
  var q=Q[cur],L=$("left"),R=$("right");
  var el=submitted?Math.round((tEnd-t0)/60000):Math.floor((Date.now()-t0)/60000);
  L.innerHTML='<div class="meta"><span class="tag'+(q.partB?' b':'')+'">'+(q.partB?'乙部 列式計算（每題 4 分）':'甲部（每題 2 分）')+'</span><span>已答 '+Q.filter(function(_,i){return isAnswered(i)}).length+' / '+TOTAL+'　⏱ '+el+' 分鐘</span></div>'
   +'<div class="qno">第 '+(cur+1)+' 題</div><div class="qtext">'+q.text+'</div>'
   +(q.partB?'<div class="hint">請在紙上寫出橫式、直式和答句，再把答案數字輸入右邊。</div>':'')
   +'<div class="fig">'+fig(q.fig)+'</div>';
  var h='';
  if(q.mc){
    h+='<div class="mc">';q.mc.forEach(function(o,k){var c='opt';
      if(submitted){if(k===q.a)c+=' right';else if(ans[cur]===k)c+=' wrong';}else if(ans[cur]===k)c+=' sel';
      h+='<button class="'+c+'" onclick="pickMc('+k+')">'+String.fromCharCode(65+k)+'.　'+o+'</button>';});
    h+='</div>';
  }else{
    var a=ans[cur]||[];
    if(act>=q.blanks.length)act=0;
    h+='<div class="rows">';q.rows.forEach(function(r){h+='<div class="row">';r.forEach(function(p){
      if(typeof p=="string"){if(p)h+='<span>'+p+'</span>';}
      else{var k=p.b,b=q.blanks[k],c='blank'+(b.t=="num"&&String(b.a[0]).length<=2?' small':'');
        if(submitted)c+=blankOk(q,a,k)?' ok':' bad';else if(k===act)c+=' active';
        h+='<span class="'+c+'" onclick="setAct('+k+')">'+(a[k]!=null&&a[k]!==""?a[k]:'&nbsp;')+'</span>';}
    });h+='</div>';});h+='</div>';
    if(!submitted){var b=q.blanks[act];
      if(b.t=="opt"){h+='<div class="opts">';b.o.forEach(function(o){h+='<button class="opt'+(a[act]===o?' sel':'')+'" onclick="pickOpt(\''+o+'\')">'+o+'</button>';});h+='</div>';}
      else if(b.t=="cn"){h+='<div class="pad cn">';"零一二三四五六七八九十百千萬".split("").forEach(function(c){h+='<button onclick="key(\''+c+'\')">'+c+'</button>';});h+='<button class="fn" onclick="key(\'BS\')">⌫ 退格</button><div></div><div></div><div></div><button class="fn" onclick="key(\'CL\')">清除</button></div>';}
      else{h+='<div class="pad">';[1,2,3,4,5,6,7,8,9].forEach(function(n){h+='<button onclick="key(\''+n+'\')">'+n+'</button>';});h+='<button class="fn" onclick="key(\'CL\')">清除</button><button onclick="key(\'0\')">0</button><button class="fn" onclick="key(\'BS\')">⌫ 退格</button></div>';}
      if(q.blanks.length>1)h+='<div class="hint">點選空格，再輸入答案。</div>';}
  }
  if(submitted){var ok=res[cur];h+='<div class="res '+(ok?'ok':'bad')+'">'+(ok?'✔ 答對了！':'✘ 答錯了')+'<br>你的答案：'+(pickedText(cur)||'未作答')+'<br>正確答案：'+ansText(cur)+'</div>';}
  h+='<div class="nav"><button onclick="go(-1)">◀ 上一題</button><button class="go" onclick="go(1)">下一題 ▶</button></div>';
  h+='<div class="nav"><button onclick="showGrid()">▦ 題目一覽</button>'+(submitted?'<button class="sub" onclick="showScore()">成績</button>':'<button class="sub" onclick="askSubmit()">交卷</button>')+'</div>';
  R.innerHTML=h;
}
function setAct(k){if(submitted)return;act=k;render();}
function ensure(){if(!ans[cur])ans[cur]=Q[cur].blanks.map(function(){return ""});return ans[cur];}
function pickMc(k){if(submitted)return;ans[cur]=k;render();}
function nextBlank(){var q=Q[cur];if(act<q.blanks.length-1)act++;}
function pickOpt(o){var a=ensure();a[act]=o;nextBlank();render();}
function key(c){var a=ensure(),v=String(a[act]||"");
  if(c=="BS")v=v.slice(0,-1);else if(c=="CL")v="";else if(v.length<10)v+=c;a[act]=v;render();}
function go(d){var n=cur+d;if(n<0||n>=TOTAL)return;cur=n;act=0;render();}
function closeOv(){$("ov").style.display="none";}
function openOv(h){$("ovb").innerHTML=h;$("ov").style.display="flex";}
function gridHtml(){var h='<div class="grid">';Q.forEach(function(_,i){var c=submitted?(res[i]?'g':'r'):(isAnswered(i)?'done':'');h+='<button class="'+c+'" onclick="cur='+i+';act=0;closeOv();render()">'+(i+1)+'</button>';});return h+'</div>';}
function showGrid(){openOv('<div class="ovt">題目一覽</div><div class="ovp">'+(submitted?'綠色＝答對，紅色＝答錯。點題號看詳情。':'藍色＝已作答。點題號跳到該題。')+'</div>'+gridHtml()+'<div class="nav"><button onclick="closeOv()">關閉</button></div>');}
function askSubmit(){var un=Q.filter(function(_,i){return !isAnswered(i)}).length;
  openOv('<div class="ovt">確定交卷？</div><div class="ovp">'+(un?'還有 <b>'+un+'</b> 題未作答。':'全部題目已作答。')+'交卷後會顯示對錯和分數，不能再修改。</div><div class="nav"><button onclick="closeOv()">返回檢查</button><button class="sub" onclick="doSubmit()">確定交卷</button></div>');}
function doSubmit(){submitted=true;tEnd=Date.now();
  Q.forEach(function(q,i){res[i]=grade(i);var a=ans[i],ch=null;
    if(isAnswered(i))ch=q.mc?a:a.join("|");
    elhReport({type:"answer",q:i+1,choice:ch,correct:res[i],text:elhText(q.text),picked:pickedText(i),answer:elhText(ansText(i))});});
  showScore();render();}
function showScore(){var A=0,Bs=0,ca=0,cb=0;Q.forEach(function(q,i){if(res[i]){if(q.partB){Bs+=4;cb++}else{A+=2;ca++}}});
  openOv('<div class="ovt">成績</div><div class="big">'+(A+Bs)+' / 100 分</div><div class="ovp" style="text-align:center">甲部 '+A+' / 80 分（答對 '+ca+' / 40 題）　乙部 '+Bs+' / 20 分（答對 '+cb+' / 5 題）<br>用時約 '+Math.max(1,Math.round((tEnd-t0)/60000))+' 分鐘。乙部只核對答案；橫式、直式和答句請爸爸看紙上作答。</div>'+gridHtml()+'<div class="nav"><button onclick="closeOv()">逐題看答案</button></div>');}
setInterval(function(){if(!submitted&&$("ov").style.display!="flex")render();},60000);
render();
</script></body></html>
