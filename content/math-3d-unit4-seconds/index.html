<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>單元4 秒｜預習・學習・練習</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:"PingFang TC","Microsoft JhengHei",sans-serif;
  background:#f5f7fc;color:#17243d;touch-action:manipulation;
}
.stage{
  height:100%;display:grid;
  grid-template-columns:minmax(0,55fr) minmax(0,45fr);
  min-height:0;
}
.pane{min-width:0;min-height:0;overflow:auto;padding:2vmin 2.4vmin}
.pane+.pane{border-left:2px solid #d0d7e7}
h1{font-size:clamp(1.3rem,3.8vmin,6rem);line-height:1.25;margin:1vmin 0 1.5vmin}
.meta,.feedback,.mode-bar{font-size:clamp(1rem,2.5vmin,4.5rem);line-height:1.4}
.mode-bar{display:flex;flex-wrap:wrap;gap:1vmin;margin-bottom:1.5vmin}
.mode-bar button{font-size:clamp(0.95rem,2.4vmin,4rem);padding:0.6vmin 1.4vmin}
button,input,textarea{font:inherit}
button{
  min-height:max(3rem,6.5vmin);min-width:max(3rem,6.5vmin);
  font-size:clamp(1rem,3vmin,5.5rem);
  padding:.5vmin 1.2vmin;border:2px solid #536788;
  border-radius:1vmin;background:white;color:inherit;
  white-space:normal;overflow-wrap:anywhere;touch-action:manipulation;
}
button:focus-visible{outline:4px solid #ad5400;outline-offset:3px}
button[aria-pressed="true"]{border:4px solid #1b579f;background:#dceaff}
button:disabled{opacity:.5}
button.mode-active{border:4px solid #1b579f;background:#dceaff;font-weight:600}
.options{display:grid;gap:1.2vmin;margin-bottom:1.5vmin}
.actions{display:flex;flex-wrap:wrap;gap:1vmin;margin:1.2vmin 0}
.feedback{margin-top:1.2vmin;overflow-wrap:anywhere;min-height:4vmin}
input{
  width:100%;max-width:100%;min-height:8vmin;
  font-size:clamp(1.2rem,3.8vmin,6.5rem);scroll-margin-top:12vh;
  padding:0.8vmin 1.2vmin;border:2px solid #536788;border-radius:1vmin;
}
.numpad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1vmin;max-width:28vmin;margin-top:1vmin}
.numpad button{min-height:max(3rem,7.5vmin);min-width:0;font-size:clamp(1.2rem,3.5vmin,6rem)}
[hidden]{display:none!important}
.hint{font-size:clamp(0.95rem,2.3vmin,4rem);color:#4a5a78;margin:0.5vmin 0}
@media(max-width:899px),(orientation:portrait){
  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,42fr) minmax(0,58fr)}
  .pane+.pane{border-left:0;border-top:2px solid #d0d7e7}
}
</style>
</head>
<body>
<main class="stage">
  <section class="pane" aria-label="題目">
    <div class="mode-bar" id="modeBar" role="tablist">
      <button type="button" data-mode="pre" class="mode-active">預習</button>
      <button type="button" data-mode="learn">學習</button>
      <button type="button" data-mode="prac">練習</button>
    </div>
    <p class="meta" id="meta"></p>
    <h1 id="prompt"></h1>
    <div id="visual"></div>
    <nav class="actions" aria-label="換題">
      <button type="button" id="prev">上一題</button>
      <button type="button" id="next">下一題</button>
    </nav>
  </section>
  <section class="pane" aria-label="作答">
    <div class="options" id="choices"></div>
    <div id="fillArea" hidden>
      <input type="text" id="fillInput" inputmode="numeric" placeholder="請輸入答案" autocomplete="off" spellcheck="false">
      <div class="numpad" id="numpad">
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" data-key="clear">清除</button>
        <button type="button" data-key="0">0</button>
        <button type="button" data-key="back">退格</button>
      </div>
    </div>
    <div class="actions">
      <button type="button" id="check">確定／看答案</button>
    </div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
  </section>
</main>
<script>
function elhReport(m){
  try{
    if(location.search.indexOf("elhdebug")>=0)console.log("ELH",JSON.stringify(m));
    if(window.parent!==window)window.parent.postMessage(Object.assign({elh:1},m),location.origin);
  }catch(e){}
}
function elhText(h){return String(h==null?"":h).replace(/<[^>]*>/g,"").replace(/\s+/g," ").trim().slice(0,200);}

// ===== 題庫（老師已核定）=====
const BANK = {
  pre: [
    {id:"u4-pre-01", type:"mc", prompt:"1 分鐘 = 多少秒？", options:["30","60","100","120"], answer:1, explain:"1 分鐘 = 60 秒。"},
    {id:"u4-pre-02", type:"mc", prompt:"時鐘的秒針走一圈是多少秒？", options:["30 秒","60 秒","12 秒"], answer:1, explain:"秒針走一圈剛好是 60 秒。"},
    {id:"u4-pre-03", type:"mc", prompt:"2 分鐘 = 多少秒？", options:["100","120","200"], answer:1, explain:"2 × 60 = 120 秒。"},
    {id:"u4-pre-04", type:"mc", prompt:"90 秒 = 多少分鐘？", options:["1 分鐘","1 分 30 秒","2 分鐘"], answer:1, explain:"90 ÷ 60 = 1 餘 30，即 1 分 30 秒。"},
    {id:"u4-pre-05", type:"mc", prompt:"以下哪個時間較長？", options:["80 秒","1 分 10 秒"], answer:0, explain:"1 分 10 秒 = 70 秒，80 秒較長。"},
    {id:"u4-pre-06", type:"fill", prompt:"從 0 秒數到 60 秒，經過了多少秒？", answerText:"60", explain:"從 0 到 60 剛好經過 60 秒。"}
  ],
  learn: [
    {id:"u4-learn-01", type:"mc", prompt:"秒針從 12 走到 3，過了多少秒？", options:["10 秒","15 秒","20 秒","30 秒"], answer:1, explain:"時鐘一格是 5 秒，3 格 = 15 秒。"},
    {id:"u4-learn-02", type:"mc", prompt:"秒針從 12 走到 6，過了多少秒？", options:["20 秒","30 秒","40 秒","60 秒"], answer:1, explain:"半圈是 30 秒。"},
    {id:"u4-learn-03", type:"mc", prompt:"秒針從 12 走到 9，過了多少秒？", options:["30 秒","45 秒","50 秒","60 秒"], answer:1, explain:"3/4 圈是 45 秒。"},
    {id:"u4-learn-04", type:"mc", prompt:"秒針從 12 走回 12，過了多少秒？", options:["30 秒","45 秒","60 秒","90 秒"], answer:2, explain:"一圈 = 60 秒。"},
    {id:"u4-learn-05", type:"mc", prompt:"小明從 10 秒開始數到 40 秒，過了多少秒？", options:["20 秒","30 秒","40 秒","50 秒"], answer:1, explain:"40 − 10 = 30 秒。"},
    {id:"u4-learn-06", type:"mc", prompt:"小華從 25 秒數到 1 分 05 秒，過了多少秒？", options:["30 秒","35 秒","40 秒","45 秒"], answer:2, explain:"1 分 05 秒 = 65 秒，65 − 25 = 40 秒。"},
    {id:"u4-learn-07", type:"mc", prompt:"跑步用了 2 分 15 秒，等於多少秒？", options:["115 秒","125 秒","135 秒","145 秒"], answer:2, explain:"2 × 60 + 15 = 135 秒。"},
    {id:"u4-learn-08", type:"mc", prompt:"85 秒 = 幾分幾秒？", options:["1 分 15 秒","1 分 25 秒","1 分 35 秒","2 分 5 秒"], answer:1, explain:"85 ÷ 60 = 1 餘 25，即 1 分 25 秒。"}
  ],
  prac: [
    {id:"u4-prac-01", type:"mc", prompt:"3 分鐘 = 多少秒？", options:["160","180","200","240"], answer:1, explain:"3 × 60 = 180 秒。"},
    {id:"u4-prac-02", type:"mc", prompt:"150 秒 = 幾分幾秒？", options:["2 分 10 秒","2 分 30 秒","2 分 50 秒","3 分"], answer:1, explain:"150 ÷ 60 = 2 餘 30。"},
    {id:"u4-prac-03", type:"mc", prompt:"秒針從 2 走到 8，過了多少秒？", options:["20 秒","25 秒","30 秒","40 秒"], answer:2, explain:"6 格 × 5 秒 = 30 秒。"},
    {id:"u4-prac-04", type:"mc", prompt:"從 40 秒到 1 分 20 秒，過了多少秒？", options:["30 秒","40 秒","50 秒","80 秒"], answer:1, explain:"1 分 20 秒 = 80 秒，80 − 40 = 40 秒。"},
    {id:"u4-prac-05", type:"mc", prompt:"哪一個時間較長？", options:["2 分 10 秒","140 秒"], answer:1, explain:"2 分 10 秒 = 130 秒，140 秒較長。"},
    {id:"u4-prac-06", type:"mc", prompt:"1 分 45 秒 + 30 秒 = ？", options:["2 分 5 秒","2 分 15 秒","2 分 25 秒","2 分 45 秒"], answer:1, explain:"105 + 30 = 135 秒 = 2 分 15 秒。"},
    {id:"u4-prac-07", type:"mc", prompt:"4 分鐘 = 多少秒？", options:["200","220","240","280"], answer:2, explain:"4 × 60 = 240 秒。"},
    {id:"u4-prac-08", type:"mc", prompt:"從 15 秒數到 1 分，過了多少秒？", options:["35 秒","45 秒","55 秒","60 秒"], answer:1, explain:"60 − 15 = 45 秒。"},
    {id:"u4-prac-09", type:"mc", prompt:"210 秒 = 幾分幾秒？", options:["3 分 10 秒","3 分 30 秒","3 分 50 秒","4 分"], answer:1, explain:"210 ÷ 60 = 3 餘 30。"},
    {id:"u4-prac-10", type:"mc", prompt:"小玲游泳用了 3 分 20 秒，等於多少秒？", options:["180","190","200","220"], answer:2, explain:"3 × 60 + 20 = 200 秒。"}
  ]
};

const MODE_LABEL = {pre:"預習", learn:"學習", prac:"練習"};
const MODES = ["pre","learn","prac"];
const ALL_TOTAL = MODES.reduce(function(n,k){return n+BANK[k].length;},0);
function emptyProg(k){
  const n = BANK[k].length;
  return {i:0, p:Array(n).fill(null), r:Array(n).fill(false), f:Array(n).fill("")};
}
let progress = {pre:emptyProg("pre"), learn:emptyProg("learn"), prac:emptyProg("prac")};
let mode = "pre";
let QUESTIONS = BANK[mode];
let TOTAL = QUESTIONS.length;
let i = 0;
let picked = progress[mode].p;
let fillVal = progress[mode].f;
let revealed = progress[mode].r;
const $ = id => document.getElementById(id);

function elhState(){
  if (MODES.indexOf(mode) < 0 || !Number.isInteger(i) || i < 0 || i >= TOTAL) return;
  progress[mode].i = i;
  const snap = function(k){return {i:progress[k].i, p:progress[k].p.slice(), r:progress[k].r.slice(), f:progress[k].f.slice()};};
  const data = {mode:mode, i:i, all:ALL_TOTAL, pre:snap("pre"), learn:snap("learn"), prac:snap("prac")};
  if (JSON.stringify(data).length > 8000) {
    console.error("進度快照超過 8000 字元");
    return;
  }
  elhReport({type:"state", data:data});
}

function render(saveState = true){
  const q = QUESTIONS[i];
  $("meta").textContent = "單元4 秒｜" + MODE_LABEL[mode] + "｜第 " + (i + 1) + " / " + TOTAL + " 題";
  $("prompt").textContent = q.prompt;
  $("choices").replaceChildren();
  $("fillArea").hidden = true;
  $("feedback").textContent = "";

  if (q.type === "mc") {
    q.options.forEach(function(text, n){
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.pick = String(n);
      b.textContent = String.fromCharCode(65 + n) + "．" + text;
      b.setAttribute("aria-pressed", String(picked[i] === n));
      $("choices").appendChild(b);
    });
  } else {
    $("fillArea").hidden = false;
    $("fillInput").value = fillVal[i] || "";
    $("fillInput").readOnly = revealed[i];
  }

  $("prev").disabled = i === 0;
  $("next").disabled = i === TOTAL - 1;
  $("check").disabled = revealed[i];

  if (revealed[i]) {
    let result = "";
    if (q.type === "mc") {
      const p = picked[i];
      result = p === null ? "未作答；" : (p === q.answer ? "答對了！" : "再想一想；");
      result += "正確答案：" + q.options[q.answer] + "。" + q.explain;
    } else {
      const user = (fillVal[i] || "").trim();
      const ok = user === q.answerText;
      result = user === "" ? "未作答；" : (ok ? "答對了！" : "再想一想；");
      result += "正確答案：" + q.answerText + "。" + q.explain;
    }
    $("feedback").textContent = result;
  }
  if (saveState) elhState();
}

function submitCurrent(){
  if (revealed[i]) return;
  const q = QUESTIONS[i];
  let choice = null, correct = false, pickedText = null, answerText = "";

  if (q.type === "mc") {
    choice = picked[i];
    correct = choice !== null && choice === q.answer;
    pickedText = choice === null ? null : elhText(q.options[choice]);
    answerText = elhText(q.options[q.answer]);
  } else {
    const user = (fillVal[i] || "").trim();
    choice = user === "" ? null : user;
    correct = user === q.answerText;
    pickedText = user === "" ? null : elhText(user);
    answerText = elhText(q.answerText);
  }

  elhReport({
    type:"answer",
    q: q.id,
    choice: choice,
    correct: correct,
    text: elhText(q.prompt),
    picked: pickedText,
    answer: answerText
  });
  revealed[i] = true;
  render();
}

function switchMode(newMode){
  if (newMode === mode || !BANK[newMode]) return;
  progress[mode].i = i;
  mode = newMode;
  QUESTIONS = BANK[mode];
  TOTAL = QUESTIONS.length;
  i = progress[mode].i;
  picked = progress[mode].p;
  fillVal = progress[mode].f;
  revealed = progress[mode].r;
  document.querySelectorAll("#modeBar button").forEach(b => {
    b.classList.toggle("mode-active", b.dataset.mode === mode);
  });
  render(true);
}

document.addEventListener("click", function(e){
  if (!(e.target instanceof Element)) return;
  const b = e.target.closest("button");
  if (!b || b.disabled) return;

  if (b.dataset.mode) {
    switchMode(b.dataset.mode);
    return;
  }
  if (b.hasAttribute("data-pick")) {
    const n = Number(b.dataset.pick);
    if (!Number.isInteger(n) || n < 0 || n >= QUESTIONS[i].options.length) return;
    picked[i] = n;
    revealed[i] = false;
    render();
  } else if (b.id === "check") {
    if (QUESTIONS[i].type === "fill") {
      fillVal[i] = $("fillInput").value.trim();
    }
    submitCurrent();
  } else if (b.id === "prev" && i > 0) {
    i--; render();
  } else if (b.id === "next" && i < TOTAL - 1) {
    i++; render();
  } else if (b.dataset.key) {
    const key = b.dataset.key;
    const inp = $("fillInput");
    if (revealed[i]) return;
    if (key === "clear") inp.value = "";
    else if (key === "back") inp.value = inp.value.slice(0, -1);
    else inp.value += key;
    fillVal[i] = inp.value;
  }
});

$("fillInput").addEventListener("input", function(){
  if (!revealed[i]) fillVal[i] = this.value;
});

function applyProgress(d){
  function load(k){
    const n = BANK[k].length;
    const s = d[k];
    if (!s || !Number.isInteger(s.i) || s.i < 0 || s.i >= n || !Array.isArray(s.p) || s.p.length !== n || !Array.isArray(s.r) || s.r.length !== n) return false;
    for (let j = 0; j < n; j++){
      const q = BANK[k][j];
      if (s.p[j] !== null) {
        if (!q.options || !Number.isInteger(s.p[j]) || s.p[j] < 0 || s.p[j] >= q.options.length) return false;
      }
      if (typeof s.r[j] !== "boolean") return false;
    }
    progress[k].i = s.i;
    progress[k].p = s.p.slice();
    progress[k].r = s.r.slice();
    progress[k].f = Array.isArray(s.f) && s.f.length === n ? s.f.slice() : Array(n).fill("");
    return true;
  }
  if (!d || !BANK[d.mode] || !load("pre") || !load("learn") || !load("prac")) return false;
  mode = d.mode;
  QUESTIONS = BANK[mode];
  TOTAL = QUESTIONS.length;
  i = progress[mode].i;
  picked = progress[mode].p;
  fillVal = progress[mode].f;
  revealed = progress[mode].r;
  return true;
}

window.addEventListener("message", function(e){
  const m = e.data;
  if (window.parent === window || e.source !== window.parent || e.origin !== location.origin ||
      !m || m.elh !== 1 || m.type !== "restore") return;
  if (!applyProgress(m.data || {})) return;
  document.querySelectorAll("#modeBar button").forEach(b => {
    b.classList.toggle("mode-active", b.dataset.mode === mode);
  });
  render(false);
});

render(false);
elhReport({type:"init", total: ALL_TOTAL});
</script>
</body>
</html>
