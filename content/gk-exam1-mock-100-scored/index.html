<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 常識第一次考試｜模擬題 100（投屏練習・計分）</title>
<style>
:root{
  --bg:#f4efe6; --card:#fffdf8; --ink:#1c2430; --accent:#8b2e2e;
  --good:#157a3a; --good-bg:#dff6e8; --bad:#b42318; --bad-bg:#fde8e6;
  --pick:#1f6f8b; --muted:#6b7280; --line:#d8cfc0;
  --extra:#8b2e2e; --suggest:#1f6f8b;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Microsoft JhengHei",sans-serif;}
#app{height:100%;position:relative;overflow:hidden;}
.main{height:100%;display:grid;grid-template-columns:56% 44%;gap:1.6vmin;padding:1.6vmin;}
.col{min-width:0;min-height:0;display:flex;flex-direction:column;gap:1.2vmin;}
.left,.right{background:var(--card);border:2px solid var(--line);border-radius:1.6vmin;padding:1.6vmin;}
.left{overflow:auto;}
.right{overflow:hidden;}
.controls{display:flex;flex-wrap:wrap;gap:1.2vmin;align-items:center;}
.ctrl,.mode-btn,.nav-btn,.action-btn,.panel-btn,.option-btn,.order-item,.match-btn,.word-btn,.cloze-slot,.slot,.result-q{
  touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer;font-family:inherit;
}
.ctrl{min-height:max(3rem,6vmin);padding:1vmin 1.4vmin;border-radius:1.1vmin;border:2px solid var(--line);background:#fff;font-size:clamp(16px,2.4vmin,30px);font-weight:800;color:var(--ink);}
.ctrl:disabled{opacity:.45;cursor:not-allowed;}
.mode-btn{min-height:max(3rem,7vmin);padding:1.2vmin 1.8vmin;font-size:clamp(18px,2.8vmin,36px);}
.mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.progress-wrap{margin-top:.4vmin;}
.progress-text{font-size:clamp(16px,2.4vmin,30px);font-weight:800;margin-bottom:.6vmin;}
.progress-bar{height:1.2vmin;background:#e7dfd2;border-radius:1vmin;overflow:hidden;}
.progress-fill{height:100%;background:var(--pick);border-radius:1vmin;transition:width .2s ease;}
.chips{display:flex;flex-wrap:wrap;gap:1vmin;}
.chip{padding:.6vmin 1.2vmin;border-radius:1vmin;border:2px solid var(--line);background:#fff;font-size:clamp(14px,2vmin,24px);font-weight:800;}
.lesson-chip{color:var(--suggest);}
.type-chip{color:var(--extra);}
.q-chip{color:var(--accent);}
.prompt{max-width:28em;font-size:clamp(26px,4.2vmin,60px);line-height:1.35;font-weight:800;margin:.4vmin 0;}
.qtype-hint{font-size:clamp(14px,2vmin,24px);color:var(--muted);font-weight:700;margin:0 0 1vmin;}
.visual{margin:0 0 1.6vmin;flex:0 0 auto;}
.nav-row{display:flex;gap:1.2vmin;margin-top:auto;padding-top:1.2vmin;}
.nav-btn{flex:1;min-height:max(3rem,7vmin);padding:1.2vmin 1.6vmin;border-radius:1.2vmin;border:2px solid var(--line);background:#fff;font-size:clamp(18px,2.8vmin,36px);font-weight:800;color:var(--ink);}
.nav-btn:disabled{opacity:.45;cursor:not-allowed;}
.action-row{display:flex;flex-wrap:wrap;gap:1.2vmin;align-items:center;flex:0 0 auto;}
.action-btn{min-height:max(3rem,7vmin);padding:1.2vmin 1.8vmin;border-radius:1.2vmin;border:2px solid var(--line);background:#fff;font-size:clamp(18px,2.8vmin,36px);font-weight:800;color:var(--ink);}
.action-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.action-btn.good{background:var(--good-bg);color:var(--good);border-color:var(--good);}
.action-btn.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad);}
.action-btn:disabled{opacity:.45;cursor:not-allowed;}
.work{flex:1 1 auto;overflow:auto;min-height:0;padding:1.2vmin 0;}
.feedback{flex:0 0 auto;max-height:38%;overflow:auto;border-top:2px solid var(--line);padding-top:1.2vmin;font-size:clamp(16px,2.6vmin,34px);line-height:1.5;}
.feedback:empty{display:none;}
.fb-title{font-weight:900;font-size:1.15em;margin-bottom:.6vmin;}
.fb-good{color:var(--good);}
.fb-bad{color:var(--bad);}
.fb-answer{font-weight:800;margin:.4vmin 0;}
.fb-explain{margin-top:.8vmin;}
.fb-source{margin-top:.8vmin;font-size:.8em;color:var(--muted);}
.fb-note{color:var(--muted);font-weight:700;font-size:clamp(16px,2.6vmin,34px);line-height:1.45;}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.2vmin;}
.options-grid.two{grid-template-columns:1fr 1fr;}
.option-btn{min-height:max(3rem,7vmin);padding:1.4vmin 1.8vmin;border-radius:1.2vmin;border:2px solid var(--line);background:#fff;font-size:clamp(20px,3.3vmin,44px);font-weight:700;text-align:left;display:flex;align-items:center;gap:1vmin;color:var(--ink);}
.option-btn.selected{border-color:var(--pick);background:#e6f4f8;}
.option-btn.correct{border-color:var(--good);background:var(--good-bg);color:var(--good);}
.option-btn.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);}
.option-btn:disabled{cursor:default;}
.option-key{font-weight:900;color:var(--muted);}
.slots{display:flex;flex-wrap:wrap;gap:1.2vmin;margin-bottom:1.2vmin;}
.slot{min-height:max(3rem,7vmin);min-width:8vmin;padding:1vmin 1.4vmin;border-radius:1.2vmin;border:2px dashed var(--line);background:#fff;font-size:clamp(18px,2.8vmin,36px);font-weight:800;display:flex;align-items:center;gap:.8vmin;color:var(--ink);}
.slot.filled{border-style:solid;background:#f8fafc;}
.slot.correct{border-color:var(--good);background:var(--good-bg);color:var(--good);}
.slot.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);}
.slot:disabled{cursor:default;}
.slot-num{color:var(--muted);font-size:.8em;}
.order-items{display:flex;flex-direction:column;gap:1.2vmin;}
.order-item{min-height:max(3rem,7vmin);padding:1.2vmin 1.6vmin;border-radius:1.2vmin;border:2px solid var(--line);background:#fff;font-size:clamp(18px,2.8vmin,36px);font-weight:700;text-align:left;color:var(--ink);}
.order-item.used{opacity:.45;}
.order-item:disabled{cursor:default;}
.match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:1.6vmin;}
.match-col{display:flex;flex-direction:column;gap:1.2vmin;}
.match-btn{min-height:max(3rem,7vmin);padding:1.2vmin 1.4vmin;border-radius:1.2vmin;border:2px solid var(--line);background:#fff;font-size:clamp(18px,2.8vmin,36px);font-weight:700;text-align:left;color:var(--ink);position:relative;}
.match-btn.selected{border-color:var(--pick);background:#e6f4f8;}
.match-btn.paired{border-color:var(--pick);}
.match-badge{position:absolute;top:.4vmin;right:.6vmin;font-size:.7em;font-weight:900;padding:.2vmin .6vmin;border-radius:.8vmin;background:var(--pick);color:#fff;}
.pair-0{border-color:#1f6f8b;background:#e6f4f8;}
.pair-1{border-color:#8b2e2e;background:#fde8e6;}
.pair-2{border-color:#147a3a;background:#dff6e8;}
.pair-3{border-color:#5b21b6;background:#ede9fe;}
.pair-4{border-color:#c2410c;background:#ffedd5;}
.pair-5{border-color:#0f766e;background:#ccfbf1;}
.cloze-sentence{font-size:clamp(22px,3.6vmin,48px);line-height:1.8;font-weight:700;margin-bottom:1.6vmin;}
.cloze-slot{display:inline-flex;align-items:center;justify-content:center;min-width:8vmin;min-height:max(3rem,7vmin);padding:.6vmin 1.2vmin;margin:0 .4vmin;border-radius:1vmin;border:2px dashed var(--line);background:#fff;font-size:clamp(18px,2.8vmin,36px);font-weight:800;vertical-align:middle;color:var(--ink);}
.cloze-slot.active{border-color:var(--pick);box-shadow:0 0 0 .4vmin rgba(31,111,139,.25);}
.cloze-slot.filled{border-style:solid;background:#f8fafc;}
.cloze-slot.correct{border-color:var(--good);background:var(--good-bg);color:var(--good);}
.cloze-slot.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);}
.cloze-slot:disabled{cursor:default;}
.word-bank{display:flex;flex-wrap:wrap;gap:1.2vmin;margin-top:1.2vmin;}
.word-btn{min-height:max(3rem,7vmin);padding:1.2vmin 1.8vmin;border-radius:1.2vmin;border:2px solid var(--line);background:#fff;font-size:clamp(18px,2.8vmin,36px);font-weight:800;color:var(--ink);}
.word-btn:disabled{opacity:.45;cursor:not-allowed;}
.panel-layer{position:absolute;inset:0;background:rgba(28,36,48,.45);display:flex;align-items:center;justify-content:center;z-index:10;padding:2vmin;}
.panel-layer[hidden]{display:none;}
.panel{background:var(--card);border:3px solid var(--line);border-radius:2vmin;padding:2.4vmin;width:min(90%,1100px);max-height:90%;overflow:auto;box-shadow:0 1vmin 4vmin rgba(0,0,0,.2);}
.panel h2{margin:0 0 1.6vmin;font-size:clamp(24px,3.6vmin,48px);}
.panel p{font-size:clamp(18px,2.8vmin,36px);line-height:1.5;margin:.8vmin 0;}
.panel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(18vmin,1fr));gap:1.2vmin;}
.panel-btn{min-height:max(3rem,7vmin);padding:1.2vmin 1.6vmin;border-radius:1.2vmin;border:2px solid var(--line);background:#fff;font-size:clamp(18px,2.8vmin,36px);font-weight:800;color:var(--ink);}
.panel-btn.active{border-color:var(--pick);background:#e6f4f8;}
.panel-btn.correct{border-color:var(--good);background:var(--good-bg);color:var(--good);}
.panel-btn.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);}
.panel-btn.answered{border-color:var(--pick);background:#e6f4f8;}
.panel-actions{display:flex;gap:1.2vmin;justify-content:flex-end;margin-top:2vmin;flex-wrap:wrap;}
.summary-title{font-size:clamp(26px,4.2vmin,60px);font-weight:900;margin-bottom:1.6vmin;}
.summary-stats{display:flex;gap:1.6vmin;flex-wrap:wrap;margin-bottom:2vmin;}
.stat{background:#fff;border:2px solid var(--line);border-radius:1.2vmin;padding:1.2vmin 1.6vmin;min-width:14vmin;text-align:center;}
.stat-num{display:block;font-size:clamp(28px,4.8vmin,64px);font-weight:900;color:var(--accent);}
.stat-label{display:block;font-size:clamp(14px,2vmin,24px);color:var(--muted);font-weight:800;}
.lesson-stats{display:flex;flex-direction:column;gap:1.2vmin;}
.lesson-stat{background:#fff;border:2px solid var(--line);border-radius:1.2vmin;padding:1.2vmin 1.6vmin;}
.ls-name{font-size:clamp(16px,2.4vmin,30px);font-weight:800;margin-bottom:.6vmin;}
.ls-bar{height:1.4vmin;background:#e7dfd2;border-radius:1vmin;overflow:hidden;}
.ls-fill{height:100%;background:var(--good);border-radius:1vmin;transition:width .2s ease;}
.ls-text{font-size:clamp(14px,2vmin,24px);color:var(--muted);font-weight:700;margin-top:.6vmin;}
.summary-actions{display:flex;gap:1.2vmin;flex-wrap:wrap;margin-top:2vmin;}
.score-big{font-size:clamp(32px,6vmin,80px);font-weight:900;color:var(--accent);margin-bottom:.6vmin;}
.score-percent{font-size:clamp(24px,4vmin,52px);font-weight:900;color:var(--pick);margin-bottom:1.2vmin;}
.results-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(8vmin,1fr));gap:1.2vmin;margin-bottom:2vmin;}
.result-q{min-height:max(3rem,7vmin);border-radius:1.2vmin;border:2px solid var(--line);background:#fff;font-size:clamp(18px,2.8vmin,36px);font-weight:900;color:var(--ink);}
.result-q.correct{border-color:var(--good);background:var(--good-bg);color:var(--good);}
.result-q.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);}
.result-q.unanswered{border-color:var(--muted);background:#f3f4f6;color:var(--muted);}
.result-q.pending{border-color:var(--pick);background:#e6f4f8;color:var(--pick);}
.hl-name { color: #0b5f8a; font-weight: 800; font-size: 1.06em; }
.hl-num  { color: #c2410c; font-weight: 800; font-size: 1.12em; }
.hl-date { color: #5b21b6; font-weight: 800; }
.hl-org  { color: #147a3a; font-weight: 800; }
.hl-event{ color: #8b2e2e; font-weight: 800; font-size: 1.05em; }
.hl-place{ color: #1d4ed8; font-weight: 800; }
html.dark .hl-name { color: #7dd3fc; }
html.dark .hl-num  { color: #fdba74; }
html.dark .hl-date { color: #e9d5ff; }
html.dark .hl-org  { color: #86efac; }
.hl{font-weight:800}
.hl-key { color: #9a3412; font-weight: 800; font-size: 1.06em; }
html.dark .hl-key { color: #fcd34d; }
.type-chip { color: var(--extra); }
.lesson-chip { color: var(--suggest); }
.prompt { max-width: 28em; font-size: clamp(32px, 4.1vmin, 52px); }
.qtype-hint { font-size: 2vmin; color: var(--muted); font-weight: 700; margin: 0 0 1vmin; }
.visual { margin: 0 0 1.6vmin; flex: 0 0 auto; }
.label-card {
  display: inline-block; background: #fff7ed; color: #1c1917;
  border: 3px solid #c2410c; border-radius: 1.2vmin;
  padding: 1.2vmin 1.6vmin; font-weight: 700; font-size: 2.1vmin;
  min-width: 36vmin; line-height: 1.45;
}
html.dark .label-card { background: #3f1d0b; color: #ffedd5; border-color: #fdba74; }
.lc-top { font-size: 2.4vmin; font-weight: 800; color: #9a3412; }
html.dark .lc-top { color: #fdba74; }
.lc-sub { font-size: 1.7vmin; margin-bottom: .6vmin; }
.lc-row.hl { color: #c2410c; font-size: 2.3vmin; }
html.dark .lc-row.hl { color: #fdba74; }
.storage { display: flex; gap: 1vmin; flex-wrap: wrap; }
.st { padding: 1vmin 1.4vmin; border-radius: 1.1vmin; font-weight: 800; font-size: 2.2vmin; border: 2px solid var(--line); }
.st.bad { background: var(--bad-bg); }
.st.good { background: var(--good-bg); }
.milk-box { font-size: 3.4vmin; font-weight: 800; line-height: 1.3; }
.prompt{font-size:clamp(26px,4.2vmin,60px);}
.qtype-hint{font-size:clamp(14px,2vmin,24px);}
@media (max-width:900px), (orientation:portrait){
  html,body{overflow:auto;}
  #app{height:auto;min-height:100%;overflow:auto;}
  .main{grid-template-columns:1fr;height:auto;}
  .left,.right{overflow:visible;}
  .work{overflow:visible;}
  .feedback{max-height:none;}
}
</style>
</head>
<body>
<div id="app">
  <div id="main" class="main">
    <div id="left" class="col left"></div>
    <div id="right" class="col right"></div>
  </div>
  <div id="panelLayer" class="panel-layer" hidden>
    <div id="panel" class="panel" role="dialog" aria-modal="true"></div>
  </div>
</div>
<script>

    if(location.search.indexOf("elhdebug")>=0)console.log("ELH",JSON.stringify(m));
    if(window.parent!==window)window.parent.postMessage(Object.assign({elh:1},m),location.origin);

const QUESTIONS = [{"id": 1, "lesson": "藥到病除", "type": "cloze", "prompt": "供詞：陰涼／乾爽／小孩／變質。藥物應該儲存在____、____，並且____觸碰不到的地方。", "options": null, "answer": "陰涼、乾爽；小孩", "explain": "範圍寫明：儲存藥物的地方要陰涼、小孩觸碰不到、乾爽、太陽或燈光照射不到。正確儲存可避免藥物<span class=\"hl-key\">變質<\/span>或<span class=\"hl-key\">誤服<\/span>。", "source": "範圍冊1／印頁2–3；作業p-02、p-05", "correct_text": "陰涼、乾爽；小孩", "visual": "", "speak": "陰涼、乾爽；小孩。"}, {"id": 2, "lesson": "藥到病除", "type": "mcq", "prompt": "子文生病了，妹妹建議把「剩下的藥物」給哥哥吃。這樣做對嗎？", "options": ["對，因為藥還有剩餘", "對，家人的藥可以共用", "不對，不可以服用別人的藥物", "不對，因為藥已經過期了"], "answer": 2, "correct_text": "不對，不可以服用別人的藥物。", "explain": "範圍寫明：病人不可以服用別人的藥物。作業裏正確建議是媽媽說「趕快請醫生診治」。", "source": "範圍冊1／印頁2（P.7）；作業p-01", "visual": "", "speak": "不對，不可以服用別人的藥物。"}, {"id": 3, "lesson": "藥到病除", "type": "mcq", "prompt": "陳子文的藥物標籤寫着：每日服幾次？每隔幾小時服一次？每次幾粒？", "options": ["每日 3 次，每隔 3 小時，每次 2 粒", "每日 4 次，每隔 4 小時，每次 1 粒", "每日 2 次，每隔 6 小時，每次 1 粒", "每日 4 次，每隔 2 小時，每次 2 粒"], "answer": 1, "correct_text": "每日服 4 次；每隔 4 小時；每次 1 粒。", "explain": "作業藥物標籤：每日服 <span class=\"hl-num\">4<\/span> 次、每隔 <span class=\"hl-num\">4<\/span> 小時服 1 次、每次服 <span class=\"hl-num\">1<\/span> 粒、飯後。", "source": "作業p-01 藥物標籤", "visual": "\n<div class=\"visual label-card\" aria-hidden=\"true\">\n  <div class=\"lc-top\">王永一醫務所<\/div>\n  <div class=\"lc-sub\">旺角上海街 446 號<\/div>\n  <div class=\"lc-row\"><b>姓名<\/b> 陳子文<\/div>\n  <div class=\"lc-row\"><b>藥名<\/b> Coritab　<span>效用：防敏感<\/span><\/div>\n  <div class=\"lc-row hl\"><b>每日服<\/b> 4 次　<b>每隔<\/b> 4 小時<\/div>\n  <div class=\"lc-row hl\"><b>每次<\/b> 1 粒　☑ 飯後<\/div>\n  <div class=\"lc-foot\">2019 年 9 月 18 日<\/div>\n<\/div>", "speak": "每日服 4 次；每隔 4 小時；每次 1 粒。"}, {"id": 4, "lesson": "藥到病除", "type": "mcq", "prompt": "子文上午十時服了藥，標籤寫每隔 4 小時服一次。他下午何時要再服？", "options": ["下午一時", "下午二時", "下午三時", "晚上十時"], "answer": 1, "correct_text": "下午二時。", "explain": "上午十時加 <span class=\"hl-num\">4<\/span> 小時＝下午 <span class=\"hl-num\">2<\/span> 時。", "source": "作業p-01", "visual": "", "speak": "下午二時。"}, {"id": 5, "lesson": "藥到病除", "type" : "範圍冊1／印頁2–3", "visual": "", "speak": "及早求醫，並清楚說出病情。"}, {"id": 16, "lesson": "藥到病除", "type": "order", "prompt": "排序：生病求診與服藥的正確步驟。請把正確順序排出。", "options": ["按照醫生指示定時定量服藥", "身體不適，及早求醫", "仔細閱讀藥物標籤", "清楚說出病情，小心聆聽指示"], "answer_order": ["B", "D", "C", "A"], "correct_text": "B → D → C → A", "explain": "先及早求醫 → 說病情聽指示 → 讀標籤 → 定時定量服藥。", "source": "範圍冊1／印頁2–3", "visual": "", "speak": "B → D → C → A。"}, {"id": 17, "lesson": "藥到病除", "type": "judge", "prompt": "判斷：我們可以向中醫或西醫求診。", "options": ["✓ 正確", "✗ 不正確"], "answer": 0, "correct_text": "✓ 正確。", "explain": "範圍本課總結寫明：可以向中醫或西醫求診。", "source": "範圍冊1／印頁3", "visual": "", "speak": "✓ 正確。"}, {"id": 18, "lesson": "遠離煙酒和毒品", "type": "mcq", "prompt": "面對別人遞來的煙或酒，我們應該怎樣做？", "options": ["試一口看看", "為了面子先接受", "堅決拒絕", "等長大再決定，現在隨便"], "answer": 2, "correct_text": "堅決拒絕。", "explain": "吸煙和喝酒都會損害健康，我們要<span class=\"hl-key\">堅決拒絕<\/span>。", "source": "範圍冊1／印頁4", "visual": "", "speak": "堅決拒絕。"}, {"id": 19, "lesson": "遠離煙酒和毒品", "type": "cloze", "prompt": "供詞：判斷力／儀容／嚴重疾病。吸煙會危害健康，並影響____；喝酒容易使人失去____；長期吸煙和喝酒會增加患上____的機會。", "options": null, "answer": "儀容；判斷力；嚴重疾病", "explain": "總結：吸煙影響<span class=\"hl-key\">儀容<\/span>；喝酒失去<span class=\"hl-key\">判斷力<\/span>；長期吸煙喝酒增加患上<span class=\"hl-key\">嚴重疾病<\/span>的機會，甚至引致死亡。", "source": "範圍冊1／印頁4", "correct_text": "儀容；判斷力；嚴重疾病", "visual": "", "speak": "儀容；判斷力；嚴重疾病。"}, {"id": 20, "lesson": "遠離煙酒和毒品", "type": "mcq", "prompt": "下列哪一項不是範圍所列「吸食毒品」的禍害？", "options": ["使人情緒和行為失控", "嚴重損害健康，甚至失去生命", "影響學習、工作和儀容", "增強記憶力和抵抗力"], "answer": 3, "correct_text": "增強記憶力和抵抗力（這不是禍害，也不是事實）。", "explain": "範圍五點：情緒和行為失控、嚴重損害健康、失去生命、影響學習和工作、影響儀容。作業亦否定「增強記憶力／抵抗力」。", "source": "範圍冊1／印頁4；作業p-04", "visual": "", "speak": "增強記憶力和抵抗力（這不是禍害，也不是事實）。"}, {"id": 21, "lesson": "遠離煙酒和毒品", "type": "judge", "prompt": "判斷：嘗試吸一口煙是沒有問題的。", "options": ["✓ 正確", "✗ 不正確"], "answer": 1, "correct_text": "✗ 不正確。", "explain": "即使「嘗一口」也不對，要堅決拒絕。", "source": "作業p-04 ①", "visual": "", "speak": "✗ 不正確。"}, {"id": 22, "lesson": "遠離煙酒和毒品", "type": "judge", "prompt": "判斷：吸煙和喝酒都是危害健康的行為。", "options": ["✓ 正確", "✗ 不正確"], "answer": 0, "correct_text": "✓ 正確。", "explain": "範圍與作業均確認。", "source": "範圍冊1／印頁4；作業p-04 ②", "visual": "", "speak": "✓ 正確。"}, {"id": 23, "lesson": "遠離煙酒和毒品", "type": "judge", "prompt": "判斷：吸毒可以令人忘記不開心的事情，所以有時可以試一下。", "options": ["✓ 正確", "✗ 不正確"], "answer": 1, "correct_text": "✗ 不正確。", "explain": "吸毒禍害很大，不能用來「忘記不開心」；要堅決拒絕。", "source": "作業p-04 ③", "visual": "", "speak": "✗ 不正確。"}, {"id": 24, "lesson": "遠離煙酒和毒品", "type": "judge", "prompt": "判斷：吸毒會引致死亡。", "options": ["✓ 正確", "✗ 不正確"], "answer": 0, "correct_text": "✓ 正確。", "explain": "範圍：失去生命；作業判斷亦 ✓。", "source": "範圍冊1／印頁4；作業p-04 ④", "visual": "", "speak": "✓ 正確。"}, {"id": 25, "lesson": "遠離煙酒和毒品", "type": "short", "prompt": "簡答：海明叫芳芳「試吃一次無妨」。芳芳應該怎樣做？為甚麼？（完整句）", "options": null, "answer": "芳芳應該堅決拒絕，因為吸毒會嚴重損害健康，甚至使人情緒和行為失控、失去生命。", "explain": "示範：芳芳應該<span class=\"hl-key\">堅決拒絕<\/span>。若依從，可能嚴重損害健康、情緒和行為失控等。", "source": "作業p-04；範圍冊1／印頁4", "correct_text": "芳芳應該堅決拒絕，因為吸毒會嚴重損害健康，甚至使人情緒和行為失控、失去生命。", "visual": "", "speak": "芳芳應該堅決拒絕，因為吸毒會嚴重損害健康，甚至使人情緒和行為失控、失去生命。"}, {"id": 26, "lesson": "遠離煙酒和毒品", "type": "mcq", "prompt": "文浩對表弟說「我們嘗一口啤酒吧！」表弟應該怎樣做？", "options": ["先嘗一口再決定", "堅決拒絕", "只喝一點點不要緊", "叫文浩喝給自己看"], "answer": 1, "correct_text": "堅決拒絕。", "explain": "文浩的建議不對；喝酒損害健康，表弟應堅決拒絕。", "source": "作業p-06", "visual": "", "speak": "堅決拒絕。"}, {"id": 27, "lesson": "遠離煙酒和毒品", "type": "mcq", "prompt": "喝酒容易使人出現下列哪一項問題？（以本年範圍為準）", "options": ["失去判斷力，行為不受控制", "牙齒變得更潔白", "記憶力立刻增強", "儀容變得更好"], "answer": 0, "correct_text": "失去判斷力，行為不受控制。", "explain": "範圍總結特別指出喝酒使人失去<span class=\"hl-key\">判斷力<\/span>。", "source": "範圍冊1／印頁4；作業p-06", "visual": "", "speak": "失去判斷力，行為不受控制。"}, {"id": 28, "lesson": "遠離煙酒和毒品", "type": "match", "prompt": "配對：把行為與範圍所述的主要禍害連起來。", "options": ["1. 吸煙 → ?", "2. 喝酒 → ?", "3. 吸毒 → ?", "A. 影響儀容、危害健康", "B. 失去判斷力、行為不受控制", "C. 情緒和行為失控、嚴重損害健康、甚至失去生命"], "answer_match": {"1": "A", "2": "B", "3": "C"}, "correct_text": "1-A；2-B；3-C", "explain": "不要張冠李戴：儀容多與吸煙並列總結；判斷力對喝酒；情緒失控等對吸毒（吸毒亦列影響儀容）。", "source": "範圍冊1／印頁4", "visual": "", "speak": "1-A；2-B；3-C。"}, {"id": 29, "lesson": "遠離煙酒和毒品", "type": "mcq", "prompt": "下列哪些是吸毒的禍害？", "options": ["只會影響儀容，不會影響生命", "只會令身體更強壯", "影響儀容、影響學習和工作、失去生命等", "只會蛀牙"], "answer": 2, "correct_text": "影響儀容、影響學習和工作、失去生命等。", "explain": "作業選擇：以上多項都是；對應範圍五點。", "source": "範圍冊1／印頁4；作業p-06", "visual": "", "speak": "影響儀容、影響學習和工作、失去生命等。"}, {"id": 30, "lesson": "遠離煙酒和毒品", "type": "short", "prompt": "簡答：舉出兩項吸食毒品的禍害。（完整句）", "options": null, "answer": "吸食毒品會使人情緒和行為失控，並嚴重損害健康，甚至失去生命。（亦可寫影響學習和工作、影響儀容。）", "explain": "任選範圍五點中兩項，寫完整句。", "source": "範圍冊1／印頁4", "correct_text": "吸食毒品會使人情緒和行為失控，並嚴重損害健康，甚至失去生命。（亦可寫影響學習和工作、影響儀容。）", "visual": "", "speak": "吸食毒品會使人情緒和行為失控，並嚴重損害健康，甚至失去生命。（亦可寫影響學習和工作、影響儀容。）"}, {"id": 31, "lesson": "遠離煙酒和毒品", "type": "judge", "prompt": "判斷：我們要堅決拒絕吸毒，也不要接受別人遞來的不明物品。", "options": ["✓ 正確", "✗ 不正確"], "answer": 0, "correct_text": "✓ 正確。", "explain": "範圍圖示與總結：堅決拒絕吸毒。", "source": "範圍冊1／印頁4（P.14）", "visual": "", "speak": "✓ 正確。"}, {"id": 32, "lesson": "遠離煙酒和毒品", "type": "mcq", "prompt": "長期吸煙和喝酒，可能帶來甚麼後果？", "options": ["完全沒有影響", "增加患上嚴重疾病的機會，甚至引致死亡", "只會短暫頭痛", "一定會令成績進步"], "answer": 1, "correct_text": "增加患上嚴重疾病的機會，甚至引致死亡。", "explain": "範圍本課總結原文。", "source": "範圍冊1／印頁4", "visual": "", "speak": "增加患上嚴重疾病的機會，甚至引致死亡。"}, {"id": 33, "lesson": "我的情緒", "type": "mcq", "prompt": "下列哪一組是正面情緒？", "options": ["傷心、生氣", "開心、興奮", "害怕、失望", "緊張、生氣"], "answer": 1, "correct_text": "開心、興奮。", "explain": "範圍：開心、興奮是<span class=\"hl-key\">正面<\/span>情緒；傷心、生氣是<span class=\"hl-key\">負面<\/span>情緒。", "source": "範圍冊1／印頁7", "visual": "", "speak": "開心、興奮。"}, {"id": 34, "lesson": "我的情緒", "type": "match", "prompt": "配對：情境與可能產生的情緒。", "options": ["1. 下雨取消野餐", "2. 弟弟弄髒圖書", "3. 大狗突然吠叫", "4. 老師稱讚彈琴進步", "A. 失望", "B. 生氣", "C. 害怕", "D. 開心"], "answer_match": {"1": "A", "2": "B", "3": "C", "4": "D"}, "correct_text": "1-A；2-B；3-C；4-D", "explain": "對應作業p-07 配對。失望、生氣、害怕屬負面；開心屬正面。", "source": "作業p-07；範圍冊1／印頁7", "visual": "", "speak": "1-A；2-B；3-C；4-D。"}, {"id": 35, "lesson": "我的情緒", "type": "judge", "prompt": "判斷：不快樂時，做運動是其中一個放鬆心情的方法。", "options": ["✓ 正確", "✗ 不正確"], "answer": 0, "correct_text": "✓ 正確。", "explain": "範圍：大哭一場、向別人傾訴、做運動；總結亦有聽音樂。", "source": "範圍冊1／印頁7–8；作業p-08", "visual": "", "speak": "✓ 正確。"}, {"id": 36, "lesson": "我的情緒", "type": "judge", "prompt": "判斷：生氣時可以踢壞玩具來發洩。", "options": ["✓ 正確", "✗ 不正確"], "answer": 1, "correct_text": "✗ 不正確。", "explain": "不要破壞物件；不要胡亂發脾氣。", "source": "範圍冊1／印頁8；作業p-08", "visual": "", "speak": "✗ 不正確。"}, {"id": 37, "lesson": "我的情緒", "type": "judge", "prompt": "判斷：向別人傾訴、聽音樂，都是放鬆心情的恰當方法。", "options": ["✓ 正確", "✗ 不正確"], "answer": 0, "correct_text": "✓ 正確。", "explain": "範圍與作業均支持。", "source": "範圍冊1／印頁7–8；作業p-08", "visual": "", "speak": "✓ 正確。"}, {"id": 38, "lesson": "我的情緒", "type": "order", "prompt": "排序：生氣時較恰當的做法。", "options": ["先冷靜下來", "然後表達自己的感受", "以正面的態度思考"], "answer_order": ["A", "B", "C"], "correct_text": "A → B → C", "explain": "生氣時要先冷靜下來，然後才表達自己的感受，並以正面的態度去思考。", "source": "範圍冊1／印頁7–8；作業p-08", "visual": "", "speak": "A → B → C。"}, {"id": 39, "lesson": "我的情緒", "type": "short", "prompt": "簡答：美恩溫習時，弟弟又跑又叫，令她不快樂。她應該怎樣做？（完整句）", "options": null, "answer": "美恩應該先冷靜下來，然後向媽媽說出事情的經過。", "explain": "示範：先<span class=\"hl-key\">冷靜<\/span>下來，再向媽媽說明，不要先發脾氣或責罵。", "source": "作業p-08；範圍冊1／印頁7", "correct_text": "美恩應該先冷靜下來，然後向媽媽說出事情的經過。", "visual": "", "speak": "美恩應該先冷靜下來，然後向媽媽說出事情的經過。"}, {"id": 40, "lesson": "我的情緒", "type": "mcq", "prompt": "圖畫比賽沒有入選。下列哪一句是積極的想法？", "options": ["以後不再畫畫了", "努力練習，下次要畫得更好", "永遠不理繪畫老師", "把畫撕掉出氣"], "answer": 1, "correct_text": "努力練習，下次要畫得更好。", "explain": "積極面對困難，尋求解決方法；消極是「以後不再畫畫」。", "source": "作業p-11；範圍冊1／印頁7–8", "visual": "", "speak": "努力練習，下次要畫得更好。"}, {"id": 41, "lesson": "我的情緒", "type": "mcq", "prompt": "爸爸忘記買生日蛋糕。下列哪一句是積極的態度？", "options": ["不再理會爸爸", "體諒爸爸下班已經很累", "立刻大發脾氣摔門", "整天不說話懲罰他"], "answer": 1, "correct_text": "體諒爸爸下班已經很累。", "explain": "以正面／積極態度面對不如意事情。", "source": "作業p-11", "visual": "", "speak": "體諒爸爸下班已經很累。"}, {"id": 42, "lesson": "我的情緒", "type": "cloze", "prompt": "供詞：負面／正面。遇到不如意事情，我們可能產生____情緒，應該以____的態度面對，嘗試解決問題。", "options": null, "answer": "負面；正面（或積極）", "explain": "作業單元加油站填充與範圍一致。", "source": "作業p-11；範圍冊1／印頁7", "correct_text": "負面；正面（或積極）", "visual": "", "speak": "負面；正面（或積極）。"}, {"id": 43, "lesson": "我的情緒", "type": "judge", "prompt": "判斷：胡亂發脾氣只會傷害別人，不會傷害自己。", "options": ["✓ 正確", "✗ 不正確"], "answer": 1, "correct_text": "✗ 不正確。", "explain": "胡亂發脾氣會傷害自己和別人。", "source": "範圍冊1／印頁7（P.22）", "visual": "", "speak": "✗ 不正確。"}, {"id": 44, "lesson": "我的情緒", "type": "mcq", "prompt": "下列哪一項不是恰當的紓緩方法？", "options": ["大哭一場", "做運動", "暴飲暴食", "向別人傾訴"], "answer": 2, "correct_text": "暴飲暴食。", "explain": "作業：吃大量雪糕薯片屬不恰當；大哭在範圍有舉例。", "source": "範圍冊1／印頁7；作業p-08", "visual": "", "speak": "暴飲暴食。"}, {"id": 45, "lesson": "我的情緒", "type": "short", "prompt": "簡答：舉出兩種放鬆心情的方法。（完整句）", "options": null, "answer": "我們可以大哭一場、向別人傾訴、做運動或聽音樂來放鬆心情。", "explain": "任選兩項以上，寫完整句。", "source": "範圍冊1／印頁7–8", "correct_text": "我們可以大哭一場、向別人傾訴、做運動或聽音樂來放鬆心情。", "visual": "", "speak": "我們可以大哭一場、向別人傾訴、做運動或聽音樂來放鬆心情。"}, {"id": 46, "lesson": "我的情緒", "type": "mcq", "prompt": "「害怕」屬於哪一類情緒？", "options": ["正面情緒", "負面情緒", "不是情緒", "只有大人會有"], "answer": 1, "correct_text": "負面情緒。", "explain": "預習與作業把害怕、失望、緊張、生氣等歸入負面。", "source": "範圍冊1／印頁6–7；作業p-07", "visual": "", "speak": "負面情緒。"}, {"id": 47, "lesson": "我的情緒", "type": "judge", "prompt": "判斷：遇到困難時，要積極面對，努力尋求解決方法。", "options": ["✓ 正確", "✗ 不正確"], "answer": 0, "correct_text": "✓ 正確。", "explain": "範圍 P.24 與本課總結。", "source": "範圍冊1／印頁7–8", "visual": "", "speak": "✓ 正確。"}, {"id": 48, "lesson": "我的情緒", "type": "mcq", "prompt": "生氣時，下列哪一項做法較好？", "options": ["先冷靜，再表達感受", "立刻破壞物件", "傷害自己出氣", "不理後果大吵大鬧"], "answer": 0, "correct_text": "先冷靜，再表達感受。", "explain": "範圍與腦圖：先冷靜才表達；正面態度思考。", "source": "範圍冊1／印頁7–8、11", "visual": "", "speak": "先冷靜，再表達感受。"}, {"id": 49, "lesson": "我的好朋友", "type": "cloze", "prompt": "供詞：分享／關心／支持／幫助。朋友之間要互相____、____、____和____。", "options": null, "answer": "分享、關心、支持、幫助", "explain": "範圍 P.27 四點；作業填圖亦反覆練習。", "source": "範圍冊1／印頁9；作業p-09", "correct_text": "分享、關心、支持、幫助", "visual": "", "speak": "分享、關心、支持、幫助。"}, {"id": 50, "lesson": "我的好朋友", "type": "match", "prompt": "配對：志文和好朋友的行為。", "options": ["1. 操場一起玩", "2. 跑道旁喊加油", "3. 一齊做功課", "4. 借書給對方", "5. 教導對方明白題目", "6. 問對方為甚麼悶悶不樂", "A. 玩耍", "B. 支持", "C. 學習", "D. 分享", "E. 幫助", "F. 關心"], "answer_match": {"1": "A", "2": "B", "3": "C", "4": "D", "5": "E", "6": "F"}, "correct_text": "1A 2B 3C 4D 5E 6F", "explain": "對應作業p-09 字庫填圖。", "source": "作業p-09", "visual": "", "speak": "1A 2B 3C 4D 5E 6F。"}, {"id": 51, "lesson": "我的好朋友", "type": "mcq", "prompt": "心惠要欣欣抄她的功課。欣欣應該怎樣做？", "options": ["立刻抄寫", "告訴心惠自己不會抄她的功課", "完全不理會，假裝沒聽見", "把功課拍下來再抄"], "answer": 1, "correct_text": "告訴心惠自己不會抄她的功課。", "explain": "堅決拒絕朋友不當的要求，並可提醒對方做得不對。", "source": "作業p-10；範圍冊1／印頁10", "visual": "", "speak": "告訴心惠自己不會抄她的功課。"}, {"id": 52, "lesson": "我的好朋友", "type": "mcq", "prompt": "家宜說：「剛才你取笑我胖，我很不開心！」欣欣應該怎樣做？", "options": ["說「這是小事」", "說「對不起」", "繼續取笑", "不理會她"], "answer": 1, "correct_text": "說「對不起」。", "explain": "做錯事要向朋友說對不起。", "source": "作業p-10；範圍冊1／印頁10", "visual": "", "speak": "說「對不起」。"}, {"id": 53, "lesson": "我的好朋友", "type": "short", "prompt": "簡答：朋友提出不當的要求時，我們應該怎樣做？（完整句）", "options": null, "answer": "我們應該堅決拒絕，並提醒他做得不對的地方。", "explain": "範圍與交友小貼士原文方向一致。", "source": "範圍冊1／印頁10–11；作業p-10", "correct_text": "我們應該堅決拒絕，並提醒他做得不對的地方。", "visual": "", "speak": "我們應該堅決拒絕，並提醒他做得不對的地方。"}, {"id": 54, "lesson": "我的好朋友", "type": "cloze", "prompt": "供詞：坦白／尊重／商量。有不同意見時，可以____說出來，互相____，心平氣和地____。", "options": null, "answer": "坦白；尊重；商量", "explain": "範圍 P.29–30；腦圖印頁11。", "source": "範圍冊1／印頁10–11", "correct_text": "坦白；尊重；商量", "visual": "", "speak": "坦白；尊重；商量。"}, {"id": 55, "lesson": "我的好朋友", "type": "judge", "prompt": "判斷：比賽時為朋友打氣，是互相支持的表現。", "options": ["✓ 正確", "✗ 不正確"], "answer": 0, "correct_text": "✓ 正確。", "explain": "作業看圖判斷。", "source": "作業p-12；範圍冊1／印頁9", "visual": "", "speak": "✓ 正確。"}, {"id": 56, "lesson": "我的好朋友", "type": "judge", "prompt": "判斷：好朋友不會介意我偷看她的日記。", "options": ["✓ 正確", "✗ 不正確"], "answer": 1, "correct_text": "✗ 不正確。", "explain": "偷看日記是不 e": "作業p-11；範圍冊1／印頁10", "correct_text": "友誼", "visual": "", "speak": "友誼。"}, {"id": 65, "lesson": "我的好朋友", "type": "judge", "prompt": "判斷：邀請朋友參加生日會，是關心朋友的一種表現。", "options": ["✓ 正確", "✗ 不正確"], "answer": 0, "correct_text": "✓ 正確。", "explain": "作業看圖判斷為正確。", "source": "作業p-12", "visual": "", "speak": "✓ 正確。"}, {"id": 66, "lesson": "香港的動物", "type": "diagram", "prompt": "填圖分類：蝴蝶身體分頭胸腹、有三對腳、兩對翅膀。牠屬於____類；是脊椎還是無脊椎動物？", "options": ["哺乳類／脊椎", "昆蟲類／無脊椎", "鳥類／脊椎", "魚類／無脊椎"], "answer": 1, "correct_text": "昆蟲類；無脊椎動物。", "explain": "昆蟲：頭胸腹、三對腳、觸角、部分有翅；無脊柱。", "source": "範圍冊2／印頁2；作業p-13", "visual": "", "speak": "昆蟲類；無脊椎動物。"}, {"id": 67, "lesson": "香港的動物", "type": "diagram", "prompt": "填圖分類：水牛用母乳餵養幼兒、用肺呼吸、身體有毛髮。牠屬於____類。", "options": ["昆蟲類", "魚類", "哺乳類", "鳥類"], "answer": 2, "correct_text": "哺乳類。", "explain": "哺乳類三大特徵；屬脊椎動物。", "source": "範圍冊2／印頁2；作業p-13", "visual": "", "speak": "哺乳類。"}, {"id": 68, "lesson": "香港的動物", "type": "diagram", "prompt": "填圖分類：鷺全身羽毛、用喙取食、有一對翅膀和一對腳、用肺呼吸。牠屬於____類。", "options": ["魚類", "昆蟲類", "哺乳類", "鳥類"], "answer": 3, "correct_text": "鳥類。", "explain": "鳥類特徵；脊椎動物。米埔濕地為鳥類等提供棲息和覓食環境。", "source": "範圍冊2／印頁2；作業p-13", "visual": "", "speak": "鳥類。"}, {"id": 69, "lesson": "香港的動物", "type": "diagram", "prompt": "填圖分類：海魚有鱗片、用鰭游動、用鰓呼吸。牠屬於____類。", "options": ["鳥類", "魚類", "昆蟲類", "哺乳類"], "answer": 1, "correct_text": "魚類。", "explain": "魚類特徵；脊椎動物。", "source": "範圍冊2／印頁3；作業p-13", "visual": "", "speak": "魚類。"}, {"id": 70, "lesson": "香港的動物", "type": "mcq", "prompt": "下列哪一項是哺乳類的特徵？", "options": ["用鰓呼吸", "有三對腳", "用母乳餵養幼兒", "全身長有羽毛"], "answer": 2, "correct_text": "用母乳餵養幼兒。", "explain": "另：用肺呼吸、身體表面長有毛髮。", "source": "範圍冊2／印頁2", "visual": "", "speak": "用母乳餵養幼兒。"}, {"id": 71, "lesson": "香港的動物", "type": "mcq", "prompt": "下列哪一項是昆蟲類的特徵？", "options": ["用母乳餵養幼兒", "身體分為頭、胸和腹，有三對腳", "用鰭游動", "全身羽毛"], "answer": 1, "correct_text": "身體分為頭、胸和腹，有三對腳。", "explain": "還有一對觸角；部分有一對或兩對翅膀；無脊椎。", "source": "範圍冊2／印頁2", "visual": "", "speak": "身體分為頭、胸和腹，有三對腳。"}, {"id": 72, "lesson": "香港的動物", "type": "mcq", "prompt": "魚類用甚麼呼吸？用甚麼游動？", "options": ["肺；腳", "鰓；鰭", "皮膚；翅膀", "喙；觸角"], "answer": 1, "correct_text": "用鰓呼吸；用鰭游動。", "explain": "通常有鱗片保護身體。", "source": "範圍冊2／印頁3", "visual": "", "speak": "用鰓呼吸；用鰭游動。"}, {"id": 73, "lesson": "香港的動物", "type": "judge", "prompt": "判斷：昆蟲是無脊椎動物；魚類、鳥類、哺乳類是脊椎動物。", "options": ["✓ 正確", "✗ 不正確"], "answer": 0, "correct_text": "✓ 正確。", "explain": "範圍總結與作業分類一致。", "source": "範圍冊2／印頁2–3；作業p-13", "visual": "", "speak": "✓ 正確。"}, {"id": 74, "lesson": "香港的動物", "type": "mcq", "prompt": "位於甚麼地方的濕地，為許多野生動物（例如鳥類）提供棲息和覓食的環境？", "options": ["維多利亞港中心", "米埔", "山頂纜車", "尖沙咀鐘樓"], "answer": 1, "correct_text": "米埔。", "explain": "範圍寫明<span class=\"hl-place\">米埔<\/span>濕地。", "source": "範圍冊2／印頁2", "visual": "", "speak": "米埔。"}, {"id": 75, "lesson": "香港的動物", "type": "short", "prompt": "簡答：舉出兩種在香港數量變得稀少、正面對威脅的動物例子。（完整句）", "options": null, "answer": "例如盧氏小樹蛙和穿山甲。", "explain": "範圍原文例子。", "source": "範圍冊2／印頁3", "correct_text": "例如盧氏小樹蛙和穿山甲。", "visual": "", "speak": "例如盧氏小樹蛙和穿山甲。"}, {"id": 76, "lesson": "香港的動物", "type": "judge", "prompt": "判斷：在香港，生活在樹林裏的動物都是哺乳類動物。", "options": ["✓ 正確", "✗ 不正確"], "answer": 1, "correct_text": "✗ 不正確。", "explain": "範圍只說樹林裏有許多動物，例如哺乳類；並非全部都是哺乳類。", "source": "作業p-18；範圍冊2／印頁2–3", "visual": "", "speak": "✗ 不正確。"}, {"id": 77, "lesson": "香港的動物", "type": "judge", "prompt": "判斷：所有海洋動物都是無脊椎動物。", "options": ["✓ 正確", "✗ 不正確"], "answer": 1, "correct_text": "✗ 不正確。", "explain": "魚類是脊椎動物，也生活在海洋。", "source": "作業p-18；範圍冊2／印頁3", "visual": "", "speak": "✗ 不正確。"}, {"id": 78, "lesson": "香港的動物", "type": "mcq", "prompt": "子琪想抱抱小松鼠。這樣做對嗎？為甚麼？", "options": ["對，因為松鼠很可愛", "不對，我們要愛護野生動物，不要隨便捉抱", "對，野生動物都喜歡被抱", "不對，只因為松鼠會咬人"], "answer": 1, "correct_text": "不對，要愛護野生動物。", "explain": "範圍：愛護野生動物，保護生活環境。", "source": "作業p-14；範圍冊2／印頁3", "visual": "", "speak": "不對，要愛護野生動物。"}, {"id": 79, "lesson": "香港的動物", "type": "mcq", "prompt": "弟弟想抱起地上的蝙蝠查看。較恰當的做法是？", "options": ["立刻抱起仔細檢查", "不要隨便觸碰野生動物，應告訴成人／離開並保護動物", "把蝙蝠帶回家飼養", "用水潑牠趕牠走"], "answer": 1, "correct_text": "不要隨便觸碰野生動物，告訴成人。", "explain": "愛護 let LESSONS = [];

let filterLesson = "全部";
let roundQuestions = [];
let currentIndex = 0;
let roundState = {};
let latestResults = {};

const TYPE_LABELS = {
  mcq: "選擇題",
  judge: "判斷題",
  diagram: "填圖分類",
  order: "排序題",
  match: "配對題",
  cloze: "填充題",
  short: "簡答題"
};

function escapeHtml(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
function escapeAttr(s){ return escapeHtml(s); }

function getWrongCount(){
  return QUESTIONS.filter(function(q){
    return latestResults[q.id] && latestResults[q.id].correct === false;
  }).length;
}

function currentQuestion(){
  return roundQuestions[currentIndex] || null;
}

function currentFilterQuestions(){
  return filterLesson === "全部" ? QUESTIONS.slice() : QUESTIONS.filter(function(q){ return q.lesson === filterLesson; });
}

function isClozeFallback(q){
  if (q.type !== "cloze") return false;
  const prompt = String(q.prompt || "");
  const idx = prompt.indexOf("供詞：");
  if (idx < 0) return true;
  const after = prompt.slice(idx + 3);
  const period = after.indexOf("。");
  if (period < 0) return true;
  const bank = after.slice(0, period).split("／").map(function(s){ return s.trim(); }).filter(Boolean);
  return bank.length === 0;
}

function parseCloze(q){
  const prompt = String(q.prompt || "");
  const idx = prompt.indexOf("供詞：");
  let bank = [];
  let sentence = prompt;
  if (idx >= 0) {
    const after = prompt.slice(idx + 3);
    const period = after.indexOf("。");
    if (period >= 0) {
      bank = after.slice(0, period).split("／").map(function(s){ return s.trim(); }).filter(Boolean);
      sentence = after.slice(period + 1);
    }
  }
  const blankCount = (sentence.match(/____/g) || []).length;
  let answer = String(q.answer || "");
  answer = answer.replace(/（[^）]*）/g, "");
  const groups = answer.split("；").map(function(g){
    return g.split("、").map(function(w){ return w.trim(); }).filter(Boolean);
  }).filter(function(g){ return g.length; });
  const flat = [];
  const blankGroup = [];
  groups.forEach(function(g, gi){
    g.forEach(function(w){
      flat.push(w);
      blankGroup.push(gi);
    });
  });
  return { bank: bank, sentence: sentence, blankCount: blankCount, groups: groups, flat: flat, blankGroup: blankGroup };
}

function isSelfAssess(q){
  if (q.type === "short") return true;
  if (q.type === "cloze") {
    if (isClozeFallback(q)) return true;
    return parseCloze(q).blankCount === 0;
  }
  return false;
}

function checkCloze(q, words){
  const parsed = parseCloze(q);
  if (parsed.blankCount === 0) return false;
  const groupWords = parsed.groups.map(function(){ return []; });
  for (let i = 0; i < parsed.blankCount; i++) {
    const gi = parsed.blankGroup[i];
    if (gi === undefined) continue;
    groupWords[gi].push(words[i] || "");
  }
  for (let gi = 0; gi < parsed.groups.length; gi++) {
    const expected = parsed.groups[gi].slice().sort();
    const actual = groupWords[gi].slice().sort();
    if (expected.length !== actual.length) return false;
    for (let i = 0; i < expected.length; i++) {
      if (expected[i] !== actual[i]) return false;
    }
  }
  return true;
}

function clozeSlotCorrect(q, words, index){
  const parsed = parseCloze(q);
  const gi = parsed.blankGroup[index];
  if (gi === undefined) return false;
  const expected = parsed.groups[gi].slice().sort();
  const actual = [];
  for (let i = 0; i < parsed.blankCount; i++) {
    if (parsed.blankGroup[i] === gi) actual.push(words[i] || "");
  }
  actual.sort();
  if (expected.length !== actual.length) return false;
  for (let i = 0; i < expected.length; i++) {
    if (expected[i] !== actual[i]) return false;
  }
  return true;
}

function checkOrder(q, seq){
  const ans = q.answer_order || [];
  return seq.length === ans.length && seq.every(function(l, i){ return l === ans[i]; });
}

function parseMatch(q){
  const left = [];
  const right = [];
  (q.options || []).forEach(function(opt){
    const s = String(opt).trim();
    let m = s.match(/^(\d+)\.\s*(.*)$/);
    if (m) { left.push({ key: m[1], text: m[2] }); return; }
    m = s.match(/^([A-Z])\.\s*(.*)$/);
    if (m) { right.push({ key: m[1], text: m[2] }); return; }
  });
  return { left: left, right: right };
}

function checkMatch(q, pairs){
  const ans = q.answer_match || {};
  const leftKeys = Object.keys(ans);
  if (Object.keys(pairs).length !== leftKeys.length) return false;
  return leftKeys.every(function(k){ return pairs[k] === ans[k]; });
}

function createState(q){
  const st = {
    answered: false,
    submitted: false,
    locked: false,
    showAnswer: false,
    correct: null,
    choice: null,
    picked: null,
    selectedOption: null,
    orderSeq: [],
    matchPairs: {},
    selectedLeft: null,
    clozeWords: [],
    clozeActive: 0,
    shortRevealed: false,
    selfAssessed: false,
    selfCorrect: null,
    mockSaved: false
  };
  if (q.type === "cloze" && !isClozeFallback(q)) {
    const parsed = parseCloze(q);
    st.clozeWords = new Array(parsed.blankCount).fill("");
    st.clozeActive = 0;
  }
  return st;
}

function startRound(questions){
  roundQuestions = questions.slice();
  currentIndex = 0;
  roundState = {};
  roundQuestions.forEach(function(q){ roundState[q.id] = createState(q); });
  roundSubmitted = false;
  view = "question";
  reviewIndex = 0;
  render();
}

function resetRoundAnswers(){
  roundState = {};
  roundQuestions.forEach(function(q){ roundState[q.id] = createState(q); });
  currentIndex = 0;
  roundSubmitted = false;
  view = "question";
  reviewIndex = 0;
  render();
}

function reportAnswer(q, choice, correct, picked){
  elhReport({
    type: "answer",
    q: q.id,
    choice: choice,
    correct: !!correct,
    text: elhText(q.prompt),
    picked: picked,
    answer: elhText(q.correct_text)
  });
  latestResults[q.id] = {
    correct: !!correct,
    choice: choice,
    picked: picked,
    answered: true
  };
}

function openPanel(html){
  const layer = document.getElementById("panelLayer");
  const panel = document.getElementById("panel");
  panel.innerHTML = html;
  layer.hidden = false;
}

function closePanel(){
  document.getElementById("panelLayer").hidden = true;
}

function openLessonPanel(){
  const lessons = ["全部"].concat(LESSONS);
  const html = '<h2>課題篩選</h2><div class="panel-grid">' +
    lessons.map(function(l){
      return '<button type="button" class="panel-btn ' + (filterLesson === l ? "active" : "") + '" data-action="panel-lesson" data-lesson="' + escapeAttr(l) + '">' + escapeHtml(l) + '</button>';
    }).join("") +
    '</div><div class="panel-actions"><button type="button" class="panel-btn" data-action="panel-close">返回</button></div>';
  openPanel(html);
}

function openJumpPanel(){
  const html = '<h2>題號</h2><div class="panel-grid">' +
    roundQuestions.map(function(q, i){
      const st = roundState[q.id];
      let cls = "panel-btn";
      if (mode === "practice") {
        if (st.correct === true) cls += " correct";
        else if (st.answered) cls += " wrong";
      } else {
        if (st.answered) cls += " answered";
      }
      return '<button type="button" class="' + cls + '" data-action="panel-jump" data-index="' + i + '">' + (i + 1) + '</button>';
    }).join("") +
    '</div><div class="panel-actions"><button type="button" class="panel-btn" data-action="panel-close">返回</button></div>';
  openPanel(html);
}

function onSubmitClick(){
  if (mode === "practice") {
    openPanel('<h2>練習模式</h2><p>練習模式不需要交卷。按「下一題」到最後一題，會顯示本輪總結。</p><div class="panel-actions"><button type="button" class="panel-btn" data-action="panel-close">返回</button></div>');
    return;
  }
  if (roundSubmitted) {
    view = "results";
    render();
    return;
  }
  const nonShort = roundQuestions.filter(function(q){ return !isSelfAssess(q); });
  const answered = nonShort.filter(function(q){
    const st = roundState[q.id];
    if (q.type === "mcq" || q.type === "judge" || q.type === "diagram") return st.selectedOption != null;
    if (q.type === "order") return st.orderSeq.length === (q.options || []).length;
    if (q.type === "match") {
      const parsed = parseMatch(q);
      return parsed.left.every(function(it){ return st.matchPairs[it.key]; });
    }
    if (q.type === "cloze") {
      const parsed = parseCloze(q);
      return st.clozeWords && st.clozeWords.length === parsed.blankCount && st.clozeWords.every(function(w){ return w; });
    }
    return false;
  }).length;
  const unanswered = nonShort.length - answered;
  openPanel('<h2>確定交卷？</h2><p>已作答 ' + answered + ' 題，未作答 ' + unanswered + ' 題。</p><p class="fb-note">簡答題會在交卷後自評。</p><div class="panel-actions"><button type="button" class="panel-btn" data-action="panel-submit-cancel">返回</button><button type="button" class="panel-btn primary" data-action="panel-submit-confirm">確定交卷</button></div>');
}

function requestMode(newMode){
  if (newMode === mode) return;
  openPanel('<h2>切換模式</h2><p>切換模式會重設本輪作答，確定嗎？</p><div class="panel-actions"><button type="button" class="panel-btn" data-action="panel-close">返回</button><button type="button" class="panel-btn primary" data-action="panel-mode-confirm" data-mode="' + newMode + '">確定切換</button></div>');
}

function confirmMode(newMode){
  mode = newMode;
  resetRoundAnswers();
  closePanel();
}

function setFilter(lesson){
  filterLesson = lesson;
  startRound(currentFilterQuestions());
  closePanel();
}

function startWrongRound(){
  const wrong = QUESTIONS.filter(function(q){
    return latestResults[q.id] && latestResults[q.id].correct === false;
  });
  if (!wrong.length) return;
  filterLesson = "全部";
  startRound(wrong);
  closePanel();
}

function goPrev(){
  if (currentIndex > 0) {
    currentIndex--;
    view = "question";
    render();
  }
}

function goNext(){
  if (view === "review") return;
  if (currentIndex < roundQuestions.length - 1) {
    currentIndex++;
    view = "question";
    render();
  } else {
    if (mode === "practice") {
      view = "summary";
      render();
    } else {
      onSubmitClick();
    }
  }
}

function jumpTo(index){
  if (index >= 0 && index < roundQuestions.length) {
    currentIndex = index;
    view = "question";
    closePanel();
    render();
  }
}

function onOption(q, st, index){
  if (mode === "practice") {
    if (st.locked || st.answered) return;
    st.selectedOption = index;
    st.answered = true;
    st.locked = true;
    st.correct = index === q.answer;
    st.choice = index;
    st.picked = q.options[index];
    reportAnswer(q, index, st.correct, q.options[index]);
    render();
  } else {
    st.selectedOption = index;
    render();
  }
}

function onOrderItem(q, st, letter){
  if (mode === "practice" && st.locked) return;
  if (st.orderSeq.indexOf(letter) >= 0) return;
  if (st.orderSeq.length >= (q.options || []).length) return;
  st.orderSeq.push(letter);
  render();
}

function onOrderSlot(q, st, index){
  if (mode === "practice" && st.locked) return;
  if (index < st.orderSeq.length) {
    st.orderSeq = st.orderSeq.slice(0, index);
    render();
  }
}

function submitOrder(q, st){
  if (mode !== "practice") return;
  if (st.locked || st.answered) return;
  if (st.orderSeq.length !== (q.options || []).length) return;
  st.answered = true;
  st.locked = true;
  st.submitted = true;
  const correct = checkOrder(q, st.orderSeq);
  st.correct = correct;
  st.choice = st.orderSeq.join(",");
  st.picked = st.orderSeq.join(" → ");
  reportAnswer(q, st.choice, correct, st.picked);
  render();
}

function onMatchLeft(q, st, key){
  if (mode === "practice" && st.locked) return;
  if (st.matchPairs[key]) {
    delete st.matchPairs[key];
    st.selectedLeft = key;
  } else if (st.selectedLeft === key) {
    st.selectedLeft = null;
  } else {
    st.selectedLeft = key;
  }
  render();
}

function onMatchRight(q, st, key){
  if (mode === "practice" && st.locked) return;
  if (!st.selectedLeft) return;
  const leftKey = st.selectedLeft;
  Object.keys(st.matchPairs).forEach(function(k){
    if (st.matchPairs[k] === key) delete st.matchPairs[k];
  });
  st.matchPairs[leftKey] = key;
  st.selectedLeft = null;
  render();
}

function submitMatch(q, st){
  if (mode !== "practice") return;
  if (st.locked || st.answered) return;
  const parsed = parseMatch(q);
  if (!parsed.left.every(function(it){ return st.matchPairs[it.key]; })) return;
  st.answered = true;
  st.locked = true;
  st.submitted = true;
  const correct = checkMatch(q, st.matchPairs);
  const sorted = parsed.left.map(function(it){ return it.key; }).sort();
  st.correct = correct;
  st.choice = sorted.map(function(k){ return k + "-" + st.matchPairs[k]; }).join(";");
  st.picked = sorted.map(function(k){ return k + "-" + st.matchPairs[k]; }).join(" / ");
  reportAnswer(q, st.choice, correct, st.picked);
  render();
}

function onClozeWord(q, st, word){
  if (mode === "practice" && st.locked) return;
  let active = st.clozeActive;
  if (active < 0 || active >= st.clozeWords.length) {
    active = st.clozeWords.findIndex(function(w){ return !w; });
    if (active < 0) active = 0;
  }
  st.clozeWords[active] = word;
  let next = -1;
  for (let i = active + 1; i < st.clozeWords.length; i++) {
    if (!st.clozeWords[i]) { next = i; break; }
  }
  if (next < 0) {
    for (let i = 0; i < active; i++) {
      if (!st.clozeWords[i]) { next = i; break; }
    }
  }
  st.clozeActive = next;
  render();
}

function onClozeSlot(q, st, index){
  if (mode === "practice" && st.locked) return;
  if (st.clozeWords[index]) {
    st.clozeWords[index] = "";
    st.clozeActive = index;
  } else {
    st.clozeActive = index;
  }
  render();
}

function submitCloze(q, st){
  if (mode !== "practice") return;
  if (st.locked || st.answered) return;
  const parsed = parseCloze(q);
  if (!st.clozeWords || st.clozeWords.length !== parsed.blankCount || st.clozeWords.some(function(w){ return !w; })) return;
  st.answered = true;
  st.locked = true;
  st.submitted = true;
  const correct = checkCloze(q, st.clozeWords);
  st.correct = correct;
  st.choice = st.clozeWords.join("|");
  st.picked = st.clozeWords.join(" / ");
  reportAnswer(q, st.choice, correct, st.picked);
  render();
}

function showAnswer(q, st){
  if (mode !== "practice") return;
  if (isSelfAssess(q)) {
    st.shortRevealed = true;
    render();
    return;
  }
  if (st.answered) {
    st.showAnswer = true;
    render();
    return;
  }
  st.showAnswer = true;
  st.answered = true;
  st.locked = true;
  st.correct = false;
  st.choice = null;
  st.picked = null;
  reportAnswer(q, null, false, null);
  render();
}

function redoCurrent(q){
  roundState[q.id] = createState(q);
  render();
}

function selfAssess(q, correct){
  const st = roundState[q.id];
  st.shortRevealed = true;
  st.selfAssessed = true;
  st.selfCorrect = correct;
  st.answered = true;
  st.correct = correct;
  st.choice = correct ? "自評:對" : "自評:錯";
  st.picked = st.choice;
  reportAnswer(q, st.choice, correct, st.picked);
  render();
}

function handInMock(){
  if (roundSubmitted) return;
  roundSubmitted = true;
  roundQuestions.forEach(function(q){
    const st = roundState[q.id];
    if (isSelfAssess(q)) {
      st.answered = false;
      st.correct = null;
      st.choice = null;
      st.picked = null;
      st.locked = true;
      st.submitted = true;
      return;
    }
    let choice = null;
    let picked = null;
    let correct = false;
    if (q.type === "mcq" || q.type === "judge" || q.type === "diagram") {
      if (st.selectedOption != null) {
        choice = st.selectedOption;
        picked = q.options[st.selectedOption];
        correct = st.selectedOption === q.answer;
      }
    } else if (q.type === "order") {
      if (st.orderSeq && st.orderSeq.length === (q.options || []).length) {
        choice = st.orderSeq.join(",");
        picked = st.orderSeq.join(" → ");
        correct = checkOrder(q, st.orderSeq);
      }
    } else if (q.type === "match") {
      const parsed = parseMatch(q);
      if (parsed.left.every(function(it){ return st.matchPairs[it.key]; })) {
        const sorted = parsed.left.map(function(it){ return it.key; }).sort();
        choice = sorted.map(function(k){ return k + "-" + st.matchPairs[k]; }).join(";");
        picked = sorted.map(function(k){ return k + "-" + st.matchPairs[k]; }).join(" / ");
        correct = checkMatch(q, st.matchPairs);
      }
    } else if (q.type === "cloze") {
      const parsed = parseCloze(q);
      if (st.clozeWords && st.clozeWords.length === parsed.blankCount && st.clozeWords.every(function(w){ return w; })) {
        choice = st.clozeWords.join("|");
        picked = st.clozeWords.join(" / ");
        correct = checkCloze(q, st.clozeWords);
      }
    }
    st.answered = choice !== null;
    st.correct = correct;
    st.choice = choice;
    st.picked = picked;
    st.locked = true;
    st.submitted = true;
    reportAnswer(q, choice, correct, picked);
  });
  view = "results";
  render();
}

function getPickedText(q, st){
  if (q.type === "mcq" || q.type === "judge" || q.type === "diagram") {
    return st.selectedOption != null ? q.options[st.selectedOption] : "未作答";
  }
  if (q.type === "order") {
    return st.orderSeq && st.orderSeq.length ? st.orderSeq.join(" → ") : "未作答";
  }
  if (q.type === "match") {
    const parsed = parseMatch(q);
    const pairs = st.matchPairs || {};
    const keys = parsed.left.map(function(it){ return it.key; }).filter(function(k){ return pairs[k]; }).sort();
    return keys.length ? keys.map(function(k){ return k + "-" + pairs[k]; }).join(" / ") : "未作答";
  }
  if (q.type === "cloze") {
    return st.clozeWords && st.clozeWords.some(function(w){ return w; }) ? st.clozeWords.map(function(w){ return w || "—"; }).join(" / ") : "未作答";
  }
  return "未作答";
}

function renderOptions(q, st){
  const opts = q.options || [];
  const isJudge = q.type === "judge";
  let html = '<div class="options-grid ' + (isJudge ? "two" : "") + '">';
  opts.forEach(function(opt, i){
    let cls = "option-btn";
    if (view === "review") {
      if (i === q.answer) cls += " correct";
      if (st.selectedOption === i && i !== q.answer) cls += " wrong";
    } else if (mode === "practice") {
      if (st.answered || st.showAnswer) {
        if (i === q.answer) cls += " correct";
        if (st.selectedOption === i && i !== q.answer) cls += " wrong";
      }
    } else if (mode === "mock") {
      if (st.selectedOption === i) cls += " selected";
    }
    const disabled = (mode === "practice" && st.locked) || view === "review";
    const key = isJudge ? "" : '<span class="option-key">' + String.fromCharCode(65 + i) + '.</span>';
    html += '<button type="button" class="' + cls + '" data-action="option" data-index="' + i + '" ' + (disabled ? "disabled" : "") + '>' + key + '<span>' + opt + '</span></button>';
  });
  html += '</div>';
  return html;
}

function renderOrder(q, st){
  const opts = q.options || [];
  const letters = opts.map(function(_, i){ return String.fromCharCode(65 + i); });
  const seq = st.orderSeq || [];
  let html = '<div class="slots">';
  for (let i = 0; i < opts.length; i++) {
    const letter = seq[i];
    let cls = "slot";
    if (letter) cls += " filled";
    if (mode === "practice" && st.answered) {
      const ok = q.answer_order && q.answer_order[i] === letter;
      cls += ok ? " correct" : " wrong";
    }
    const text = letter ? letter + ". " + opts[letters.indexOf(letter)] : "";
    const disabled = !letter || (mode === "practice" && st.locked) || view === "review";
    html += '<button type="button" class="' + cls + '" data-action="order-slot" data-index="' + i + '" ' + (disabled ? "disabled" : "") + '><span class="slot-num">' + (i + 1) + '</span><span>' + escapeHtml(text) + '</span></button>';
  }
  html += '</div>';
  html += '<div class="order-items">';
  opts.forEach(function(opt, i){
    const letter = letters[i];
    const used = seq.indexOf(letter) >= 0;
    const disabled = used || (mode === "practice" && st.locked) || view === "review";
    html += '<button type="button" class="order-item ' + (used ? "used" : "") + '" data-action="order-item" data-letter="' + letter + '" ' + (disabled ? "disabled" : "") + '>' + letter + '. ' + escapeHtml(opt) + '</button>';
  });
  html += '</div>';
  return html;
}

function renderMatch(q, st){
  const parsed = parseMatch(q);
  const pairs = st.matchPairs || {};
  const usedRight = {};
  Object.keys(pairs).forEach(function(k){ usedRight[pairs[k]] = k; });
  let html = '<div class="match-wrap"><div class="match-col">';
  parsed.left.forEach(function(it){
    let cls = "match-btn";
    const partner = pairs[it.key];
    if (partner) cls += " paired pair-" + (parsed.right.findIndex(function(r){ return r.key === partner; }) % 6);
    if (st.selectedLeft === it.key) cls += " selected";
    const disabled = (mode === "practice" && st.locked) || view === "review";
    const badge = partner ? '<span class="match-badge">→' + partner + '</span>' : '';
    html += '<button type="button" class="' + cls + '" data-action="match-left" data-key="' + it.key + '" ' + (disabled ? "disabled" : "") + '>' + badge + it.key + '. ' + escapeHtml(it.text) + '</button>';
  });
  html += '</div><div class="match-col">';
  parsed.right.forEach(function(it){
    let cls = "match-btn";
    const partner = usedRight[it.key];
    if (partner) cls += " paired pair-" + (parsed.left.findIndex(function(l){ return l.key === partner; }) % 6);
    const disabled = (mode === "practice" && st.locked) || view === "review";
    const badge = partner ? '<span class="match-badge">←' + partner + '</span>' : '';
    html += '<button type="button" class="' + cls + '" data-action="match-right" data-key="' + it.key + '" ' + (disabled ? "disabled" : "") + '>' + badge + it.key + '. ' + escapeHtml(it.text) + '</button>';
  });
  html += '</div></div>';
  return html;
}

function renderCloze(q, st){
  const parsed = parseCloze(q);
  const words = st.clozeWords || [];
  let sentenceHtml = "";
  let lastIndex = 0;
  const parts = parsed.sentence.split(/(____)/);
  let blankIndex = 0;
  parts.forEach(function(part){
    if (part === "____") {
      const idx = blankIndex;
      blankIndex++;
      const word = words[idx] || "";
      let cls = "cloze-slot";
      if (word) cls += " filled";
      if (mode === "practice" && st.answered) {
        cls += clozeSlotCorrect(q, words, idx) ? " correct" : " wrong";
      }
      if (mode !== "practice" && st.clozeActive === idx) cls += " active";
      if (mode === "practice" && !st.locked && st.clozeActive === idx) cls += " active";
      const disabled = (mode === "practice" && st.locked) || view === "review";
      sentenceHtml += '<button type="button" class="' + cls + '" data-action="cloze-slot" data-index="' + idx + '" ' + (disabled ? "disabled" : "") + '>' + (word ? escapeHtml(word) : "＿＿") + '</button>';
    } else {
      sentenceHtml += escapeHtml(part);
    }
  });
  let html = '<div class="cloze-sentence">' + sentenceHtml + '</div>';
  html += '<div class="word-bank">';
  parsed.bank.forEach(function(w, i){
    const disabled = (mode === "practice" && st.locked) || view === "review";
    html += '<button type="button" class="word-btn" data-action="cloze-word" data-word="' + escapeAttr(w) + '" ' + (disabled ? "disabled" : "") + '>' + escapeHtml(w) + '</button>';
  });
  html += '</div>';
  return html;
}

function renderShort(q, st){
  if (mode === "mock" && !roundSubmitted) {
    return '<p class="fb-note">簡答題：交卷後看示範答案並自評。</p>';
  }
  let html = '<p class="qtype-hint">先想一想／口講答案，再按「看示範答案」。</p>';
  if (!st.shortRevealed) {
    html += '<button type="button" class="action-btn primary" data-action="short-reveal">看示範答案</button>';
    return html;
  }
  html += '<div class="fb-answer">示範答案：' + escapeHtml(q.correct_text) + '</div>';
  if (q.explain) html += '<div class="fb-explain">' + q.explain + '</div>';
  if (q.source) html += '<div class="fb-source">出處：' + escapeHtml(q.source) + '</div>';
  html += '<div class="action-row" style="margin-top:1.2vmin;">';
  html += '<button type="button" class="action-btn good" data-action="short-self" data-correct="1">我答到重點</button>';
  html += '<button type="button" class="action-btn bad" data-action="short-self" data-correct="0">未答到</button>';
  html += '</div>';
  return html;
}

function renderFeedback(q, st){
  if (view === "review" && isSelfAssess(q)) {
    if (!st.selfAssessed) return '';
    return '<div class="fb-title ' + (st.selfCorrect ? "fb-good" : "fb-bad") + '">' + (st.selfCorrect ? "✓ 我答到重點" : "✗ 未答到") + '</div>';
  }
  if (view === "review") {
    let html = '<div class="fb-title ' + (st.correct ? "fb-good" : "fb-bad") + '">' + (st.correct ? "✓ 答對了" : "✗ 答錯了") + '</div>';
    html += '<div class="fb-answer">你的作答：' + escapeHtml(getPickedText(q, st)) + '</div>';
    html += '<div class="fb-answer">正確答案：' + escapeHtml(q.correct_text) + '</div>';
    if (q.explain) html += '<div class="fb-explain">' + q.explain + '</div>';
    if (q.source) html += '<div class="fb-source">出處：' + escapeHtml(q.source) + '</div>';
    return html;
  }
  if (mode === "mock") {
    if (roundSubmitted) {
      let html = '<div class="fb-title ' + (st.correct ? "fb-good" : "fb-bad") + '">' + (st.correct ? "✓ 答對了" : "✗ 答錯了") + '</div>';
      html += '<div class="fb-answer">你的作答：' + escapeHtml(getPickedText(q, st)) + '</div>';
      html += '<div class="fb-answer">正確答案：' + escapeHtml(q.correct_text) + '</div>';
      if (q.explain) html += '<div class="fb-explain">' + q.explain + '</div>';
      if (q.source) html += '<div class="fb-source">出處：' + escapeHtml(q.source) + '</div>';
      return html;
    }
    return '';
  }
  if (isSelfAssess(q)) {
    if (st.selfAssessed) {
      let html = '<div class="fb-title ' + (st.selfCorrect ? "fb-good" : "fb-bad") + '">' + (st.selfCorrect ? "✓ 我答到重點" : "✗ 未答到") + '</div>';
      return html;
    }
    return '';
  }
  if (st.showAnswer && !st.answered) {
    let html = '<div class="fb-title fb-bad">已顯示答案</div>';
    html += '<div class="fb-answer">正確答案：' + escapeHtml(q.correct_text) + '</div>';
    if (q.explain) html += '<div class="fb-explain">' + q.explain + '</div>';
    if (q.source) html += '<div class="fb-source">出處：' + escapeHtml(q.source) + '</div>';
    return html;
  }
  if (st.answered) {

    if (q.explain) html += '<div class="fb-explain">' + q.explain + '</div>';
    if (q.source) html += '<div class="fb-source">出處：' + escapeHtml(q.source) + '</div>';
    return html;
  }
  return '';
}

function renderLeft(q, st){
  let html = '';
  html += '<div class="controls">';
  html += '<button type="button" class="ctrl mode-btn ' + (mode === "practice" ? "active" : "") + '" data-action="mode" data-mode="practice">練習模式</button>';
  html += '<button type="button" class="ctrl mode-btn ' + (mode === "mock" ? "active" : "") + '" data-action="mode" data-mode="mock">模擬測驗模式</button>';
  html += '<button type="button" class="ctrl" data-action="lesson">課題：' + escapeHtml(filterLesson) + '</button>';
  html += '<button type="button" class="ctrl" data-action="jump">題號</button>';
  const wrongCount = getWrongCount();
  html += '<button type="button" class="ctrl" data-action="wrong" ' + (wrongCount ? "" : "disabled") + '>' + (wrongCount ? "錯題重做" : "暫無錯題") + '</button>';
  if (mode === "mock") {
    html += '<button type="button" class="ctrl" data-action="submit">' + (roundSubmitted ? "查看成績" : "交卷") + '</button>';
  }

  html += '<div class="progress-wrap"><div class="progress-text">第 ' + (currentIndex + 1) + ' / ' + roundQuestions.length + ' 題</div><div class="progress-bar"><div class="progress-fill" style="width:' + ((currentIndex + 1) / roundQuestions.length * 100) + '%"></div></div></div>';
  html += '<div class="chips"><span class="chip lesson-chip">' + escapeHtml(q.lesson) + '</span><span class="chip type-chip">' + (TYPE_LABELS[q.type] || q.type) + '</span><span class="chip q-chip">題 ' + q.id + '</span></div>';
  html += '<div class="prompt">' + (q.prompt || "") + '</div>';
  if (q.visual) html += '<div class="visual">' + q.visual + '</div>';
  html += '<div class="nav-row"><button type="button" class="nav-btn" data-action="prev" ' + (currentIndex === 0 ? "disabled" : "") + '>◀ 上一題</button><button type="button" class="nav-btn" data-action="next">下一題 ▶</button></div>';
  return html;
}

function renderRight(q, st){
  let html = '';
  html += '<div class="action-row">';
  if (isSelfAssess(q)) {
    if (mode === "practice") {
      if (!st.shortRevealed) {
        html += '<button type="button" class="action-btn primary" data-action="short-reveal">看示範答案</button>';
      }
    }
  } else {
    if (mode === "practice") {
      if (q.type === "order" || q.type === "match" || q.type === "cloze") {
        const ready = q.type === "order" ? st.orderSeq.length === (q.options || []).length :
          q.type === "match" ? parseMatch(q).left.every(function(it){ return st.matchPairs[it.key]; }) :
          (st.clozeWords && st.clozeWords.length === parseCloze(q).blankCount && st.clozeWords.every(function(w){ return w; }));
        html += '<button type="button" class="action-btn primary" data-action="submit-answer" ' + (ready && !st.locked ? "" : "disabled") + '>提交</button>';
        html += '<button type="button" class="action-btn" data-action="clear">清除</button>';
      }
      if (!st.answered) {
        html += '<button type="button" class="action-btn" data-action="show-answer">顯示答案</button>';
      }
      if (st.answered) {
        html += '<button type="button" class="action-btn" data-action="redo">重做此題</button>';
      }
    } else {
      if (q.type === "order" || q.type === "match" || q.type === "cloze") {
        html += '<button type="button" class="action-btn primary" data-action="mock-save">確定作答</button>';
        html += '<button type="button" class="action-btn" data-action="clear">清除</button>';
      }
    }
  }
  html += '</div>';
  html += '<div class="work">';
  if (isSelfAssess(q)) {
    html += renderShort(q, st);
  } else if (q.type === "mcq" || q.type === "judge" || q.type === "diagram") {
    html += renderOptions(q, st);
  } else if (q.type === "order") {
    html += renderOrder(q, st);
  } else if (q.type === "match") {
    html += renderMatch(q, st);
  } else if (q.type === "cloze") {
    html += renderCloze(q, st);
  }
  html += '</div>';
  html += '<div class="feedback">' + renderFeedback(q, st) + '</div>';
  return html;
}

function renderResults(){
  const nonShort = roundQuestions.filter(function(q){ return !isSelfAssess(q); });
  const shortQs = roundQuestions.filter(function(q){ return isSelfAssess(q); });
  let correct = 0;
  nonShort.forEach(function(q){
    const st = roundState[q.id];
    if (st.correct) correct++;
  });
  const total = nonShort.length;
  const percent = total ? Math.round(correct / total * 100) : 0;
  const shortDone = shortQs.filter(function(q){ return roundState[q.id].selfAssessed; }).length;
  const shortCorrect = shortQs.filter(function(q){ return roundState[q.id].selfCorrect === true; }).length;
  let html = '<div class="summary-title">成績</div>';
  html += '<div class="score-big">答對 ' + correct + ' / ' + total + '</div>';
  html += '<div class="score-percent">' + percent + '%</div>';
  if (shortQs.length) {
    html += '<p class="fb-note">簡答題自評：已評 ' + shortDone + ' / ' + shortQs.length + '，答到重點 ' + shortCorrect + ' 題。</p>';
  }
  const lessonMap = {};
  nonShort.forEach(function(q){
    if (!lessonMap[q.lesson]) lessonMap[q.lesson] = { total: 0, correct: 0 };
    lessonMap[q.lesson].total++;
    if (roundState[q.id].correct) lessonMap[q.lesson].correct++;
  });
  html += '<div class="lesson-stats">';
  Object.keys(lessonMap).forEach(function(l){
    const d = lessonMap[l];
    const pct = d.total ? Math.round(d.correct / d.total * 100) : 0;
    html += '<div class="lesson-stat"><div class="ls-name">' + escapeHtml(l) + '</div><div class="ls-bar"><div class="ls-fill" style="width:' + pct + '%"></div></div><div class="ls-text">' + d.correct + ' / ' + d.total + '</div></div>';
  });
  html += '</div>';
  html += '<!--SPLIT-->';
  html += '<div class="summary-actions" style="margin-top:0;margin-bottom:1.6vmin">';
  html += '<button type="button" class="action-btn primary" data-action="wrong">錯題重做</button>';
  html += '<button type="button" class="action-btn" data-action="restart">重新開始</button>';
  html += '</div>';
  html += '<p class="fb-note">按題號看你的作答、正確答案和解說（綠＝答對，紅＝答錯，灰＝未作答，藍＝簡答題待自評）。</p>';
  html += '<div class="results-grid">';
  roundQuestions.forEach(function(q, i){
    const st = roundState[q.id];
    let cls = "result-q";
    if (isSelfAssess(q)) {
      if (!st.selfAssessed) cls += " pending";
      else cls += st.selfCorrect ? " correct" : " wrong";
    } else if (st.correct) cls += " correct";
    else if (st.answered) cls += " wrong";
    else cls += " unanswered";
    html += '<button type="button" class="' + cls + '" data-action="review" data-index="' + i + '">' + (i + 1) + '</button>';
  });
  html += '</div>';
  return html;
}

function renderSummary(){
  const nonShort = roundQuestions.filter(function(q){ return !isSelfAssess(q); });
  let correct = 0;
  let answered = 0;
  nonShort.forEach(function(q){
    const st = roundState[q.id];
    if (st.answered) answered++;
    if (st.correct) correct++;
  });
  let html = '<div class="summary-title">本輪總結</div>';
  html += '<div class="summary-stats">';
  html += '<div class="stat"><span class="stat-num">' + answered + '</span><span class="stat-label">已作答</span></div>';
  html += '<div class="stat"><span class="stat-num">' + correct + '</span><span class="stat-label">答對</span></div>';
  html += '<div class="stat"><span class="stat-num">' + roundQuestions.length + '</span><span class="stat-label">總題數</span></div>';
  html += '</div>';
  const lessonMap = {};
  nonShort.forEach(function(q){
    if (!lessonMap[q.lesson]) lessonMap[q.lesson] = { total: 0, correct: 0 };
    lessonMap[q.lesson].total++;
    if (roundState[q.id].correct) lessonMap[q.lesson].correct++;
  });
  html += '<div class="lesson-stats">';
  Object.keys(lessonMap).forEach(function(l){
    const d = lessonMap[l];
    const pct = d.total ? Math.round(d.correct / d.total * 100) : 0;
    html += '<div class="lesson-stat"><div class="ls-name">' + escapeHtml(l) + '</div><div class="ls-bar"><div class="ls-fill" style="width:' + pct + '%"></div></div><div class="ls-text">' + d.correct + ' / ' + d.total + '</div></div>';
  });
  html += '</div>';
  html += '<!--SPLIT-->';
  html += '<div class="summary-actions" style="margin-top:0">';
  html += '<button type="button" class="action-btn primary" data-action="wrong">錯題重做</button>';
  html += '<button type="button" class="action-btn" data-action="restart">重新開始</button>';
  html += '</div>';
  return html;
}

function renderReview(){
  const q = roundQuestions[reviewIndex];
  const st = roundState[q.id];
  let html = '';
  html += '<div class="controls">';
  html += '<button type="button" class="ctrl" data-action="review-back">返回成績</button>';
  html += '</div>';
  html += '<div class="progress-wrap"><div class="progress-text">檢視：第 ' + (reviewIndex + 1) + ' / ' + roundQuestions.length + ' 題</div></div>';
  html += '<div class="chips"><span class="chip lesson-chip">' + escapeHtml(q.lesson) + '</span><span class="chip type-chip">' + (TYPE_LABELS[q.type] || q.type) + '</span><span class="chip q-chip">題 ' + q.id + '</span></div>';
  html += '<div class="prompt">' + (q.prompt || "") + '</div>';
  if (q.visual) html += '<div class="visual">' + q.visual + '</div>';
  html += '<div class="nav-row"><button type="button" class="nav-btn" data-action="review-prev" ' + (reviewIndex === 0 ? "disabled" : "") + '>◀ 上一題</button><button type="button" class="nav-btn" data-action="review-next" ' + (reviewIndex === roundQuestions.length - 1 ? "disabled" : "") + '>下一題 ▶</button></div>';
  document.getElementById("left").innerHTML = html;
  let rightHtml = '<div class="work">';
  if (isSelfAssess(q)) {
    rightHtml += renderShort(q, st);
  } else if (q.type === "mcq" || q.type === "judge" || q.type === "diagram") {
    rightHtml += renderOptions(q, st);
  } else if (q.type === "order") {
    rightHtml += renderOrder(q, st);
  } else if (q.type === "match") {
    rightHtml += renderMatch(q, st);
  } else if (q.type === "cloze") {
    rightHtml += renderCloze(q, st);
  }
  rightHtml += '</div>';
  rightHtml += '<div class="feedback">' + renderFeedback(q, st) + '</div>';
  document.getElementById("right").innerHTML = rightHtml;
}


function globalQuestionIndex(){
  const q = (view === "review" ? roundQuestions[reviewIndex] : currentQuestion());
  if (!q) return currentIndex;
  for (let i = 0; i < QUESTIONS.length; i++) if (QUESTIONS[i].id === q.id) return i;
  return currentIndex;
}
function compactOneState(st){
  if (!st) return null;
  const o = {};
  if (st.answered) o.a = 1;
  if (st.submitted) o.s = 1;
  if (st.locked) o.l = 1;
  if (st.showAnswer) o.sh = 1;
  if (st.correct != null) o.c = st.correct ? 1 : 0;
  if (st.choice != null) o.ch = st.choice;
  if (st.selectedOption != null) o.so = st.selectedOption;
  if (st.orderSeq && st.orderSeq.length) o.os = st.orderSeq;
  if (st.matchPairs && Object.keys(st.matchPairs).length) o.mp = st.matchPairs;
  if (st.selectedLeft != null) o.sl = st.selectedLeft;
  if (st.clozeWords && st.clozeWords.some(function(w){ return w; })) o.cw = st.clozeWords;
  if (st.clozeActive) o.ca = st.clozeActive;
  if (st.shortRevealed) o.sr = 1;
  if (st.selfAssessed) o.sa = 1;
  if (st.selfCorrect != null) o.sc = st.selfCorrect ? 1 : 0;
  if (st.mockSaved) o.ms = 1;
  return Object.keys(o).length ? o : null;
}
function compactStates(map){
  const out = {};
  Object.keys(map || {}).forEach(function(id){
    const c = compactOneState(map[id]);
    if (c) out[id] = c;
  });
  return out;
}
function compactResults(map){
  const out = {};
  Object.keys(map || {}).forEach(function(id){
    const r = map[id];
    if (!r) return;
    out[id] = { c: r.correct ? 1 : 0, a: r.answered ? 1 : 0 };
    if (r.choice != null) out[id].ch = r.choice;
  });
  return out;
}
function expandOneState(q, c){
  const st = createState(q);
  if (!c) return st;
  if (c.a) st.answered = true;
  if (c.s) st.submitted = true;
  if (c.l) st.locked = true;
  if (c.sh) st.showAnswer = true;
  if (c.c != null) st.correct = !!c.c;
  if (c.ch != null) { st.choice = c.ch; st.picked = c.ch; }
  if (c.so != null) st.selectedOption = c.so;
  if (Array.isArray(c.os)) st.orderSeq = c.os.slice();
  if (c.mp && typeof c.mp === "object") st.matchPairs = c.mp;
  if (c.sl != null) st.selectedLeft = c.sl;
  if (Array.isArray(c.cw)) st.clozeWords = c.cw.slice();
  if (typeof c.ca === "number") st.clozeActive = c.ca;
  if (c.sr) st.shortRevealed = true;
  if (c.sa) st.selfAssessed = true;
  if (c.sc != null) st.selfCorrect = !!c.sc;
  if (c.ms) st.mockSaved = true;
  return st;
}
function elhState(){
  const data = {
    i: globalQuestionIndex(),
    m: mode,
    f: filterLesson,
    ci: currentIndex,
    v: view,
    rv: reviewIndex,
    rs: roundSubmitted ? 1 : 0,
    rq: roundQuestions.map(function(q){ return q.id; }),
    st: compactStates(roundState),
    lr: compactResults(latestResults)
  };
  let raw = JSON.stringify(data);
  if (raw.length > 8000) {
    Object.keys(data.lr).forEach(function(id){ delete data.lr[id].ch; });
    raw = JSON.stringify(data);
  }
  if (raw.length > 8000) {
    const keep = {};
    const cur = currentQuestion();
    Object.keys(data.st).forEach(function(id){
      const c = data.st[id];
      if (cur && String(cur.id) === String(id)) keep[id] = c;
      else if (c && (c.so != null || c.os || c.mp || c.cw || c.a || c.s || c.sa)) keep[id] = c;
    });
    data.st = keep;
    raw = JSON.stringify(data);
  }
  if (raw.length > 8000) return;
  elhReport({ type: "state", data: data });
}

function render(){
  if (view === "results") {
    const rp = renderResults().split('<!--SPLIT-->');
    document.getElementById("left").innerHTML = rp[0];
    document.getElementById("right").innerHTML = '<div class="work">' + (rp[1] || '') + '</div>';
  } else if (view === "summary") {
    const sp = renderSummary().split('<!--SPLIT-->');
    document.getElementById("left").innerHTML = sp[0];
    document.getElementById("right").innerHTML = '<div class="work">' + (sp[1] || '') + '</div>';
  } else if (view === "review") {
    renderReview();
  } else {
    const q = currentQuestion();
    if (!q) {
      document.getElementById("left").innerHTML = '<p>沒有題目。</p>';
      document.getElementById("right").innerHTML = "";
    } else {
      const st = roundState[q.id];
      document.getElementById("left").innerHTML = renderLeft(q, st);
      document.getElementById("right").innerHTML = renderRight(q, st);
    }
  }
  elhState();
}

document.addEventListener("click", function(e){
  const target = e.target.closest("[data-action]");
  if (!target) return;
  const action = target.getAttribute("data-action");
  const q = view === "review" ? roundQuestions[reviewIndex] : currentQuestion();
  const st = q ? roundState[q.id] : null;

  if (action === "mode") {
    requestMode(target.getAttribute("data-mode"));
    return;
  }
  if (action === "lesson") {
    openLessonPanel();
    return;
  }
  if (action === "jump") {
    openJumpPanel();
    return;
  }
  if (action === "wrong") {
    startWrongRound();
    return;
  }
  if (action === "submit") {
    onSubmitClick();
    return;
  }
  if (action === "prev") {
    goPrev();
    return;
  }
  if (action === "next") {
    goNext();
    return;
  }
  if (action === "panel-close") {
    closePanel();
    return;
  }
  if (action === "panel-lesson") {
    setFilter(target.getAttribute("data-lesson"));
    return;
  }
  if (action === "panel-jump") {
    jumpTo(parseInt(target.getAttribute("data-index"), 10));
    return;
  }
  if (action === "panel-mode-confirm") {
    confirmMode(target.getAttribute("data-mode"));
    return;
  }
  if (action === "panel-submit-cancel") {
    closePanel();
    return;
  }
  if (action === "panel-submit-confirm") {
    closePanel();
    handInMock();
    return;
  }
  if (action === "review") {
    reviewIndex = parseInt(target.getAttribute("data-index"), 10);
    view = "review";
    render();
    return;
  }
  if (action === "review-back") {
    view = "results";
    render();
    return;
  }
  if (action === "review-prev") {
    if (reviewIndex > 0) { reviewIndex--; render(); }
    return;
  }
  if (action === "review-next") {
    if (reviewIndex < roundQuestions.length - 1) { reviewIndex++; render(); }
    return;
  }
  if (action === "restart") {
    startRound(currentFilterQuestions());
    return;
  }
  if (!q || !st) return;
  if (view === "review" && action !== "short-reveal" && action !== "short-self") return;

  if (action === "option") {
    onOption(q, st, parseInt(target.getAttribute("data-index"), 10));
    return;
  }
  if (action === "order-item") {
    onOrderItem(q, st, target.getAttribute("data-letter"));
    return;
  }
  if (action === "order-slot") {
    onOrderSlot(q, st, parseInt(target.getAttribute("data-index"), 10));
    return;
  }
  if (action === "match-left") {
    onMatchLeft(q, st, target.getAttribute("data-key"));
    return;
  }
  if (action === "match-right") {
    onMatchRight(q, st, target.getAttribute("data-key"));
    return;
  }
  if (action === "cloze-word") {
    onClozeWord(q, st, target.getAttribute("data-word"));
    return;
  }
  if (action === "cloze-slot") {
    onClozeSlot(q, st, parseInt(target.getAttribute("data-index"), 10));
    return;
  }
  if (action === "submit-answer") {
    if (q.type === "order") submitOrder(q, st);
    else if (q.type === "match") submitMatch(q, st);
    else if (q.type === "cloze") submitCloze(q, st);
    return;
  }
  if (action === "mock-save") {
    st.mockSaved = true;
    render();
    return;
  }
  if (action === "clear") {
    if (mode === "practice" && st.locked) return;
    if (q.type === "order") st.orderSeq = [];
    else if (q.type === "match") { st.matchPairs = {}; st.selectedLeft = null; }
    else if (q.type === "cloze") {
      const parsed = parseCloze(q);
      st.clozeWords = new Array(parsed.blankCount).fill("");
      st.clozeActive = 0;
    }
    render();
    return;
  }
  if (action === "show-answer") {
    showAnswer(q, st);
    return;
  }
  if (action === "redo") {
    redoCurrent(q);
    return;
  }
  if (action === "short-reveal") {
    st.shortRevealed = true;
    render();
    return;
  }
  if (action === "short-self") {
    selfAssess(q, target.getAttribute("data-correct") === "1");
    return;
  }
});

LESSONS = [];
QUESTIONS.forEach(function(q){
  if (LESSONS.indexOf(q.lesson) < 0) LESSONS.push(q.lesson);
});

elhReport({ type: "init", total: QUESTIONS.length });

startRound(currentFilterQuestions());

window.addEventListener("message", function(e){
  var m = e.data;
  if (!m || m.elh !== 1 || m.type !== "restore" || e.source !== window.parent) return;
  var d = m.data || {};
  if (typeof d.i !== "number" || d.i < 0 || d.i >= QUESTIONS.length) return;
  mode = (d.m === "mock") ? "mock" : "practice";
  filterLesson = (typeof d.f === "string" && d.f) ? d.f : "全部";
  var idToQ = {};
  QUESTIONS.forEach(function(q){ idToQ[q.id] = q; });
  var ids = Array.isArray(d.rq) ? d.rq : [];
  var restored = [];
  ids.forEach(function(id){ if (idToQ[id]) restored.push(idToQ[id]); });
  if (!restored.length) restored = currentFilterQuestions();
  roundQuestions = restored;
  currentIndex = (typeof d.ci === "number" && d.ci >= 0 && d.ci < roundQuestions.length) ? d.ci : 0;
  if (currentIndex >= roundQuestions.length) currentIndex = Math.max(0, roundQuestions.length - 1);
  var views = { question:1, results:1, summary:1, review:1 };
  view = views[d.v] ? d.v : "question";
  reviewIndex = (typeof d.rv === "number" && d.rv >= 0 && d.rv < roundQuestions.length) ? d.rv : 0;
  roundSubmitted = !!d.rs;
  roundState = {};
  roundQuestions.forEach(function(q){
    roundState[q.id] = expandOneState(q, (d.st || {})[q.id] || (d.st || {})[String(q.id)]);
  });
  latestResults = {};
  Object.keys(d.lr || {}).forEach(function(id){
    var r = d.lr[id];
    if (!r) return;
    latestResults[id] = {
      correct: !!r.c,
      answered: r.a != null ? !!r.a : true,
      choice: r.ch != null ? r.ch : null,
      picked: r.ch != null ? r.ch : null
    };
  });
  render();
});

</script>
