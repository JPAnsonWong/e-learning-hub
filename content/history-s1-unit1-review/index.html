 "明", "清"], "explain": "三皇五帝夏商周，春秋戰國亂悠悠，秦漢三國晉統一，南朝北朝是對頭，隋唐五代又十國，宋元明清帝王休。"}, "match": {"q": "四大古都：配對現今地名與古代地名", "pairs": [["洛陽", "成周"], ["北京", "大都／燕山／順天"], ["南京", "建康"], ["西安", "鎬京／長安"]]}};

 }draw(false);}
function match(s){var t=s.t,L1=shuffle(t.pairs.map(function(p){return p[0];})),R1=shuffle(t.pairs.map(function(p){return p[1];})),pick=null,made={};
 function draw(checked){L.innerHTML='<div class="unit">四大古都配對</div>'+prog()+'<div class="q">'+esc(t.q)+'</div><div class="tip">先點一個現今地名，再點右邊對應的古代地名。點已配好的地名可取消。</div><div class="chips">'+L1.map(function(x){var c=made[x]?(checked?(made[x]==ans(x)?" ok":" no"):" used"):(pick==x?" sel":"");return '<button class="chip'+c+'" data-l="'+esc(x)+'"'+(checked?' disabled':'')+'>'+esc(x)+(made[x]?' ↔ '+esc(made[x]):'')+'</button>';}).join("")+'</div><div class="fb" id="fb"></div>';
  var usedR=Object.keys(made).map(function(k){return made[k];});
  Rt.innerHTML='<div class="tip">古代地名</div><div class="opts">'+R1.map(function(x){return '<button class="opt'+(usedR.indexOf(x)>=0?' sel':'')+'" data-r="'+esc(x)+'"'+(checked||usedR.indexOf(x)>=0?' disabled':'')+'>'+esc(x)+'</button>';}).join("")+'</div><div class="row"><button class="btn alt" id="rs">重來</button><button class="btn" id="ck"'+(Object.keys(made).length==4&&!checked?'':' disabled')+'>檢查</button></div>'+nav(score[cur]!==undefined);
  L.querySelectorAll(".chip").forEach(function(c){c.onclick=function(){var x=c.dataset.l;if(made[x]){delete made[x];pick=null;}else pick=x;draw(false);};});
  Rt.querySelectorAll(".opt").forEach(function(c){c.onclick=function(){if(!pick)return;made[pick]=c.dataset.r;pick=null;draw(false);};});
  document.getElementById("rs").onclick=function(){made={};pick=null;draw(false);};
  document.getElementById("ck").onclick=function(){var ok=L1.every(function(x){return made[x]==ans(x);});var str=L1.map(function(x){return x+"-"+made[x];}).join("|");
   elhReport({type:"answer",q:"R"+(cur+1),choice:str,correct:ok,text:elhText(t.q),picked:str,answer:t.pairs.map(function(p){return p[0]+"-"+p[1];}).join("|")});
   if(score[cur]===undefined)score[cur]=ok;draw(true);var fb=document.getElementById("fb");fb.className="fb show "+(ok?"good":"bad");fb.innerHTML=(ok?"✔ 全部配對正確！":"有配對不對，可按「重來」再試。")+"<br>"+t.pairs.map(function(p){return p[0]+" ↔ "+p[1];}).join("；");};
 }function ans(x){for(var i=0;i<t.pairs.length;i++)if(t.pairs[i][0]==x)return t.pairs[i][1];}draw(false);}
function summary(){var n=0,wrong=[];for(var i=0;i<TOTAL;i++){if(score[i])n++;else wrong.push(i);}
 L.innerHTML='<div class="unit">本次簡要</div><div class="big">'+n+' / '+TOTAL+'</div><div class="tip">第一次就答對的題數。</div>'+(wrong.length?'<div class="tip">可再溫習：</div><div class="chips">'+wrong.map(function(i){return '<button class="chip" onclick="go('+i+')">第 '+(i+1)+' 題</button>';}).join("")+'</div>':'<div class="tip">全部第一次就答對，做得好！</div>');
 Rt.innerHTML='<div class="tip">重點回顧：歷史三大要素（時間、人物、地點）；新石器時代磨製石器、製陶、農耕定居；禪讓→世襲；夏→商→周；封建與周室東遷；尊王攘夷、戰國七雄、商鞅變法、百家爭鳴。</div><div class="row"><button class="btn alt" onclick="go(TOTAL-1)">返回</button><button class="btn" onclick="location.reload()">重新開始</button></div>';}
intro();
</script></body></html>
