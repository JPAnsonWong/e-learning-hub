<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>秒：認識秒、經過多少秒</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;background:#f5f7fc;color:#17243d;touch-action:manipulation}.stage{height:100%;display:grid;grid-template-columns:minmax(0,58fr) minmax(0,42fr);min-height:0}.pane{min-width:0;min-height:0;overflow:auto;padding:2vmin 2.4vmin}.pane+.pane{border-left:2px solid #d0d7e7}h1{font-size:clamp(1.5rem,4.2vmin,7rem);line-height:1.2;margin:1vmin 0 1.5vmin}.meta,.feedback,.learn{font-size:clamp(1rem,2.6vmin,5rem);line-height:1.4}.learn{background:#fff;border-radius:1vmin;padding:1vmin 1.4vmin;border-left:8px solid #2d6cdf}.learn li{margin:.5em 0}button,input{font:inherit}button{min-height:max(3rem,7vmin);min-width:max(3rem,7vmin);font-size:clamp(1rem,3.2vmin,6rem);padding:.5vmin 1.2vmin;border:2px solid #536788;border-radius:1vmin;background:#fff;color:inherit;white-space:normal;overflow-wrap:anywhere;touch-action:manipulation}button:focus-visible{outline:4px solid #ad5400;outline-offset:3px}button[aria-pressed="true"]{border:4px solid #1b579f;background:#dceaff}button:disabled{opacity:.5}.options{display:grid;gap:1vmin;margin-bottom:1vmin}.actions{display:flex;flex-wrap:wrap;gap:1vmin;margin:1vmin 0}.feedback{margin-top:1vmin;overflow-wrap:anywhere;min-height:3em}.progress{height:1.3vmin;background:#dce3f2;border-radius:9px;overflow:hidden}.progress b{display:block;height:100%;background:#2d6cdf}.visual{margin:1vmin 0;min-height:15vmin;display:grid;place-items:center;background:#eef3ff;border-radius:1.2vmin;padding:1vmin;text-align:center}.clock-face{width:min(22vmin,240px);aspect-ratio:1;border:clamp(4px,.7vmin,12px) solid #1b579f;border-radius:50%;position:relative;background:#fff}.n{position:absolute;font-weight:700;font-size:clamp(1rem,2.5vmin,3rem)}.n12{top:2%;left:46%}.n3{right:3%;top:44%}.n6{bottom:2%;left:47%}.n9{left:3%;top:44%}.hand{position:absolute;left:50%;bottom:50%;transform-origin:bottom;border-radius:8px}.h12{height:38%;width:3%;background:#1b579f;transform:rotate(0deg)}.h4{height:30%;width:3%;background:#d85b3f;transform:rotate(120deg)}.pin{position:absolute;width:8%;aspect-ratio:1;background:#17243d;border-radius:50%;left:46%;top:46%}.division .chips{font-size:clamp(1.2rem,4vmin,5rem);letter-spacing:.4vmin;color:#2d6cdf}.balance{position:relative}.beam{width:65%;height:1vmin;background:#536788;transform:rotate(0deg)}.pan{padding:1vmin 2vmin;border:3px solid #536788;background:#fff;position:absolute;top:42%;border-radius:1vmin;font-size:clamp(1rem,2.5vmin,3rem)}.pan.left{left:12%}.pan.right{right:12%}.shapes svg{width:min(100%,560px);height:auto}.shape{stroke:#17243d;stroke-width:4}.blue{fill:#cde0ff}.orange{fill:#ffd9a8}.timeline{gap:1vmin}.time-row{display:flex;align-items:center;gap:2vmin;font-size:clamp(1.2rem,3vmin,4rem);font-weight:700}.time-row span{background:#fff;border:2px solid #536788;border-radius:1vmin;padding:.8vmin 1.4vmin}.feedback.ok{color:#116b3b}.feedback.bad{color:#a83a20}@media(max-width:899px),(orientation:portrait){.stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,45fr) minmax(0,55fr)}.pane+.pane{border-left:0;border-top:2px solid #d0d7e7}}[hidden]{display:none!important}</style></head><body><main class="stage"><section class="pane" aria-label="學習重點"><p class="meta">單元 4｜3年級數學B冊預習</p><h1>秒：認識秒、經過多少秒</h1><div class="progress" aria-label="預習進度"><b id="bar" style="width:0%"></b></div><h2>先學一學</h2><ul class="learn"><li>秒是量度短時間的單位。秒針走 1 小格表示 1 秒。</li><li>秒針走 1 圈是 60 秒，也就是 1 分鐘；1 分鐘 = 60 秒。</li><li>比較經過時間時，可用「結束時間 − 開始時間」，或先數到整分再數餘下的秒。</li></ul><div class="visual clock"><div class="clock-face"><span class="n n12">12</span><span class="n n3">3</span><span class="n n6">6</span><span class="n n9">9</span><i class="hand h12"></i><i class="hand h4"></i><b class="pin"></b></div><p>秒針走一圈：60 秒 = 1 分鐘</p></div><p class="meta">完成右側練習後，可按「上一題／下一題」重溫重點。題目依課本、工作紙及補充練習的章節概念整理。</p></section><section class="pane" aria-label="互動練習"><p class="meta" id="meta"></p><h2 id="prompt"></h2><div class="options" id="choices"></div><div class="actions"><button type="button" id="check">確定／看答案</button><button type="button" id="prev">上一題</button><button type="button" id="next">下一題</button></div><div class="feedback" id="feedback" aria-live="polite"></div></section></main><script>function elhReport(m){try{if(location.search.includes("elhdebug"))console.log("ELH",JSON.stringify(m));if(window.parent!==window)window.parent.postMessage(Object.assign({elh:1},m),location.origin)}catch(e){}}
function elhText(v){return String(v==null?"":v).replace(/<[^>]*>/g,"").replace(/\s+/g," ").trim().slice(0,200)}
const QUESTIONS=[{"id": "u4-01", "prompt": "秒針走 1 小格表示多少時間？", "options": ["1 秒", "1 分鐘", "5 秒", "1 小時"], "answer": 0, "explain": "秒針每走一小格就是 1 秒。"}, {"id": "u4-02", "prompt": "60 秒等於多少分鐘？", "options": ["半分鐘", "1 分鐘", "10 分鐘", "60 分鐘"], "answer": 1, "explain": "60 秒 = 1 分鐘。"}, {"id": "u4-03", "prompt": "秒針走 2 圈，經過了多少秒？", "options": ["2 秒", "60 秒", "120 秒", "360 秒"], "answer": 2, "explain": "1 圈 60 秒，2 圈是 60 × 2 = 120 秒。"}, {"id": "u4-04", "prompt": "哪一項活動通常只需幾秒完成？", "options": ["睡一晚覺", "眨一次眼睛", "上學一天", "看一齣電影"], "answer": 1, "explain": "眨眼是很短的活動，通常用秒量度。"}, {"id": "u4-05", "prompt": "小美在 20 秒內完成，小文在 27 秒內完成。誰較快？", "options": ["小美", "小文", "一樣快", "不能比較"], "answer": 0, "explain": "完成所用時間較少表示較快。"}, {"id": "u4-06", "prompt": "由 35 秒到 1 分鐘，還差多少秒？", "options": ["15 秒", "25 秒", "35 秒", "95 秒"], "answer": 1, "explain": "1 分鐘是 60 秒，60 − 35 = 25 秒。"}, {"id": "u4-07", "prompt": "比賽 48 秒完成，另一位用 53 秒，成績相差多少秒？", "options": ["5 秒", "6 秒", "10 秒", "101 秒"], "answer": 0, "explain": "53 − 48 = 5 秒。"}, {"id": "u4-08", "prompt": "秒針由 10 秒走到 25 秒，經過多少秒？", "options": ["10 秒", "15 秒", "25 秒", "35 秒"], "answer": 1, "explain": "25 − 10 = 15 秒。"}, {"id": "u4-09", "prompt": "哪個次序由短至長排列？", "options": ["80 秒、1 分鐘", "1 分鐘、45 秒", "12 秒、1 分鐘、75 秒", "2 分鐘、90 秒、30 秒"], "answer": 2, "explain": "12 秒 < 60 秒 < 75 秒。"}, {"id": "u4-10", "prompt": "姐姐 1 分鐘完成，弟弟 55 秒完成。誰用的時間較少？", "options": ["姐姐", "弟弟", "一樣", "不能比較"], "answer": 1, "explain": "1 分鐘 = 60 秒，55 秒較少。"}];const TOTAL=QUESTIONS.length;let i=0,picked=Array(TOTAL).fill(null),revealed=Array(TOTAL).fill(false);const $=id=>document.getElementById(id);
function state(){const data={i,p:picked.slice(),r:revealed.slice()};if(JSON.stringify(data).length<=8000)elhReport({type:"state",data})}
function render(save=true){const q=QUESTIONS[i];$("meta").textContent="單元 4｜預習第 "+(i+1)+" / "+TOTAL+" 題";$("prompt").textContent=q.prompt;$("choices").replaceChildren();q.options.forEach((t,n)=>{const b=document.createElement("button");b.type="button";b.dataset.pick=String(n);b.textContent=String.fromCharCode(65+n)+"．"+t;b.setAttribute("aria-pressed",String(picked[i]===n));$("choices").appendChild(b)});$("prev").disabled=i===0;$("next").disabled=i===TOTAL-1;$("check").disabled=revealed[i];$("bar").style.width=((i+1)/TOTAL*100)+"%";const f=$("feedback");f.className="feedback";f.textContent=revealed[i]?(picked[i]===null?"未作答；":""):"";if(revealed[i]){const p=picked[i];const ok=p!==null&&p===q.answer;f.className="feedback "+(ok?"ok":"bad");f.textContent=(p===null?"未作答；":ok?"答對了！":"再想一想；")+"正確答案："+q.options[q.answer]+"。"+q.explain}if(save)state()}
function submit(){if(revealed[i])return;const q=QUESTIONS[i],p=picked[i];elhReport({type:"answer",q:q.id,choice:p,correct:p!==null&&p===q.answer,text:elhText(q.prompt),picked:p===null?null:elhText(q.options[p]),answer:elhText(q.options[q.answer])});revealed[i]=true;render()}
document.addEventListener("click",e=>{if(!(e.target instanceof Element))return;const b=e.target.closest("button");if(!b||b.disabled)return;if(b.dataset.pick!==undefined){const n=Number(b.dataset.pick);if(Number.isInteger(n)&&n>=0&&n<QUESTIONS[i].options.length){picked[i]=n;revealed[i]=false;render()}}else if(b.id==="check")submit();else if(b.id==="prev"&&i>0){i--;render()}else if(b.id==="next"&&i<TOTAL-1){i++;render()}});
window.addEventListener("message",e=>{const m=e.data,d=m&&m.data;if(window.parent===window||e.source!==window.parent||e.origin!==location.origin||!m||m.elh!==1||m.type!=="restore"||!d||!Number.isInteger(d.i)||d.i<0||d.i>=TOTAL||!Array.isArray(d.p)||d.p.length!==TOTAL||!Array.isArray(d.r)||d.r.length!==TOTAL)return;for(let k=0;k<TOTAL;k++){if(d.p[k]!==null&&(!Number.isInteger(d.p[k])||d.p[k]<0||d.p[k]>=QUESTIONS[k].options.length))return;if(typeof d.r[k]!=="boolean")return}i=d.i;picked=d.p.slice();revealed=d.r.slice();render(false)});render(false);elhReport({type:"init",total:TOTAL});</script></body></html>
