<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>單元8 24小時報時制｜預習・學習・練習</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;background:#f5f7fc;color:#17243d;touch-action:manipulation}
.stage{height:100%;display:grid;grid-template-columns:minmax(0,55fr) minmax(0,45fr);min-height:0}
.pane{min-width:0;min-height:0;overflow:auto;padding:2vmin 2.4vmin}
.pane+.pane{border-left:2px solid #d0d7e7}
h1{font-size:clamp(1.3rem,3.8vmin,6rem);line-height:1.25;margin:1vmin 0 1.5vmin}
.meta,.feedback,.mode-bar{font-size:clamp(1rem,2.5vmin,4.5rem);line-height:1.4}
.mode-bar{display:flex;flex-wrap:wrap;gap:1vmin;margin-bottom:1.5vmin}
.mode-bar button{font-size:clamp(0.95rem,2.4vmin,4rem);padding:0.6vmin 1.4vmin}
button,input{font:inherit}
button{min-height:max(3rem,6.5vmin);min-width:max(3rem,6.5vmin);font-size:clamp(1rem,3vmin,5.5rem);padding:.5vmin 1.2vmin;border:2px solid #536788;border-radius:1vmin;background:white;color:inherit;white-space:normal;overflow-wrap:anywhere;touch-action:manipulation}
button:focus-visible{outline:4px solid #ad5400;outline-offset:3px}
button[aria-pressed="true"]{border:4px solid #1b579f;background:#dceaff}
button:disabled{opacity:.5}
button.mode-active{border:4px solid #1b579f;background:#dceaff;font-weight:600}
.options{display:grid;gap:1.2vmin;margin-bottom:1.5vmin}
.actions{display:flex;flex-wrap:wrap;gap:1vmin;margin:1.2vmin 0}
.feedback{margin-top:1.2vmin;overflow-wrap:anywhere;min-height:4vmin}
[hidden]{display:none!important}
@media(max-width:899px),(orientation:portrait){.stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,42fr) minmax(0,58fr)}.pane+.pane{border-left:0;border-top:2px solid #d0d7e7}}
</style>
</head>
<body>
<main class="stage">
  <section class="pane" aria-label="題目">
    <div class="mode-bar" id="modeBar" role="tablist">
      <button type="button" data-mode="pre" class="mode-active">預習</button>
      <button type="button" data-mode="learn">學習</button>
      <button type="button" data-mode="prac">練習</button>
    </div>
    <p class="meta" id="meta"></p>
    <h1 id="prompt"></h1>
    <div id="visual"></div>
    <nav class="actions" aria-label="換題">
      <button type="button" id="prev">上一題</button>
      <button type="button" id="next">下一題</button>
    </nav>
  </section>
  <section class="pane" aria-label="作答">
    <div class="options" id="choices"></div>
    <div class="actions"><button type="button" id="check">確定／看答案</button></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
  </section>
</main>
<script>
function elhReport(m){try{if(location.search.indexOf("elhdebug")>=0)console.log("ELH",JSON.stringify(m));if(window.parent!==window)window.parent.postMessage(Object.assign({elh:1},m),location.origin);}catch(e){}}
function elhText(h){return String(h==null?"":h).replace(/<[^>]*>/g,"").replace(/\s+/g," ").trim().slice(0,200);}

const BANK = {
  pre: [
    {id:"u8-pre-01",type:"mc",prompt:"一天共有多少小時？",options:["12 小時","24 小時","48 小時"],answer:1,explain:"一天有 24 小時。"},
    {id:"u8-pre-02",type:"mc",prompt:"12 小時報時制用什麼來區分上午和下午？",options:["上午／下午 或 a.m.／p.m.","只用數字","用顏色"],answer:0,explain:"12 小時制需要加上「上午」或「下午」。"},
    {id:"u8-pre-03",type:"mc",prompt:"24 小時報時制需要加「上午／下午」嗎？",options:["需要","不需要"],answer:1,explain:"24 小時制用 00 到 23 表示，不需要加上午下午。"},
    {id:"u8-pre-04",type:"mc",prompt:"中午 12 時用 24 小時制怎樣寫？",options:["00:00","12:00","24:00"],answer:1,explain:"中午寫成 12:00。"},
    {id:"u8-pre-05",type:"mc",prompt:"午夜 12 時用 24 小時制怎樣寫？",options:["00:00","12:00","24:00"],answer:0,explain:"午夜寫成 00:00。"},
    {id:"u8-pre-06",type:"mc",prompt:"下午 3 時用 24 小時制是幾點？",options:["03:00","15:00","13:00"],answer:1,explain:"下午 3 時 = 15:00。"}
  ],
  learn: [
    {id:"u8-learn-01",type:"mc",prompt:"上午 8 時用 24 小時制寫成？",options:["08:00","20:00","18:00"],answer:0,explain:"上午時間數字不變，寫成 08:00。"},
    {id:"u8-learn-02",type:"mc",prompt:"下午 2 時用 24 小時制寫成？",options:["02:00","14:00","12:00"],answer:1,explain:"下午 2 時 = 12 + 2 = 14:00。"},
    {id:"u8-learn-03",type:"mc",prompt:"下午 7 時 30 分用 24 小時制寫成？",options:["07:30","19:30","17:30"],answer:1,explain:"下午 7 時 = 19 時，寫成 19:30。"},
    {id:"u8-learn-04",type:"mc",prompt:"16:00 是 12 小時制的什麼時間？",options:["上午 4 時","下午 4 時","下午 6 時"],answer:1,explain:"16 − 12 = 4，是下午 4 時。"},
    {id:"u8-learn-05",type:"mc",prompt:"21:15 是 12 小時制的什麼時間？",options:["上午 9 時 15 分","下午 9 時 15 分","晚上 11 時 15 分"],answer:1,explain:"21 − 12 = 9，是下午（晚上）9 時 15 分。"},
    {id:"u8-learn-06",type:"mc",prompt:"00:45 是 12 小時制的什麼時間？",options:["上午 12 時 45 分","下午 12 時 45 分","上午 0 時 45 分"],answer:0,explain:"00:45 是午夜過後 45 分，即上午 12 時 45 分。"},
    {id:"u8-learn-07",type:"mc",prompt:"下午 11 時用 24 小時制寫成？",options:["11:00","23:00","22:00"],answer:1,explain:"下午 11 時 = 23:00。"},
    {id:"u8-learn-08",type:"mc",prompt:"從上午 9 時到下午 3 時，經過了多少小時？",options:["6 小時","9 小時","12 小時"],answer:0,explain:"從 09:00 到 15:00，經過 6 小時。"},
    {id:"u8-learn-09",type:"mc",prompt:"18:00 用 12 小時制怎樣說？",options:["上午 6 時","下午 6 時","晚上 8 時"],answer:1,explain:"18 − 12 = 6，是下午 6 時。"},
    {id:"u8-learn-10",type:"mc",prompt:"哪一個是正確的 24 小時制寫法？",options:["下午 15:00","15:00","15:00 p.m."],answer:1,explain:"24 小時制直接寫 15:00，不加「下午」。"}
  ],
  prac: [
    {id:"u8-prac-01",type:"mc",prompt:"上午 10 時 20 分 → 24 小時制？",options:["10:20","22:20","12:20"],answer:0,explain:"上午時間保持不變。"},
    {id:"u8-prac-02",type:"mc",prompt:"下午 5 時 → 24 小時制？",options:["05:00","17:00","15:00"],answer:1,explain:"12 + 5 = 17:00。"},
    {id:"u8-prac-03",type:"mc",prompt:"下午 9 時 45 分 → 24 小時制？",options:["09:45","21:45","19:45"],answer:1,explain:"12 + 9 = 21，寫成 21:45。"},
    {id:"u8-prac-04",type:"mc",prompt:"14:30 是 12 小時制的什麼時間？",options:["上午 2 時 30 分","下午 2 時 30 分","下午 4 時 30 分"],answer:1,explain:"14 − 12 = 2，是下午 2 時 30 分。"},
    {id:"u8-prac-05",type:"mc",prompt:"23:10 是 12 小時制的什麼時間？",options:["上午 11 時 10 分","下午 11 時 10 分","晚上 9 時 10 分"],answer:1,explain:"23 − 12 = 11，是下午（晚上）11 時 10 分。"},
    {id:"u8-prac-06",type:"mc",prompt:"從 08:00 到 15:00，經過了多少小時？",options:["5 小時","7 小時","8 小時"],answer:1,explain:"15 − 8 = 7 小時。"},
    {id:"u8-prac-07",type:"mc",prompt:"電影 19:30 開始，用 12 小時制怎樣說？",options:["上午 7 時 30 分","下午 7 時 30 分","晚上 9 時 30 分"],answer:1,explain:"19 − 12 = 7，是下午 7 時 30 分。"},
    {id:"u8-prac-08",type:"mc",prompt:"哪個時間較晚？",options:["15:00","下午 2 時"],answer:0,explain:"15:00 是下午 3 時，比下午 2 時晚。"},
    {id:"u8-prac-09",type:"mc",prompt:"00:00 是什麼時候？",options:["中午","午夜","下午 12 時"],answer:1,explain:"00:00 是午夜（一天的開始）。"},
    {id:"u8-prac-10",type:"mc",prompt:"小明下午 4 時開始做功課，用 24 小時制寫成？",options:["04:00","16:00","14:00"],answer:1,explain:"下午 4 時 = 16:00。"},
    {id:"u8-prac-11",type:"mc",prompt:"從 22:00 到第二天 06:00，經過了多少小時？",options:["6 小時","8 小時","10 小時"],answer:1,explain:"從 22 時到 24 時是 2 小時，再加 6 小時，共 8 小時。"},
    {id:"u8-prac-12",type:"mc",prompt:"正確的是？",options:["24 小時制要寫 a.m.／p.m.","24 小時制用 00–23 表示","中午寫成 00:00"],answer:1,explain:"24 小時制用 00 到 23 表示小時。"}
  ]
};

const MODE_LABEL = {pre:"預習", learn:"學習", prac:"練習"};
const MODES = ["pre","learn","prac"];
const ALL_TOTAL = MODES.reduce(function(n,k){return n+BANK[k].length;},0);
function emptyProg(k){
  const n = BANK[k].length;
  return {i:0, p:Array(n).fill(null), r:Array(n).fill(false)};
}
let progress = {pre:emptyProg("pre"), learn:emptyProg("learn"), prac:emptyProg("prac")};
let mode = "pre";
let QUESTIONS = BANK[mode];
let TOTAL = QUESTIONS.length;
let i = 0;
let picked = progress[mode].p;
let revealed = progress[mode].r;
const $ = id => document.getElementById(id);

function elhState(){
  if (MODES.indexOf(mode) < 0 || !Number.isInteger(i) || i < 0 || i >= TOTAL) return;
  progress[mode].i = i;
  const snap = function(k){return {i:progress[k].i, p:progress[k].p.slice(), r:progress[k].r.slice()};};
  const data = {mode:mode, i:i, all:ALL_TOTAL, pre:snap("pre"), learn:snap("learn"), prac:snap("prac")};
  if (JSON.stringify(data).length > 8000) return;
  elhReport({type:"state", data:data});
}

function render(saveState = true){
  const q = QUESTIONS[i];
  $("meta").textContent = "單元8 24小時報時制｜" + MODE_LABEL[mode] + "｜第 " + (i + 1) + " / " + TOTAL + " 題";
  $("prompt").textContent = q.prompt;
  $("choices").replaceChildren();
  $("feedback").textContent = "";
  q.options.forEach(function(text, n){
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.pick = String(n);
    b.textContent = String.fromCharCode(65 + n) + "．" + text;
    b.setAttribute("aria-pressed", String(picked[i] === n));
    $("choices").appendChild(b);
  });
  $("prev").disabled = i === 0;
  $("next").disabled = i === TOTAL - 1;
  $("check").disabled = revealed[i];
  if (revealed[i]) {
    const p = picked[i];
    let result = p === null ? "未作答；" : (p === q.answer ? "答對了！" : "再想一想；");
    result += "正確答案：" + q.options[q.answer] + "。" + (q.explain || "");
    $("feedback").textContent = result;
  }
  if (saveState) elhState();
}

function submitCurrent(){
  if (revealed[i]) return;
  const q = QUESTIONS[i];
  const choice = picked[i];
  const correct = choice !== null && choice === q.answer;
  elhReport({
    type:"answer", q:q.id, choice:choice, correct:correct,
    text:elhText(q.prompt),
    picked: choice === null ? null : elhText(q.options[choice]),
    answer: elhText(q.options[q.answer])
  });
  revealed[i] = true;
  render();
}

function switchMode(newMode){
  if (newMode === mode || !BANK[newMode]) return;
  progress[mode].i = i;
  mode = newMode;
  QUESTIONS = BANK[mode];
  TOTAL = QUESTIONS.length;
  i = progress[mode].i;
  picked = progress[mode].p;
  revealed = progress[mode].r;
  document.querySelectorAll("#modeBar button").forEach(b => b.classList.toggle("mode-active", b.dataset.mode === mode));
  render(true);
}

document.addEventListener("click", function(e){
  if (!(e.target instanceof Element)) return;
  const b = e.target.closest("button");
  if (!b || b.disabled) return;
  if (b.dataset.mode) { switchMode(b.dataset.mode); return; }
  if (b.hasAttribute("data-pick")) {
    const n = Number(b.dataset.pick);
    if (!Number.isInteger(n) || n < 0 || n >= QUESTIONS[i].options.length) return;
    picked[i] = n; revealed[i] = false; render();
  } else if (b.id === "check") {
    submitCurrent();
  } else if (b.id === "prev" && i > 0) { i--; render(); }
  else if (b.id === "next" && i < TOTAL - 1) { i++; render(); }
});

function applyProgress(d){
  function load(k){
    const n = BANK[k].length;
    const s = d[k];
    if (!s || !Number.isInteger(s.i) || s.i < 0 || s.i >= n || !Array.isArray(s.p) || s.p.length !== n || !Array.isArray(s.r) || s.r.length !== n) return false;
    for (let j = 0; j < n; j++){
      const q = BANK[k][j];
      if (s.p[j] !== null) {
        if (!q.options || !Number.isInteger(s.p[j]) || s.p[j] < 0 || s.p[j] >= q.options.length) return false;
      }
      if (typeof s.r[j] !== "boolean") return false;
    }
    progress[k].i = s.i;
    progress[k].p = s.p.slice();
    progress[k].r = s.r.slice();
    return true;
  }
  if (!d || !BANK[d.mode] || !load("pre") || !load("learn") || !load("prac")) return false;
  mode = d.mode;
  QUESTIONS = BANK[mode];
  TOTAL = QUESTIONS.length;
  i = progress[mode].i;
  picked = progress[mode].p;
  revealed = progress[mode].r;
  return true;
}

window.addEventListener("message", function(e){
  const m = e.data;
  if (window.parent === window || e.source !== window.parent || e.origin !== location.origin || !m || m.elh !== 1 || m.type !== "restore") return;
  if (!applyProgress(m.data || {})) return;
  document.querySelectorAll("#modeBar button").forEach(b => b.classList.toggle("mode-active", b.dataset.mode === mode));
  render(false);
});

render(false);
elhReport({type:"init", total:ALL_TOTAL});
</script>
</body>
</html>
