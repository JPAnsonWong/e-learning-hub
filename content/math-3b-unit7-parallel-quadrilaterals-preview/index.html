<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平行線和四邊形</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;background:#f5f7fc;color:#17243d;touch-action:manipulation}.stage{height:100%;display:grid;grid-template-columns:minmax(0,58fr) minmax(0,42fr);min-height:0}.pane{min-width:0;min-height:0;overflow:auto;padding:2vmin 2.4vmin}.pane+.pane{border-left:2px solid #d0d7e7}h1{font-size:clamp(1.5rem,4.2vmin,7rem);line-height:1.2;margin:1vmin 0 1.5vmin}.meta,.feedback,.learn{font-size:clamp(1rem,2.6vmin,5rem);line-height:1.4}.learn{background:#fff;border-radius:1vmin;padding:1vmin 1.4vmin;border-left:8px solid #2d6cdf}.learn li{margin:.5em 0}button,input{font:inherit}button{min-height:max(3rem,7vmin);min-width:max(3rem,7vmin);font-size:clamp(1rem,3.2vmin,6rem);padding:.5vmin 1.2vmin;border:2px solid #536788;border-radius:1vmin;background:#fff;color:inherit;white-space:normal;overflow-wrap:anywhere;touch-action:manipulation}button:focus-visible{outline:4px solid #ad5400;outline-offset:3px}button[aria-pressed="true"]{border:4px solid #1b579f;background:#dceaff}button:disabled{opacity:.5}.options{display:grid;gap:1vmin;margin-bottom:1vmin}.actions{display:flex;flex-wrap:wrap;gap:1vmin;margin:1vmin 0}.feedback{margin-top:1vmin;overflow-wrap:anywhere;min-height:3em}.progress{height:1.3vmin;background:#dce3f2;border-radius:9px;overflow:hidden}.progress b{display:block;height:100%;background:#2d6cdf}.visual{margin:1vmin 0;min-height:15vmin;display:grid;place-items:center;background:#eef3ff;border-radius:1.2vmin;padding:1vmin;text-align:center}.clock-face{width:min(22vmin,240px);aspect-ratio:1;border:clamp(4px,.7vmin,12px) solid #1b579f;border-radius:50%;position:relative;background:#fff}.n{position:absolute;font-weight:700;font-size:clamp(1rem,2.5vmin,3rem)}.n12{top:2%;left:46%}.n3{right:3%;top:44%}.n6{bottom:2%;left:47%}.n9{left:3%;top:44%}.hand{position:absolute;left:50%;bottom:50%;transform-origin:bottom;border-radius:8px}.h12{height:38%;width:3%;background:#1b579f;transform:rotate(0deg)}.h4{height:30%;width:3%;background:#d85b3f;transform:rotate(120deg)}.pin{position:absolute;width:8%;aspect-ratio:1;background:#17243d;border-radius:50%;left:46%;top:46%}.division .chips{font-size:clamp(1.2rem,4vmin,5rem);letter-spacing:.4vmin;color:#2d6cdf}.balance{position:relative}.beam{width:65%;height:1vmin;background:#536788;transform:rotate(0deg)}.pan{padding:1vmin 2vmin;border:3px solid #536788;background:#fff;position:absolute;top:42%;border-radius:1vmin;font-size:clamp(1rem,2.5vmin,3rem)}.pan.left{left:12%}.pan.right{right:12%}.shapes svg{width:min(100%,560px);height:auto}.shape{stroke:#17243d;stroke-width:4}.blue{fill:#cde0ff}.orange{fill:#ffd9a8}.timeline{gap:1vmin}.time-row{display:flex;align-items:center;gap:2vmin;font-size:clamp(1.2rem,3vmin,4rem);font-weight:700}.time-row span{background:#fff;border:2px solid #536788;border-radius:1vmin;padding:.8vmin 1.4vmin}.feedback.ok{color:#116b3b}.feedback.bad{color:#a83a20}@media(max-width:899px),(orientation:portrait){.stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,45fr) minmax(0,55fr)}.pane+.pane{border-left:0;border-top:2px solid #d0d7e7}}[hidden]{display:none!important}</style></head><body><main class="stage"><section class="pane" aria-label="學習重點"><p class="meta">單元 7｜3年級數學B冊預習</p><h1>平行線和四邊形</h1><div class="progress" aria-label="預習進度"><b id="bar" style="width:0%"></b></div><h2>先學一學</h2><ul class="learn"><li>兩條直線之間的距離維持不變，便稱為互相平行；這兩條線是平行線。</li><li>平行四邊形有兩組對邊平行，並且對邊長度相等。正方形和長方形都是平行四邊形。</li><li>梯形有一組對邊平行；平行的一組邊稱為上底和下底。</li></ul><div class="visual shapes"><svg viewBox="0 0 520 170" role="img" aria-label="平行四邊形和梯形示意圖"><polygon points="40,125 150,125 125,45 15,45" class="shape blue"></polygon><polygon points="250,125 420,125 375,45 295,45" class="shape orange"></polygon><text x="50" y="155">平行四邊形</text><text x="315" y="155">梯形</text></svg></div><p class="meta">完成右側練習後，可按「上一題／下一題」重溫重點。題目依課本、工作紙及補充練習的章節概念整理。</p></section><section class="pane" aria-label="互動練習"><p class="meta" id="meta"></p><h2 id="prompt"></h2><div class="options" id="choices"></div><div class="actions"><button type="button" id="check">確定／看答案</button><button type="button" id="prev">上一題</button><button type="button" id="next">下一題</button></div><div class="feedback" id="feedback" aria-live="polite"></div></section></main><script>function elhReport(m){try{if(location.search.includes("elhdebug"))console.log("ELH",JSON.stringify(m));if(window.parent!==window)window.parent.postMessage(Object.assign({elh:1},m),location.origin)}catch(e){}}
function elhText(v){return String(v==null?"":v).replace(/<[^>]*>/g,"").replace(/\s+/g," ").trim().slice(0,200)}
const QUESTIONS=[{"id": "u7-01", "prompt": "下列哪一項最能描述平行線？", "options": ["相交成直角的線", "距離維持不變的兩條直線", "一定是水平的線", "只有一條直線"], "answer": 1, "explain": "平行線之間的距離保持不變。"}, {"id": "u7-02", "prompt": "平行四邊形有多少組對邊平行？", "options": ["沒有", "一組", "兩組", "四組"], "answer": 2, "explain": "平行四邊形有兩組對邊平行。"}, {"id": "u7-03", "prompt": "平行四邊形的對邊通常有甚麼關係？", "options": ["對邊長度相等", "所有邊都不相等", "只有一邊有長度", "對角線一定相等"], "answer": 0, "explain": "平行四邊形的對邊平行且長度相等。"}, {"id": "u7-04", "prompt": "哪一種圖形一定是平行四邊形？", "options": ["三角形", "正方形", "五邊形", "圓形"], "answer": 1, "explain": "正方形有兩組對邊平行。"}, {"id": "u7-05", "prompt": "梯形有幾組平行的對邊？", "options": ["沒有", "剛好一組", "兩組", "三組"], "answer": 1, "explain": "本單元把只有一組對邊平行的四邊形稱為梯形。"}, {"id": "u7-06", "prompt": "梯形中平行的兩條邊可稱為甚麼？", "options": ["左邊和右邊", "上底和下底", "長邊和短邊", "內邊和外邊"], "answer": 1, "explain": "平行的一組對邊稱為上底和下底。"}, {"id": "u7-07", "prompt": "要畫與一條直線平行的線，哪個方法較合適？", "options": ["任意改變方向", "保持相同方向和距離", "一定要畫成圓形", "只畫一個點"], "answer": 1, "explain": "平行線方向相同，距離維持不變。"}, {"id": "u7-08", "prompt": "以下哪項不是平行四邊形的必然特性？", "options": ["對邊平行", "對邊長度相等", "四條邊一定相等", "有四條邊"], "answer": 2, "explain": "四條邊一定相等是正方形等特殊情況，不是所有平行四邊形。"}, {"id": "u7-09", "prompt": "長方形是不是平行四邊形？", "options": ["是", "不是", "只有正方形才是", "不能判斷"], "answer": 0, "explain": "長方形有兩組對邊平行，所以是平行四邊形。"}, {"id": "u7-10", "prompt": "一個四邊形剛好有一組對邊平行，最可能是哪種圖形？", "options": ["梯形", "圓形", "三角形", "正方形"], "answer": 0, "explain": "梯形的特徵是有一組對邊平行。"}];const TOTAL=QUESTIONS.length;let i=0,picked=Array(TOTAL).fill(null),revealed=Array(TOTAL).fill(false);const $=id=>document.getElementById(id);
function state(){const data={i,p:picked.slice(),r:revealed.slice()};if(JSON.stringify(data).length<=8000)elhReport({type:"state",data})}
function render(save=true){const q=QUESTIONS[i];$("meta").textContent="單元 7｜預習第 "+(i+1)+" / "+TOTAL+" 題";$("prompt").textContent=q.prompt;$("choices").replaceChildren();q.options.forEach((t,n)=>{const b=document.createElement("button");b.type="button";b.dataset.pick=String(n);b.textContent=String.fromCharCode(65+n)+"．"+t;b.setAttribute("aria-pressed",String(picked[i]===n));$("choices").appendChild(b)});$("prev").disabled=i===0;$("next").disabled=i===TOTAL-1;$("check").disabled=revealed[i];$("bar").style.width=((i+1)/TOTAL*100)+"%";const f=$("feedback");f.className="feedback";f.textContent=revealed[i]?(picked[i]===null?"未作答；":""):"";if(revealed[i]){const p=picked[i];const ok=p!==null&&p===q.answer;f.className="feedback "+(ok?"ok":"bad");f.textContent=(p===null?"未作答；":ok?"答對了！":"再想一想；")+"正確答案："+q.options[q.answer]+"。"+q.explain}if(save)state()}
function submit(){if(revealed[i])return;const q=QUESTIONS[i],p=picked[i];elhReport({type:"answer",q:q.id,choice:p,correct:p!==null&&p===q.answer,text:elhText(q.prompt),picked:p===null?null:elhText(q.options[p]),answer:elhText(q.options[q.answer])});revealed[i]=true;render()}
document.addEventListener("click",e=>{if(!(e.target instanceof Element))return;const b=e.target.closest("button");if(!b||b.disabled)return;if(b.dataset.pick!==undefined){const n=Number(b.dataset.pick);if(Number.isInteger(n)&&n>=0&&n<QUESTIONS[i].options.length){picked[i]=n;revealed[i]=false;render()}}else if(b.id==="check")submit();else if(b.id==="prev"&&i>0){i--;render()}else if(b.id==="next"&&i<TOTAL-1){i++;render()}});
window.addEventListener("message",e=>{const m=e.data,d=m&&m.data;if(window.parent===window||e.source!==window.parent||e.origin!==location.origin||!m||m.elh!==1||m.type!=="restore"||!d||!Number.isInteger(d.i)||d.i<0||d.i>=TOTAL||!Array.isArray(d.p)||d.p.length!==TOTAL||!Array.isArray(d.r)||d.r.length!==TOTAL)return;for(let k=0;k<TOTAL;k++){if(d.p[k]!==null&&(!Number.isInteger(d.p[k])||d.p[k]<0||d.p[k]>=QUESTIONS[k].options.length))return;if(typeof d.r[k]!=="boolean")return}i=d.i;picked=d.p.slice();revealed=d.r.slice();render(false)});render(false);elhReport({type:"init",total:TOTAL});</script></body></html>
