<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>女兒的數學練習　3D補充練習錯題講解</title>
<style>
  :root {
    --bg: #f4efe6;
    --ink: #1c2430;
    --muted: #5a6573;
    --card: #fffdf8;
    --line: #e2d8c8;
    --accent: #1f6f8b;
    --accent-2: #d97706;
    --good: #157a3a;
    --good-bg: #dff6e8;
    --bad: #b42318;
    --bad-bg: #fde8e6;
    --pick: #1f6f8b;
    --shadow: 0 10px 30px rgba(28,36,48,.08);
  }
  html.dark {
    --bg: #101826;
    --ink: #f3efe6;
    --muted: #b7c0cc;
    --card: #1a2536;
    --line: #2c3a50;
    --accent: #5ec8e6;
    --accent-2: #f0b429;
    --good: #5ee09a;
    --good-bg: #163528;
    --bad: #ff8d85;
    --bad-bg: #3a1d1c;
    --pick: #5ec8e6;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #app { height: 100%; display: flex; flex-direction: column; padding: 1.8vmin 2.6vmin 1.4vmin; }
  header.top {
    display: flex; align-items: center; gap: 1.4vmin;
    flex: 0 0 auto;
  }
  .brand { font-weight: 800; font-size: 2.2vmin; color: var(--accent); white-space: nowrap; }
  .unit {
    font-size: 1.9vmin; color: var(--muted);
    background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: .25vmin 1.3vmin;
  }
  .spacer { flex: 1; }
  .progress { font-weight: 800; font-size: 2.3vmin; letter-spacing: .04em; }
  button.icon, button.nav, button.act { font-family: inherit; cursor: pointer; border: 0; }
  button.icon {
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 1.1vmin;
    font-size: 2vmin; padding: .5vmin 1.1vmin;
  }
  main {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 2vmin; box-shadow: var(--shadow);
    padding: 2vmin 2.6vmin; margin: 1.2vmin 0;
  }
  main.split { flex-direction: row; gap: 2.2vmin; align-items: stretch; }
  .col-q { flex: 1.25; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .prompt {
    font-size: 3.5vmin; font-weight: 800; line-height: 1.35;
    margin: 0 0 1.4vmin; letter-spacing: .01em; flex: 0 0 auto;
  }
  .prompt .em { color: var(--accent); }
  .visual { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .options {
    display: grid; gap: 1.1vmin;
    grid-template-columns: 1fr 1fr;
    margin-top: 1.4vmin; flex: 0 0 auto;
  }
  .options.one-col { grid-template-columns: 1fr; }
  .opt {
    display: flex; align-items: center; gap: 1.3vmin;
    background: transparent; color: var(--ink);
    border: 2px solid var(--line); border-radius: 1.4vmin;
    padding: 1vmin 1.4vmin; text-align: left;
    font-size: 3vmin; font-weight: 700; min-height: 7.2vmin;
  }
  main.split .opt { min-height: 6.2vmin; font-size: 2.6vmin; padding: .7vmin 1.2vmin; }
  .opt:hover { border-color: var(--accent); }
  .opt .tag {
    flex: 0 0 4.8vmin; height: 4.8vmin; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--bg); font-size: 2.4vmin; font-weight: 800;
  }
  .opt.picked { border-color: var(--pick); border-width: 3px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--pick) 25%, transparent); }
  .opt.correct { border-color: var(--good); background: var(--good-bg); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .blank-list { margin-top: 1.2vmin; display: flex; flex-direction: column; gap: 1.1vmin; flex: 0 0 auto; }
  .blank-row { display: flex; align-items: center; flex-wrap: wrap; gap: .6vmin 0; font-size: 2.9vmin; font-weight: 700; }
  .blank {
    min-width: 14vmin; min-height: 5.6vmin; padding: 0 1.2vmin; margin: 0 .4vmin;
    border-bottom: 4px solid var(--accent);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); letter-spacing: .04em;
  }
  .blank.show { color: var(--good); font-weight: 800; }
  .explain {
    display: none; flex: 0.95; min-width: 0;
    padding: 1.6vmin 2vmin; overflow: auto;
    background: var(--bg); border-radius: 1.6vmin; border: 1px solid var(--line);
  }
  main.split .explain { display: block; }
  .explain h3 { margin: 0 0 1vmin; font-size: 2.4vmin; color: var(--accent-2); }
  .explain li { margin: 0 0 .8vmin; font-size: 2.5vmin; line-height: 1.45; font-weight: 600; }
  .explain ol { margin: 0; padding-left: 3vmin; }
  .verdict { font-size: 2.7vmin; font-weight: 800; margin: 0 0 1vmin; }
  .verdict.ok { color: var(--good); }
  .verdict.no { color: var(--bad); }
  .last { font-size: 2.1vmin; color: var(--muted); font-weight: 600; margin-top: 1.2vmin; }
  footer.bar { flex: 0 0 auto; display: flex; align-items: center; gap: 1.1vmin; }
  button.nav, button.act {
    font-size: 2.4vmin; font-weight: 800; border-radius: 1.3vmin;
    padding: 1vmin 2vmin; min-height: 6vmin;
  }
  button.nav { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  button.act { background: var(--accent); color: #fff; }
  html.dark button.act { color: #102018; }
  button.act.ready { background: var(--accent-2); }
  button:disabled { opacity: .35; cursor: default; }
  .dots { display: flex; gap: .65vmin; margin: 0 auto; }
  .dot { width: 1.3vmin; height: 1.3vmin; border-radius: 50%; background: var(--line); }
  .dot.now { background: var(--accent); transform: scale(1.25); }
  .dot.done { background: var(--good); }
  .cover, .end {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 1.5vmin;
  }
  .cover h1, .end h1 { font-size: 7vmin; margin: 0; letter-spacing: .04em; }
  .cover p, .end p { font-size: 3vmin; color: var(--muted); margin: 0; font-weight: 600; }
  .hint { font-size: 2vmin; color: var(--muted); margin-top: 1.6vmin; }
  .num-huge { font-size: 7vmin; font-weight: 900; letter-spacing: .12em; text-align: center; }
  .places { display: flex; justify-content: center; gap: 1.1vmin; margin-top: 1vmin; }
  .place { width: 10.5vmin; text-align: center; }
  .place .d { font-size: 5vmin; font-weight: 900; background: var(--bg); border-radius: 1.1vmin; border: 2px solid var(--line); }
  .place .l { font-size: 1.9vmin; color: var(--muted); margin-top: .2vmin; font-weight: 700; }
  .place .v { font-size: 2vmin; font-weight: 800; color: var(--accent); min-height: 2.4vmin; }
  .place.hi .d { border-color: var(--accent-2); background: color-mix(in srgb, var(--accent-2) 18%, var(--card)); }
  .cards { display: flex; justify-content: center; gap: 1.3vmin; }
  .ncard {
    width: 8.6vmin; height: 10.4vmin; border-radius: 1.3vmin;
    display: grid; place-items: center; font-size: 4.8vmin; font-weight: 900;
    background: #1f6f8b; color: #fff; box-shadow: var(--shadow);
  }
  .turtles { display: flex; justify-content: center; gap: 2.2vmin; flex-wrap: wrap; }
  .turtle { width: 15vmin; text-align: center; }
  .turtle .shell {
    height: 9.4vmin; border-radius: 50% 50% 42% 42%;
    background: #2a9d8f; color: #fff; font-size: 4vmin; font-weight: 900;
    display: grid; place-items: center;
  }
  .map, .ribbon, .ruler-svg { width: 100%; display: block; }
  .ruler-svg { max-height: 32vmin; }
  .map { max-height: 34vmin; }
  .clocks { display: flex; justify-content: center; gap: 3.4vmin; align-items: center; }
  .clock-face { width: 20vmin; height: 20vmin; }
  main.split .clock-face { width: 16vmin; height: 16vmin; }
  .digital { font-size: 4.6vmin; font-weight: 900; letter-spacing: .06em; }
  .prods { display: grid; grid-template-columns: 1fr 1fr; gap: 1vmin; font-size: 2.5vmin; font-weight: 800; width: 100%; }
  .prods span { background: var(--bg); border-radius: 1vmin; padding: .7vmin 1vmin; border: 1px solid var(--line); text-align: center; }
  .eq { text-align: center; font-size: 4vmin; font-weight: 900; letter-spacing: .05em; }
  .eq-sub { text-align: center; font-size: 2.6vmin; font-weight: 700; margin-top: .8vmin; }
  .note { font-size: 2.6vmin; font-weight: 800; line-height: 1.45; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const slides = [
  {
    unit: "五位數",
    prompt: "在 <span class='em'>24 473</span> 這個數裏，兩個數字「4」代表的數值之和是多少？",
    kind: "mcq",
    options: ["8", "44", "440", "4400"],
    answer: 3,
    last: "上次練習時選了 C. 440",
    visual: "places24473",
    explain: [
      "同一個數字，放在不同位置，代表的數值就不一樣。",
      "千位的 4，代表 4 000。",
      "百位的 4，代表 400。",
      "加起來：4 000 ＋ 400 ＝ 4 400。"
    ]
  },
  {
    unit: "公里和毫米",
    prompt: "以下哪一項最接近<strong>電腦顯示屏的闊度</strong>？",

    options: ["50 mm", "50 cm", "5 m", "5 km"],
    answer: 1,
    last: "上次練習時選了 A. 50 mm",
    visual: "monitor",
    explain: [
      "50 毫米只有 5 厘米，差不多只有幾隻手指併起來那麼短，屏幕不會那麼窄。",
      "5 米、5 公里又太長了，比房間還要闊。",
      "50 厘米大約是半米，才接近電腦屏幕的闊度。"
    ]
  },
  {
    unit: "公里和毫米",
    prompt: "敏敏把一條長 <span class='em'>95 mm</span> 的絲帶剪成兩段，以下哪一項可能是其中一段的長度？",
    kind: "mcq",
    options: ["105 mm", "100 mm", "10 cm", "5 cm"],
    answer: 3,
    last: "上次練習時選了 C. 10 cm",
    visual: "ribbon",
    explain: [
      "剪出來的一段，一定要比整條絲帶短。",
      "10 厘米 ＝ 100 毫米，已經比 95 毫米長，不可能是其中一段。",
      "5 厘米 ＝ 50 毫米，比 95 毫米短，所以有可能。"
    ]
  },
  {
    unit: "五位數",
    prompt: "以下哪一個數的「0」最多？",
    kind: "mcq",
    oneCol: true,
    options: ["一萬七千五百", "七萬零一百零五", "五萬零一十七", "一萬零七百"],
    answer: 3,
    last: "上次練習時選了 B. 七萬零一百零五",
    visual: "zeros",
    explain: [
      "先把每個數寫成阿拉伯數字，再數有幾個 0。",
      "A 是 17 500，兩個 0；B 是 70 105，兩個 0；C 是 50 017，兩個 0。",
      "D 是 10 700，有三個 0，所以「0」最多。"
    ]
  },
  {
    unit: "五位數",
    prompt: "浩浩用這些數卡排成<strong>三個五位單數</strong>，由大至小排列。第三個數是 90 083，其餘兩個數是甚麼？",
    kind: "fill",
    blanks: [
      { before: "", mid: " ＞ ", after: " ＞ 90 083", answer: "98 003", answer2: "90 803" }
    ],
    last: "上次寫了 98 300 和 93 080（個位都是 0，是雙數）",
    visual: "cards00389",
    explain: [
      "單數的個位一定是 1、3、5、7 或 9。這裏能用的個位只有 3。",
      "用 0、0、3、8、9 排出比 90 083 大的五位單數，就是 98 003 和 90 803。",
      "98 300、93 080 的個位都是 0，是雙數，不合題意。"
    ]
  },
  {
    unit: "乘法",
    prompt: "從圖中選出適當的數，組成乘式：結果是<strong>最小而又是雙數</strong>　　□ × 3 ＝ □",
    kind: "mcq",
    options: ["57", "25", "71", "52"],
    answer: 3,
    last: "上次練習時選了 25（25 × 3 ＝ 75，是單數）",
    visual: "turtles",
    explain: [
      "先把四隻烏龜背上的數都乘 3。",
      "57×3＝171、25×3＝75、71×3＝213，這三個都是單數。",
      "只有 52×3＝156 是雙數，也符合「最小而又是雙數」。"
    ]
  },
  {
    unit: "乘法",
    prompt: "以下哪一道乘式的結果<strong>最小</strong>？",
    kind: "mcq",
    options: ["708 × 9", "809 × 7", "709 × 8", "908 × 7"],
    answer: 1,
    last: "上次練習時選了 C. 709 × 8",
    visual: "prods",
    explain: [
      "四道題都要先算出來再比較。",
      "708×9＝6 372，809×7＝5 663，709×8＝5 672，908×7＝6 356。",
      "最小的是 5 663，也就是 809 × 7。709×8 只差一點點，但不是最小。"
    ]
  },
  {
    unit: "乘法應用題",
    prompt: "陳老師須批改作業 <span class='em'>25 本</span>。如果每本作業有 <span class='em'>8 課</span>，每課有 <span class='em'>8 題</span>，陳老師共須批改多少題？",
    kind: "mcq",
    options: ["200", "400", "1600", "1640"],
    answer: 2,
    last: "上次練習時選了 A. 200",
    visual: "times",
    explain: [
      "本數、課數、題數都要用上，所以是連續乘三次。",
      "25 × 8 ＝ 200，這只是 25 本、每本 8 課的課數。",
      "每課還有 8 題，還要再乘 8：200 × 8 ＝ 1 600。"
    ]
  },
  {
    unit: "時間",
    prompt: "現在是 <span class='em'>11:37 p.m.</span>，距離<strong>新一天的開始</strong>還有多久？",

    last: "上次練習時選了 D. 33 min",
    visual: "clock1137",
    explain: [

  },
  {

    kind: "fill",
    blanks: [
      { before: "下午 ", mid: " 時 ", after: " 分", answer: "7", answer2: "44" }
    ],
    last: "上次寫了下午 7 時 42 分",
    visual: "minus26",
    explain: [
      "離開是下午 8 時 10 分，購物用了 26 分鐘，所以要往回減 26 分鐘。",
      "先減 10 分鐘，來到 8 時正；還要再減 16 分鐘。",
      "8 時正減 16 分鐘，就是下午 7 時 44 分。"
    ]
  },
  {
    unit: "公里和毫米　部分錯誤",
    prompt: "羊羊有以下兩枝蠟筆，用直尺量度它們的長度。",
    kind: "fill",
    blanks: [
      { before: "(a) 綠色蠟筆長 ", after: " cm", answer: "7" },
      { before: "(b) 橙色蠟筆長 ", mid: " mm，比綠色蠟筆短 ", after: " mm", answer: "65", answer2: "5" },
      { before: "(c) 後來剩 4 cm，比原來短了 ", after: " mm", answer: "25" }
    ],
    last: "上次 (a)(b) 答對了；(c) 寫了 4",
    visual: "crayons",
    explain: [
      "綠色對準尺是 7 厘米，也就是 70 毫米；橙色是 65 毫米，短了 5 毫米。",
      "後來橙色只剩 4 厘米。4 厘米 ＝ 40 毫米。",

  },
  {
    unit: "公里和毫米　部分錯誤",
    prompt: "看彬彬家附近社區的簡圖，再回答問題。",

    blanks: [

      { before: "(b) 從公園經運動場往商場，比直接走要多走 ", after: " km", answer: "1" }
    ],
    last: "上次 (a) 200 答對了；(b) 寫了 5",

    explain: [
      "(a) 家到公園是 1 公里 ＝ 1 000 米，走了 800 米，還剩 200 米。",
      "(b) 經運動場：3 ＋ 2 ＝ 5 公里；直接走是 4 公里。",

const letters = ["A","B","C","D"];
let i = -1;
let picked = null;
let revealed = false;
let dark = false;

function visualHTML(key, isRevealed) {
  if (key === "places24473") {
    const vals = isRevealed ? ["20 000","4 000","400","70","3"] : ["","","","",""];
    const labels = ["萬","千","百","十","個"];
    const digits = ["2","4","4","7","3"];
    return `<div><div class="num-huge">24 473</div>
      <div class="places">${digits.map((d,idx)=>`<div class="place${(idx===1||idx===2)&&isRevealed?" hi":""}"><div class="d">${d}</div><div class="l">${labels[idx]}</div><div class="v">${vals[idx]}</div></div>`).join("")}</div></div>`;
  }
  if (key === "monitor") {
    return `<div style="display:flex;justify-content:center;align-items:center;gap:3vmin">
      <svg viewBox="0 0 220 150" width="26vmin" height="18vmin" aria-hidden="true">
        <rect x="20" y="10" width="180" height="110" rx="8" fill="#1f6f8b"/>
        <rect x="30" y="20" width="160" height="90" rx="4" fill="#d7eef5"/>
        <rect x="95" y="120" width="30" height="12" fill="#444"/>
        <rect x="70" y="132" width="80" height="8" rx="2" fill="#444"/>
      </svg>
      ${isRevealed?`<div class="note">50 mm ＝ 5 cm（太短）<br>50 cm ≈ 半米（最接近）<br>5 m、5 km 都太長</div>`:""}
    </div>`;
  }
  if (key === "ribbon") {
    const mark = isRevealed ? `
      <rect x="20" y="28" width="500" height="16" rx="4" fill="#e07a5f"/>
      <text x="20" y="22" font-size="16" font-weight="700" fill="currentColor">絲帶 95 mm</text>
      <line x1="20" y1="62" x2="546" y2="62" stroke="#1f6f8b" stroke-width="3"/>
      <text x="250" y="82" font-size="15" font-weight="700" fill="currentColor">10 cm ＝ 100 mm（更長，不行）</text>
      <line x1="20" y1="100" x2="283" y2="100" stroke="#157a3a" stroke-width="6"/>
      <text x="20" y="122" font-size="15" font-weight="700" fill="currentColor">5 cm ＝ 50 mm（較短，可以）</text>`
      : `<rect x="20" y="50" width="500" height="22" rx="6" fill="#e07a5f"/><text x="20" y="40" font-size="18" font-weight="700" fill="currentColor">整條絲帶 95 mm</text>`;
    return `<svg class="ribbon" viewBox="0 0 580 140" style="max-height:22vmin">${mark}</svg>`;
  }
  if (key === "zeros") {
    if (!isRevealed) return `<div class="note" style="color:var(--muted)">提示：先把中文數寫成阿拉伯數字，再數「0」。</div>`;
    const rows = [["A","17 500","兩個 0"],["B","70 105","兩個 0"],["C","50 017","兩個 0"],["D","10 700","三個 0  ←"]];
    return `<div class="prods">${rows.map(r=>`<span>${r[0]}. ${r[1]}　${r[2]}</span>`).join("")}</div>`;
  }
  if (key === "cards00389") {
    return `<div class="cards">${["0","0","3","8","9"].map(n=>`<div class="ncard">${n}</div>`).join("")}</div>`;
  }
  if (key === "turtles") {
    return `<div class="turtles">${["57","25","71","52"].map(n=>`<div class="turtle"><div class="shell">${n}</div></div>`).join("")}</div>`;
  }
  if (key === "prods") {
    if (!isRevealed) return "";
    const rows = ["708 × 9 ＝ 6 372","809 × 7 ＝ 5 663　← 最小","709 × 8 ＝ 5 672","908 × 7 ＝ 6 356"];
    return `<div class="prods">${rows.map(r=>`<span>${r}</span>`).join("")}</div>`;
  }
  if (key === "times") {
    return `<div><div class="eq">25 × 8 × 8 ＝ ？</div>
      ${isRevealed?`<div class="eq-sub">25 × 8 ＝ 200（課數）　再 × 8 ＝ 1 600（題數）</div>`:""}</div>`;
  }
  if (key === "clock1137") {
    return `<div class="clocks">
      ${clockSVG(11,37)}
      <div>
        <div class="digital">11:37 p.m.</div>
        ${isRevealed?`<div class="eq-sub">到 12:00 還有 23 分</div>`:`<div class="eq-sub" style="color:var(--muted)">新一天從幾點開始？</div>`}
      </div>
    </div>`;
  }
  if (key === "minus26") {
    return `<div><div class="eq">下午 8 時 10 分　－　26 分鐘　＝　？</div>
      ${isRevealed?`<div class="eq-sub">8:10 → 8:00（減 10 分）→ 7:44（再減 16 分）</div>`:""}</div>`;
  }
  if (key === "crayons") {
    return `<svg class="ruler-svg" viewBox="0 0 860 220">
      ${crayon(30, 30, 700, "#43a047", "綠色")}
      ${crayon(30, 95, 650, "#ef6c00", "橙色")}
      ${ruler(30, 160, 800)}
    </svg>`;
  }
  if (key === "map") {
    return `<svg class="map" viewBox="0 0 900 280">
      ${node(80,140,"彬彬家","#5c6bc0")}
      ${node(340,140,"公園","#2e7d32")}
      ${node(620,60,"運動場","#00838f")}
      ${node(820,140,"商場","#c62828")}
      ${edge(140,140,280,140,"1 km")}
      ${edge(400,140,760,140,"4 km", isRevealed ? "#157a3a" : "#333")}
      ${edge(380,110,560,70,"3 km", isRevealed ? "#d97706" : "#333")}
      ${edge(680,70,800,115,"2 km", isRevealed ? "#d97706" : "#333")}
    </svg>`;
  }
  return "";
}

function clockSVG(h, m) {
  const cx=110, cy=110, r=100;
  const ha = ((h%12)+m/60)*30;
  const ma = m*6;
  const hx = cx + 50*Math.sin(ha*Math.PI/180);
  const hy = cy - 50*Math.cos(ha*Math.PI/180);
  const mx = cx + 70*Math.sin(ma*Math.PI/180);
  const my = cy - 70*Math.cos(ma*Math.PI/180);
  let ticks="";
  for (let k=0;k<12;k++){
    const a=k*30*Math.PI/180;
    ticks += `<line x1="${cx+88*Math.sin(a)}" y1="${cy-88*Math.cos(a)}" x2="${cx+96*Math.sin(a)}" y2="${cy-96*Math.cos(a)}" stroke="currentColor" stroke-width="3"/>`;
  }
  return `<svg class="clock-face" viewBox="0 0 220 220">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--card)" stroke="currentColor" stroke-width="6"/>
    ${ticks}
    <line x1="${cx}" y1="${cy}" x2="${hx}" y2="${hy}" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${mx}" y2="${my}" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="6" fill="currentColor"/>
  </svg>`;
}
function crayon(x,y,len,color,label){
  const h=44;
  return `<g>
    <rect x="${x}" y="${y}" width="${len}" height="${h}" rx="8" fill="${color}"/>
    <polygon points="${x+len},${y} ${x+len+28},${y+h/2} ${x+len},${y+h}" fill="${color}"/>
    <text x="${x+16}" y="${y+30}" font-size="22" font-weight="800" fill="#fff">${label}</text>
  </g>`;
}
function ruler(x,y,len){
  let t = `<g fill="currentColor">
    <rect x="${x}" y="${y}" width="${len}" height="36" rx="4" fill="#f3e6c8" stroke="#8a6d3b"/>`;
  for (let cm=0; cm<=8; cm++){
    const xx = x + cm*100;
    t += `<line x1="${xx}" y1="${y}" x2="${xx}" y2="${y+28}" stroke="#333" stroke-width="2"/>
          <text x="${xx+4}" y="${y+32}" font-size="14" font-weight="700">${cm}</text>`;
    if (cm<8){
      for (let mm=1;mm<10;mm++){
        const hh = mm===5?18:10;
        t += `<line x1="${xx+mm*10}" y1="${y}" x2="${xx+mm*10}" y2="${y+hh}" stroke="#333" stroke-width="1"/>`;
      }
    }
  }
  t += `<text x="${x+len-70}" y="${y+32}" font-size="14" font-weight="700">cm</text></g>`;
  return t;
}
function node(x,y,label,color){
  return `<g>
    <circle cx="${x}" cy="${y}" r="36" fill="${color}"/>
    <text x="${x}" y="${y+5}" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">${label}</text>
  </g>`;
}
function edge(x1,y1,x2,y2,label,color="#333"){
  const mx=(x1+x2)/2, my=(y1+y2)/2-12;
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="5"/>
    <text x="${mx}" y="${my}" text-anchor="middle" font-size="18" font-weight="800" fill="${color}">${label}</text>`;
}

function qBody(s) {
  if (s.kind === "mcq") {
    return `<div class="options${s.oneCol?" one-col":""}">` + s.options.map((opt,idx)=>{
      let cls = "opt";
      if (picked === idx) cls += " picked";
      if (revealed && idx === s.answer) cls += " correct";
      if (revealed && picked !== null && idx === picked && idx !== s.answer) cls += " wrong";
      return `<button class="${cls}" onclick="choose(${idx})"><span class="tag">${letters[idx]}</span><span>${opt}</span></button>`;
    }).join("") + `</div>`;
  }
  // fill: first two blanks of Q10 (time) stay on one row if only 2 and short labels
  return `<div class="blank-list">` + s.blanks.map(b => {
    const cell = (val) => `<span class="blank${revealed?" show":""}">${revealed?val:"　"}</span>`;
    const mid = b.answer2 ? `${cell(b.answer)}${b.mid||""}${cell(b.answer2)}${b.after}` : `${cell(b.answer)}${b.after}`;
    return `<div class="blank-row">${b.before}${mid}</div>`;
  }).join("") + `</div>`;
}

function explainBox(s) {
  let verdict = "";
  if (s.kind === "mcq" && picked !== null) {
    verdict = picked === s.answer
      ? `<div class="verdict ok">答對了！</div>`
      : `<div class="verdict no">再看一看，正確答案是 ${letters[s.answer]}。</div>`;
  }
  return `<aside class="explain">
      ${verdict}
      <h3>講解</h3>
      <ol>${s.explain.map(x=>`<li>${x}</li>`).join("")}</ol>
      <div class="last">${s.last}</div>
    </aside>`;
}

function render() {
  const app = document.getElementById("app");
  if (i < 0) {
    app.innerHTML = `
      <main>
        <div class="cover">
          <div class="brand" style="font-size:3vmin">3D 補充練習　錯題講解</div>
          <h1>女兒的數學練習</h1>
          <p>共 12 題，先自己想一想，再看答案和講解。</p>
          <button class="act" style="font-size:3.4vmin;padding:1.4vmin 4vmin;margin-top:2vmin" onclick="start()">開始練習</button>
          <div class="hint">快捷鍵：空白鍵開始　← → 換題　F 全螢幕　D 深色模式（適合關燈投影）</div>
        </div>
      </main>`;
    return;
  }
  if (i >= slides.length) {
    app.innerHTML = `
      <main>
        <div class="end">
          <h1>今天練完了！</h1>
          <p>如果還有不清楚的題，可以再走一遍。</p>
          <button class="act" style="font-size:3.2vmin;padding:1.4vmin 4vmin;margin-top:2vmin" onclick="start()">再練習一次</button>
        </div>
      </main>
      <footer class="bar">
        <button class="nav" onclick="i=slides.length-1;picked=null;revealed=false;render()">回上一題</button>
      </footer>`;
    return;
  }
  const s = slides[i];
  const vis = visualHTML(s.visual, revealed);
  app.innerHTML = `
    <header class="top">
      <div class="brand">女兒的數學練習</div>
      <div class="unit">${s.unit}</div>
      <div class="spacer"></div>
      <div class="progress">第 ${i+1} 題／共 ${slides.length} 題</div>
      <button class="icon" onclick="toggleDark()" title="深色模式">${dark?"淺色":"深色"}</button>
      <button class="icon" onclick="goFull()" title="全螢幕">全螢幕</button>
    </header>
    <main class="${revealed?"split":""}">
      <div class="col-q">
        <p class="prompt">${s.prompt}</p>
        <div class="visual">${vis}</div>
        ${qBody(s)}
      </div>
      ${revealed ? explainBox(s) : ""}
    </main>
    <footer class="bar">
      <button class="nav" ${i===0?"disabled":""} onclick="go(-1)">上一題</button>
      <div class="dots">${slides.map((_,k)=>`<span class="dot${k===i?" now":k<i?" done":""}"></span>`).join("")}</div>
      <button class="act${revealed?"":" ready"}" onclick="reveal()">${revealed?"已顯示答案":"顯示答案／講解"}</button>
      <button class="nav" onclick="go(1)">${i===slides.length-1?"完成":"下一題"}</button>
    </footer>`;
}

function start(){ i=0; picked=null; revealed=false; render(); }
function go(d){
  i = Math.min(slides.length, Math.max(0, i+d));
  picked=null; revealed=false; render();
}
function choose(idx){
  if (revealed) return;
  picked = idx;
  render();
}
function reveal(){ revealed = true; render(); }
function toggleDark(){
  dark = !dark;
  document.documentElement.classList.toggle("dark", dark);
  render();
}
function goFull(){
  const el = document.documentElement;
  if (!document.fullscreenElement) el.requestFullscreen?.();
  else document.exitFullscreen?.();
}

document.addEventListener("keydown", (e) => {
  if (e.key === "d" || e.key === "D") { toggleDark(); return; }
  if (e.key === "f" || e.key === "F") { goFull(); return; }
  if (i < 0) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); start(); } return; }
  if (i >= slides.length) { if (e.key === "ArrowLeft") { i=slides.length-1; picked=null; revealed=false; render(); } return; }
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(-1); }
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (!revealed) reveal(); else go(1); }
  else if (["1","2","3","4","a","b","c","d","A","B","C","D"].includes(e.key)) {
    const map = {a:0,b:1,c:2,d:3,A:0,B:1,C:2,D:3,"1":0,"2":1,"3":2,"4":3};
    const s = slides[i];
    if (s && s.kind === "mcq" && !revealed) choose(map[e.key]);
  }
});

function applyHash() {
  const h = (location.hash || "").replace("#","");
  picked = null;
  if (h === "dark") { dark = true; document.documentElement.classList.add("dark"); i = -1; revealed = false; }
  else if (!h || h === "cover") { i = -1; revealed = false; }
  else if (h === "end") { i = slides.length; revealed = false; }
  else {
    const m = h.match(/^(\d+)(r)?(d)?$/);
    if (m) {
      i = Math.max(0, Math.min(slides.length-1, parseInt(m[1], 10)-1));
      revealed = !!m[2];
      dark = !!m[3];
      document.documentElement.classList.toggle("dark", dark);
    }
  }
  render();
}
window.addEventListener("hashchange", applyHash);
applyHash();
</script>
</body>
</html>
