<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 常識第一次考試｜考前模擬卷</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"PingFang TC","Microsoft JhengHei",sans-serif;background:#eef3f8;color:#1d2b3a;touch-action:manipulation}
button,input,textarea{font-family:inherit;touch-action:manipulation}
button{cursor:pointer}
html{scroll-padding-top:12vh}
input,textarea{scroll-margin-top:12vh}
#app{display:flex;height:100%;gap:1.4vmin;padding:1.4vmin}
.col{background:#fff;border-radius:2vmin;box-shadow:0 .4vmin 1.2vmin rgba(0,0,0,.08);padding:2vmin 2.4vmin;overflow:auto;display:flex;flex-direction:column;min-width:0}
#left{flex:56}#right{flex:44}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:clamp(14px,2.5vmin,38px);color:#557;gap:1vmin;flex-wrap:wrap}
.tag{background:#dbeafe;color:#1e40af;border-radius:1vmin;padding:.25vmin 1.1vmin;font-weight:bold}
.tag.warn{background:#fee2e2;color:#b91c1c}
.tag.ok{background:#dcfce7;color:#166534}
.part{font-size:clamp(16px,3.2vmin,48px);font-weight:bold;margin:.4vmin 0;color:#0f3d7a}
.qno{font-size:clamp(18px,3.6vmin,54px);font-weight:bold;margin:.4vmin 0}
.qtext{font-size:clamp(17px,3.6vmin,54px);line-height:1.45}
.hint{font-size:clamp(13px,2.4vmin,36px);color:#667;margin:.6vmin 0}
.fig{margin:.8vmin 0;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:1vmin}
.fig svg{max-width:100%;height:auto;display:block}
.fig.small svg,.gitem svg{max-height:22vmin}
.cloze-line{font-size:clamp(17px,3.6vmin,54px);line-height:1.7;margin:.8vmin 0}
.blank{min-width:16vmin;min-height:max(3rem,7.5vmin);border:.4vmin solid #94a3b8;border-radius:1.2vmin;display:inline-flex;align-items:center;justify-content:center;padding:0 1.4vmin;background:#f8fafc;font-size:clamp(16px,3.6vmin,54px);font-weight:bold;color:#0f3d7a;vertical-align:middle;margin:0 .3vmin}
.blank.active{border-color:#2563eb;background:#dbeafe;box-shadow:0 0 0 .45vmin #93c5fd}
.blank.filled{background:#eff6ff;border-color:#2563eb}
.blank.ok{border-color:#16a34a;background:#dcfce7}
.blank.bad{border-color:#dc2626;background:#fee2e2}
.bank,.opts,.btns{display:flex;flex-wrap:wrap;gap:1.2vmin;margin-top:1vmin}
.bank button,.opt,.chip,.boxbtn,.judgebtn,.choicebtn{
  min-height:max(3rem,7vmin);min-width:12vmin;font-size:clamp(15px,3.2vmin,48px);
  border:.35vmin solid #94a3b8;border-radius:1.2vmin;background:#fff;padding:.4vmin 1.6vmin;font-weight:bold
}
.bank button.used,.opt.used{opacity:.4;background:#f1f5f9}
.bank button.sel,.opt.sel,.chip.sel,.boxbtn.sel,.choicebtn.sel{background:#2563eb;color:#fff;border-color:#2563eb}
.bank button.picked{background:#dbeafe;border-color:#2563eb}
.mc{display:flex;flex-direction:column;gap:1.2vmin}
.mc .opt,.choicebtn{text-align:left;width:100%}
.opt.right,.choicebtn.right,.judgebtn.right,.chip.right,.blank.right{background:#16a34a;color:#fff;border-color:#16a34a}
.opt.wrong,.choicebtn.wrong,.judgebtn.wrong,.chip.wrong{background:#dc2626;color:#fff;border-color:#dc2626}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:1.2vmin}
.gitem{border:.3vmin solid #e2e8f0;border-radius:1.4vmin;padding:1vmin;display:flex;flex-direction:column;gap:.6vmin;background:#f8fafc}
.gitem .gt{font-size:clamp(14px,2.8vmin,42px);line-height:1.35;font-weight:bold}
.jrow{display:flex;gap:1vmin}
.judgebtn{flex:1}
.match{display:flex;flex-direction:column;gap:1vmin}
.mrow{display:flex;align-items:center;gap:1vmin;font-size:clamp(15px,3vmin,46px)}
.slots{display:flex;align-items:center;gap:1vmin;flex-wrap:wrap;font-size:clamp(18px,3.6vmin,54px);font-weight:bold}
.arrow{color:#c2410c}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:1.2vmin;margin-top:1vmin}
.box{border:.4vmin dashed #94a3b8;border-radius:1.4vmin;min-height:20vmin;padding:1vmin;background:#f8fafc}
.box.active{border-color:#2563eb;background:#dbeafe;border-style:solid}
.box h3{margin:0 0 .6vmin;font-size:clamp(15px,3vmin,44px);text-align:center}
.box .inbox{display:flex;flex-wrap:wrap;gap:.6vmin;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:1vmin;margin:.8vmin 0}
.nav{display:flex;gap:1.1vmin;margin-top:1.4vmin;flex-wrap:wrap}
.nav button{flex:1;min-height:max(3rem,7vmin);font-size:clamp(15px,3.1vmin,46px);border:none;border-radius:1.2vmin;background:#cbd5e1;font-weight:bold;min-width:14vmin}
.nav .go{background:#2563eb;color:#fff}
.nav .sub{background:#ea580c;color:#fff}
.nav .again{background:#0f766e;color:#fff}
.res{font-size:clamp(14px,2.7vmin,40px);margin-top:1.2vmin;padding:1.1vmin 1.4vmin;border-radius:1.2vmin;line-height:1.5}
.res.ok{background:#dcfce7}
.res.bad{background:#fee2e2}
textarea,input[type=text]{width:100%;min-height:max(3rem,8vmin);font-size:clamp(16px,3.6vmin,52px);padding:1vmin 1.2vmin;border:.35vmin solid #94a3b8;border-radius:1.2vmin;resize:vertical}
.short-wrap{display:flex;flex-direction:column;gap:1vmin}
.need-space::after{content:"";display:block;height:50vh}
#ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:2vh 2vmin;z-index:9}
#ovb{background:#fff;border-radius:2vmin;padding:2vmin 2.4vmin;width:min(94vw,150vmin);max-height:94%;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:.5vmin;margin:.6vmin 0}
.grid button{min-height:max(2rem,4.6vmin);font-size:clamp(10px,1.7vmin,26px);border:.3vmin solid #94a3b8;border-radius:.8vmin;background:#fff;font-weight:bold;padding:0 .15vmin}
.grid .done{background:#bfdbfe}
.grid .g{background:#16a34a;color:#fff;border-color:#16a34a}
.grid .r{background:#dc2626;color:#fff;border-color:#dc2626}
.big{font-size:clamp(22px,5vmin,80px);font-weight:bold;color:#1d4ed8;text-align:center;margin:.2vmin 0}
.ovt{font-size:clamp(18px,4vmin,60px);font-weight:bold}
.ovp{font-size:clamp(14px,2.9vmin,44px);line-height:1.5}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:.6vmin 1.6vmin;font-size:clamp(14px,2.8vmin,42px);margin:1vmin 0}
.start-title{font-size:clamp(22px,4.6vmin,70px);font-weight:bold;color:#0f3d7a;line-height:1.3;margin:0 0 1vmin}
.start-lead{font-size:clamp(16px,3.2vmin,48px);line-height:1.5}
.hero{min-height:max(4rem,12vmin);font-size:clamp(20px,4.2vmin,64px);background:#2563eb;color:#fff;border:none;border-radius:1.6vmin;font-weight:bold;width:100%;margin-top:2vmin}
.score-parts{display:grid;grid-template-columns:1fr 1fr;gap:0 .8vmin;margin:.6vmin 0 1vmin}
.score-row{display:flex;justify-content:space-between;font-size:clamp(13px,2.4vmin,36px);padding:.25vmin .4vmin;border-bottom:.15vmin solid #e2e8f0}
.grid{margin:.8vmin 0 0}
@media (max-width:900px),(orientation:portrait){
  #app{flex-direction:column;height:auto;min-height:100%}
  #left,#right{flex:none}
  .ggrid,.boxes{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(5,1fr)}
}

.diag-row{display:flex;gap:.6vmin;flex-wrap:wrap;margin:0 0 .8vmin}
.diag-row .choicebtn{flex:1;min-width:9vmin;width:auto;text-align:center;font-size:clamp(14px,2.7vmin,40px);padding:.2vmin .6vmin}
.nav button:disabled{opacity:.45;cursor:default}
.ggrid{align-content:start}

</style>
</head>

var mode = "start";
var si = 0;
var t0 = 0, tFinish = 0, tLimitAt = 0, timerId = null, submitted = false;
var answers = {};
var results = {};
var partGot = {};
var totalGot = 0;
var ui = {blank:null, letter:null, left:null, item:null, slot:null};

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function jsq(s){return String(s==null?"":s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");}
function fig(id){return (id && FIGURES[id]) ? FIGURES[id] : "";}
function partOf(sc){var i,p=QUESTIONS.parts||[];for(i=0;i<p.length;i++)if(p[i].id===sc.part)return p[i];return {id:sc.part,name:"第"+sc.part+"部分",max:0};}
function letters(){return "ABCDEFGHIJKLMNOPQRSTUVWXYZ";}
function idxOf(opt, list){var i;for(i=0;i<list.length;i++)if(list[i]===opt)return i;return -1;}

function screenQids(sc){
  var a=[],i;
  if(sc.qid) a.push(sc.qid);
  if(sc.items) for(i=0;i<sc.items.length;i++) if(sc.items[i].qid) a.push(sc.items[i].qid);
  if(sc.lefts) for(i=0;i<sc.lefts.length;i++) a.push(sc.lefts[i].qid);
  return a;
}
function screenOfQid(qid){
  var i,s=QUESTIONS.screens;
  for(i=0;i<s.length;i++) if(screenQids(s[i]).indexOf(qid)>=0) return i;
  return 0;
}
function hasVal(v){
  if(v==null) return false;
  if(typeof v==="string") return v.replace(/\s+/g,"").length>0;
  if(Object.prototype.toString.call(v)==="[object Array]"){
    var i;for(i=1;i<v.length;i++) if(v[i]==null||v[i]==="") return false;
    return v[0]!=null;
  }
  return true;
}
function isQidAnswered(qid){
  if(qid==="7-1"){
    var v=answers[qid];
    return !!(v && v[1] && v[2] && v[3]);
  }
  return hasVal(answers[qid]);
}

function compact(s){return String(s==null?"":s).replace(/\s+/g,"");}
function findGroup(text, groups){
  var t=compact(text),g,k;
  if(!t) return null;
  for(g=0;g<groups.length;g++){
    for(k=0;k<groups[g].keys.length;k++){
      if(t.indexOf(compact(groups[g].keys[k]))>=0) return groups[g].id;
    }
  }
  return null;
}
function hitsReject(text, keys){
  var t=compact(text),i;
  if(!t||!keys) return false;
  for(i=0;i<keys.length;i++) if(keys[i] && t.indexOf(compact(keys[i]))>=0) return true;
  return false;
}
function gradeShortText(text, groups, rejectKeys, qid){
  var t=compact(text);
  if(!t) return {answered:false, ok:false, id:null};
  if(qid==="10-4"){
    if(t.indexOf(compact("隨便食用野生"))>=0) return {answered:true, ok:false, id:null};
    var hid=findGroup(text, groups);
    if(hid) return {answered:true, ok:true, id:hid};
    return {answered:true, ok:false, id:null};
  }
  if(hitsReject(text, rejectKeys)) return {answered:true, ok:false, id:null};
  var id=findGroup(text, groups);
  if(id) return {answered:true, ok:true, id:id};
  return {answered:true, ok:false, id:null};
}

function stemText(sc, qid){
  if(sc.type==="cloze_bank"){
    var i,it;for(i=0;i<sc.items.length;i++){it=sc.items[i];if(it.qid===qid) return it.before+"______"+it.after;}
  }
  if(sc.type==="diagram_choice"){
    var j,x;for(j=0;j<sc.items.length;j++){x=sc.items[j];if(x.qid===qid) return (sc.stem||"")+" "+x.label+" "+(x.hint||"");}
  }
  if(sc.type==="judge_group"){
    var k,y;for(k=0;k<sc.items.length;k++){y=sc.items[k];if(y.qid===qid) return (sc.stem||"")+" "+y.text;}
  }
  if(sc.type==="match"){
    var m,z;for(m=0;m<sc.lefts.length;m++){z=sc.lefts[m];if(z.qid===qid) return (sc.title||"")+" "+z.text;}
  }
  if(sc.type==="classify"){
    var n,w;for(n=0;n<sc.items.length;n++){w=sc.items[n];if(w.qid===qid) return (sc.title||"")+" "+w.key+" "+w.text;}
  }
  if(sc.type==="short_pair") return sc.stem||"";
  return sc.stem||sc.instruction||"";
}

function gradeAll(){
  results={}; partGot={}; totalGot=0;
  var i,p,sc;
  for(i=0;i<(QUESTIONS.parts||[]).length;i++){p=QUESTIONS.parts[i];partGot[p.id]=0;}
  for(i=0;i<QUESTIONS.screens.length;i++){
    sc=QUESTIONS.screens[i];
    if(sc.type==="cloze_bank") gradeCloze(sc);
    else if(sc.type==="diagram_choice") gradeDiagram(sc);
    else if(sc.type==="judge_group") gradeJudge(sc);
    else if(sc.type==="mc") gradeMc(sc, true);
    else if(sc.type==="mc_buttons") gradeMc(sc, false);
    else if(sc.type==="match") gradeMatch(sc);
    else if(sc.type==="order") gradeOrder(sc);
    else if(sc.type==="classify") gradeClass(sc);
    else if(sc.type==="short") gradeShort(sc);
    else if(sc.type==="short_pair") gradePair(sc);
  }
}
function put(qid, part, max, ok, answered, choice, picked, answer, text){
  var got = (ok && answered) ? max : 0;
  results[qid]={correct:!!(ok&&answered), answered:!!answered, score:got, max:max, choice:answered?choice:null, picked:answered?picked:null, answer:answer, text:text, part:part};
  if(got){partGot[part]=(partGot[part]||0)+got; totalGot+=got;}
}
function gradeCloze(sc){
  var i,it,val,ok;
  for(i=0;i<sc.items.length;i++){
    it=sc.items[i]; val=answers[it.qid];
    ok = hasVal(val) && String(val)===String(it.answer);
    put(it.qid, sc.part, it.score, ok, hasVal(val), hasVal(val)?val:null, hasVal(val)?val:null, it.answer, stemText(sc,it.qid));
  }
}
function gradeDiagram(sc){
  var i,it,val,ok;
  for(i=0;i<sc.items.length;i++){
    it=sc.items[i]; val=answers[it.qid];
    ok = hasVal(val) && val===it.answer;
    put(it.qid, sc.part, it.score, ok, hasVal(val), val, val, it.answer, stemText(sc,it.qid));
  }
}
function gradeJudge(sc){
  var i,it,val,ok;
  for(i=0;i<sc.items.length;i++){
    it=sc.items[i]; val=answers[it.qid];
    ok = hasVal(val) && val===it.answer;
    put(it.qid, sc.part, it.score, ok, hasVal(val), val, val, it.answer, stemText(sc,it.qid));
  }
}
function gradeMc(sc, withLetter){
  var val=answers[sc.qid], answered=hasVal(val), ok=false, choice=null, picked=null, ansText, idx, aidx;
  if(withLetter){
    aidx = letters().indexOf(sc.answer);
    ansText = sc.answer+". "+(sc.options[aidx]||"");
    if(answered){
      idx = letters().indexOf(val);
      choice = idx; picked = sc.options[idx]||val;
      ok = val===sc.answer;
    }
  }else{
    ansText = sc.answer;
    if(answered){
      idx = idxOf(val, sc.options);
      choice = idx; picked = val;
      ok = val===sc.answer;
    }
  }
  put(sc.qid, sc.part, sc.score, ok, answered, choice, picked, ansText, stemText(sc,sc.qid));
}
function gradeMatch(sc){
  var i,it,val,ok,ansMap={},r;
  for(i=0;i<sc.rights.length;i++) ansMap[sc.rights[i].key]=sc.rights[i].text;
  for(i=0;i<sc.lefts.length;i++){
    it=sc.lefts[i]; val=answers[it.qid];
    ok = hasVal(val) && val===it.answer;
    r = (it.answer||"")+" "+(ansMap[it.answer]||"");
    put(it.qid, sc.part, it.score, ok, hasVal(val), val, val, r, stemText(sc,it.qid));
  }
}
function gradeOrder(sc){
  var v=answers[sc.qid], answered=!!(v&&v[1]&&v[2]&&v[3]), ok=false, joined=null, ans=sc.answer.join("|");
  if(answered){
    joined=v.join("|");
    ok = v[0]===sc.answer[0]&&v[1]===sc.answer[1]&&v[2]===sc.answer[2]&&v[3]===sc.answer[3];
  }
  put(sc.qid, sc.part, sc.score, ok, answered, joined, joined, ans, sc.stem);
}
function boxLabel(sc, id){
  var i;for(i=0;i<sc.boxes.length;i++) if(sc.boxes[i].id===id) return sc.boxes[i].label;
  return id;
}
function gradeClass(sc){
  var i,it,val,ok;
  for(i=0;i<sc.items.length;i++){
    it=sc.items[i]; val=answers[it.qid];
    ok = hasVal(val) && val===it.answer;
    put(it.qid, sc.part, it.score, ok, hasVal(val), val, hasVal(val)?boxLabel(sc,val):null, boxLabel(sc,it.answer), stemText(sc,it.qid));
  }
}
function gradeShort(sc){
  var val=answers[sc.qid], g=gradeShortText(val, sc.acceptGroups, sc.rejectKeys, sc.qid);
  put(sc.qid, sc.part, sc.score, g.ok, g.answered, g.answered?val:null, g.answered?val:null, sc.sample, sc.stem);
}
function gradePair(sc){
  var a=gradeShortText(answers[sc.items[0].qid], sc.acceptGroups, sc.rejectKeys, sc.items[0].qid);
  var b=gradeShortText(answers[sc.items[1].qid], sc.acceptGroups, sc.rejectKeys, sc.items[1].qid);
  if(sc.distinct && a.ok && b.ok && a.id && a.id===b.id) b.ok=false;
  put(sc.items[0].qid, sc.part, sc.items[0].score, a.ok, a.answered, a.answered?answers[sc.items[0].qid]:null, a.answered?answers[sc.items[0].qid]:null, sc.sample, sc.stem);
  put(sc.items[1].qid, sc.part, sc.items[1].score, b.ok, b.answered, b.answered?answers[sc.items[1].qid]:null, b.answered?answers[sc.items[1].qid]:null, sc.sample, sc.stem);
}

function reportAll(){
  var i,qid,r;
  for(i=0;i<QUESTIONS.qids.length;i++){
    qid=QUESTIONS.qids[i]; r=results[qid]||{};
    elhReport({
      type:"answer",
      q:qid,
      choice: r.answered ? r.choice : null,
      correct: !!r.correct,
      text: elhText(r.text),
      picked: r.answered ? r.picked : null,
      answer: elhText(r.answer)
    });
  }
}

function remainMs(){return Math.max(0, tLimitAt-Date.now());}
function remainText(){
  var s=Math.ceil(remainMs()/1000), m=Math.floor(s/60); s=s%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function usedMin(){
  var end = submitted?tFinish:Date.now();
  return Math.max(1, Math.round((end-t0)/60000));
}
function tick(){
  if(submitted||mode==="start") return;
  if(Date.now()>=tLimitAt){ doSubmit(true); return; }
  var el=$("timer");
  if(el){
    el.textContent="剩餘 "+remainText();
    if(remainMs()<=5*60*1000) el.classList.add("warn");
    else el.classList.remove("warn");
  }
}

function startExam(){
  answers={}; results={}; partGot={}; totalGot=0; submitted=false;
  ui={blank:null, letter:null, left:null, item:null, slot:null};
  mode="exam"; si=0;
  t0=Date.now(); tFinish=0;
  tLimitAt=t0+((QUESTIONS.timeLimitSec||3600)*1000);
  if(timerId) clearInterval(timerId);
  timerId=setInterval(tick,400);
  closeOv();
  render();
}
function restart(){
  if(timerId){clearInterval(timerId);timerId=null;}
  answers={}; results={}; partGot={}; totalGot=0; submitted=false;
  ui={blank:null, letter:null, left:null, item:null, slot:null};
  mode="start"; si=0; t0=0; tFinish=0; tLimitAt=0;
  closeOv();
  render();
}

function unansweredCount(){
  var i,n=0,qid;
  for(i=0;i<QUESTIONS.qids.length;i++){
    qid=QUESTIONS.qids[i];
    if(!isQidAnswered(qid)) n++;
  }
  return n;
}
function askSubmit(){
  if(submitted){showScore();return;}
  var un=unansweredCount();
  openOv('<div class="ovt">確定交卷？</div><div class="ovp">'+(un?('還有 <b>'+un+'</b> 格未作答。'):'全部題目已作答。')+'交卷後會顯示分數和答案，不能再修改。</div><div class="nav"><button onclick="closeOv()">返回檢查</button><button class="sub" onclick="doSubmit(true)">確定交卷</button></div>');
}
function doSubmit(ok){
  if(!ok||submitted) return;
  submitted=true; tFinish=Date.now();
  if(timerId){clearInterval(timerId);timerId=null;}
  gradeAll();
  reportAll();
  mode="review";
  showScore();
  render();
}

function showScore(){
  var h='<div class="ovt">成績</div><div class="big">'+Math.round(totalGot)+' / 100 分</div>';
  h+='<div class="ovp" style="text-align:center">用時約 '+usedMin()+' 分鐘'+(tFinish && tFinish-t0>=((QUESTIONS.timeLimitSec||3600)*1000-1000)?'（時間到，已自動交卷）':'')+'</div>';
  h+='<div class="score-parts">';
  var i,p;
  for(i=0;i<(QUESTIONS.parts||[]).length;i++){
    p=QUESTIONS.parts[i];
    h+='<div class="score-row"><span>'+esc(p.name)+'</span><span>'+(partGot[p.id]||0)+' / '+p.max+' 分</span></div>';
  }
  h+='</div>';
  h+='<div class="nav"><button class="go" onclick="closeOv();mode=&quot;review&quot;;render()">逐題覆核</button><button class="again" onclick="restart()">再做一次</button></div>';
  h+='<div class="hint">點題號可覆核該題（綠色＝得分，紅色＝未得分）</div>';
  h+=gridHtml();
  openOv(h);
}
function gridHtml(){
  var h='<div class="grid">',i,qid,r,cls,sc,lab;
  for(i=0;i<QUESTIONS.qids.length;i++){
    qid=QUESTIONS.qids[i];
    r=results[qid];
    cls = submitted ? (r&&r.correct?'g':'r') : (isQidAnswered(qid)?'done':'');
    lab=qid.replace(/^.*-/,'');
    if(qid.length<=4) lab=qid;
    h+='<button class="'+cls+'" onclick="jumpQid(\''+qid+'\')">'+esc(qid)+'</button>';
  }
  return h+'</div>';
}
function jumpQid(qid){
  si=screenOfQid(qid);
  if(submitted) mode="review";
  closeOv();
  render();
}
function showGrid(){
  openOv('<div class="ovt">題目一覽</div><div class="ovp">'+(submitted?'綠色＝得分，紅色＝未得分。點題號查看。':'藍色＝已作答。點題號跳到該題。')+'</div>'+gridHtml()+'<div class="nav"><button onclick="closeOv()">關閉</button>'+(submitted?'<button class="again" onclick="restart()">再做一次</button>':'')+'</div>');
}
function openOv(html){$("ovb").innerHTML=html;$("ov").style.display="flex";}
function closeOv(){$("ov").style.display="none";$("ovb").innerHTML="";}
function go(d){
  var n=si+d;
  if(n<0) return;
  if(n>=QUESTIONS.screens.length){ if(!submitted) askSubmit(); return; }
  ui={blank:null, letter:null, left:null, item:null, slot:null};
  si=n; render();
}

function usedWords(shared, exceptQid){
  var map={},i,j,sc,it,v;
  for(i=0;i<QUESTIONS.screens.length;i++){
    sc=QUESTIONS.screens[i];
    if(sc.bankShared!==shared||!sc.items) continue;
    for(j=0;j<sc.items.length;j++){
      it=sc.items[j]; v=answers[it.qid];
      if(it.qid!==exceptQid && hasVal(v)) map[v]=it.qid;
    }
  }
  return map;
}
function setBlank(qid, word, shared){
  var map=usedWords(shared, qid), other=map[word];
  if(other) answers[other]="";
  answers[qid]=word;
  ui.blank=qid;
  render();
}
function clearBlank(qid){answers[qid]=""; render();}

function renderStart(){
  var left=$("left"), right=$("right"), i,p,h;
  left.innerHTML='<div class="start-title">'+esc(QUESTIONS.title||"3D 常識第一次考試｜考前模擬卷")+'</div>'+
    '<div class="start-lead">這是一份考前模擬卷，共十部分，滿分 100 分，時限 60 分鐘。<br>作答期間不會顯示對錯。交卷後（或時間到）才會公布總分、各部分得分，並可逐題覆核。<br>可以提前交卷。準備好後，請按右邊的「開始作答」。計時會由按下該按鈕時開始。</div>'+
    '<div class="hint" style="margin-top:1.4vmin">各部分佔分</div><div class="parts">'+
    (QUESTIONS.parts||[]).map(function(p){return '<div>'+esc(p.name)+' '+p.max+'%</div>';}).join("")+
    '</div>';
  right.innerHTML='<div class="hint">適用於小三課堂投屏。開始後請專心作答。</div>'+
    '<button class="hero" type="button" onclick="startExam()">開始作答</button>';
}

function metaHtml(sc){
  var p=partOf(sc);
  var t = (mode!=="start" && !submitted) ? '<span class="tag" id="timer">剩餘 '+remainText()+'</span>' : (submitted?'<span class="tag ok">已交卷</span>':'');
  return '<div class="meta"><span class="tag">'+esc(p.name)+'</span><span>第 '+(si+1)+' / '+QUESTIONS.screens.length+' 屏</span>'+t+'</div>';
}
function navHtml(extraClass){
  var last = si>=QUESTIONS.screens.length-1;
  var nextLabel = (!submitted && last) ? "交卷" : "下一題";
  var again = submitted ? '<button class="again" type="button" onclick="restart()">再做一次</button>' : '';
  var sub = submitted ? '<button type="button" onclick="showScore()">看成績</button>' : '<button class="sub" type="button" onclick="askSubmit()">交卷</button>';
  return '<div class="nav '+(extraClass||"")+'">'+
    '<button type="button" onclick="go(-1)"'+(si===0?" disabled":"")+'>上一題</button>'+
    '<button class="go" type="button" onclick="go(1)">'+nextLabel+'</button>'+
    '<button type="button" onclick="showGrid()">題目一覽</button>'+sub+again+
    '</div>';
}
function reviewBox(qid, extra){
  if(!submitted) return "";
  var r=results[qid]; if(!r) return "";
  var cls=r.correct?"ok":"bad";
  var msg=r.correct?"正確，得 "+r.score+" 分。":("未得分。"+(r.answered?"":"（未作答）"));
  return '<div class="res '+cls+'">'+msg+" 正確答案："+esc(r.answer)+(extra?("<br>"+extra):"")+"</div>";
}

function renderExam(){
  var sc=QUESTIONS.screens[si];
  var left=$("left"), right=$("right");
  ui._keep = {blank:ui.blank, letter:ui.letter, left:ui.left, item:ui.item, slot:ui.slot};
  left.innerHTML=""; right.innerHTML="";
  left.insertAdjacentHTML("beforeend", metaHtml(sc));
  left.insertAdjacentHTML("beforeend", '<div class="part">'+esc(partOf(sc).name)+"</div>");
  if(sc.instruction) left.insertAdjacentHTML("beforeend", '<div class="hint">'+esc(sc.instruction)+"</div>");
  var fn = {
    cloze_bank: renderCloze,
    diagram_choice: renderDiagram,
    judge_group: renderJudge,
    mc: renderMc,
    mc_buttons: renderButtons,
    match: renderMatch,
    order: renderOrder,
    classify: renderClass,
    short: renderShort,
    short_pair: renderPair
  }[sc.type];
  if(fn) fn(sc,left,right);
  else right.insertAdjacentHTML("beforeend","<div class='hint'>未知題型</div>");
}

function renderCloze(sc,left,right){
  var i,it,html="",act,used,cls,revAll="";
  if(sc.fig) left.insertAdjacentHTML("beforeend", '<div class="fig">'+fig(sc.fig)+"</div>");
  if(sc.items.length===1 && !sc.fig){
    it=sc.items[0];
    left.insertAdjacentHTML("beforeend", '<div class="qno">'+esc(it.qid)+"</div>");
  }
  for(i=0;i<sc.items.length;i++){
    it=sc.items[i];
    if(!ui.blank && sc.items.length===1) ui.blank=it.qid;
    act = (ui.blank===it.qid);
    cls="blank"+(hasVal(answers[it.qid])?" filled":"")+(act?" active":"")+(submitted?(results[it.qid]&&results[it.qid].correct?" ok":" bad"):"");
    html+='<div class="cloze-line">'+esc(it.before)+
      '<button type="button" class="'+cls+'" onclick="onBlank(\''+it.qid+'\')">'+(hasVal(answers[it.qid])?esc(answers[it.qid]):"　　")+"</button>"+
      esc(it.after)+"</div>";
    if(submitted) revAll+=reviewBox(it.qid, it.review||sc.review||"");
  }
  left.insertAdjacentHTML("beforeend", html+revAll);
  used=usedWords(sc.bankShared, null);
  var bh='<div class="hint">字庫（點選填入橫線，可改填）</div><div class="bank">';
  for(i=0;i<sc.bank.length;i++){
    var w=sc.bank[i], isUsed=!!used[w], isSel=ui.letter===w;
    bh+='<button type="button" class="'+(isUsed?"used ":"")+(isSel?"sel ":"")+'" onclick="onBankWord(\''+jsq(sc.bankShared)+'\',\''+jsq(w)+'\')">'+esc(w)+"</button>";
  }
  bh+="</div>";
  right.insertAdjacentHTML("beforeend", bh+navHtml());
}
function onBlank(qid){
  if(submitted) return;
  if(ui.letter){
    var sc=QUESTIONS.screens[si];
    setBlank(qid, ui.letter, sc.bankShared);
    ui.letter=null;
    return;
  }
  if(ui.blank===qid && hasVal(answers[qid])){ clearBlank(qid); return; }
  ui.blank=qid; render();
}
function onBankWord(shared, word){
  if(submitted) return;
  var q = ui.blank;
  if(!q){
    var sc=QUESTIONS.screens[si], i;
    if(sc.items && sc.items.length===1) q=sc.items[0].qid;
  }
  if(q){ setBlank(q, word, shared); ui.letter=null; return; }
  ui.letter=word; render();
}

function renderDiagram(sc,left,right){
  left.insertAdjacentHTML("beforeend", '<div class="qtext">'+esc(sc.stem||"")+"</div>");
  left.insertAdjacentHTML("beforeend", '<div class="fig">'+fig(sc.fig)+"</div>");
  var h="",i,j,it,val,cls,rev="";
  for(i=0;i<sc.items.length;i++){
    it=sc.items[i]; val=answers[it.qid];
    h+='<div class="hint" style="margin-top:.4vmin"><b>'+esc(it.label)+"</b>　"+esc(it.hint||"")+"</div><div class='diag-row'>";
    for(j=0;j<sc.choices.length;j++){
      cls="choicebtn"+(val===sc.choices[j]?" sel":"")+(submitted&&sc.choices[j]===it.answer?" right":"")+(submitted&&val===sc.choices[j]&&val!==it.answer?" wrong":"");
      h+='<button type="button" class="'+cls+'" onclick="pickVal(\''+it.qid+'\',\''+jsq(sc.choices[j])+'\')">'+esc(sc.choices[j])+"</button>";
    }
    h+="</div>";
    if(submitted) rev+=reviewBox(it.qid, it.review||"");

  right.insertAdjacentHTML("beforeend", navHtml()+h+rev);

function pickVal(qid, val){
  if(submitted) return;
  answers[qid]=val; render();
}

function renderJudge(sc,left,right){

    h+='<div class="gitem"><div class="fig small">'+fig(it.fig)+'</div><div class="gt">'+esc(it.text)+'</div><div class="jrow">'+
      '<button type="button" class="'+c1+'" onclick="pickVal(\''+it.qid+'\',\'✓\')">✓</button>'+
      '<button type="button" class="'+c2+'" onclick="pickVal(\''+it.qid+'\',\'✗\')">✗</button></div></div>';
  }

  if(submitted) for(i=0;i<sc.items.length;i++) rev+=reviewBox(sc.items[i].qid, sc.items[i].review||"");

function renderMc(sc,left,right){

function renderButtons(sc,left,right){

  left.insertAdjacentHTML("beforeend", '<div class="qno">'+esc(sc.qid)+"</div><div class='qtext'>"+esc(sc.stem)+"</div>");

  for(i=0;i<sc.options.length;i++){

  }
  h+="</div>"+(submitted?reviewBox(sc.qid, sc.review||""):"")+navHtml();
  right.insertAdjacentHTML("beforeend", h);
}

function renderMatch(sc,left,right){
  left.insertAdjacentHTML("beforeend", '<div class="qtext">'+esc(sc.title||"")+"</div>");
  var h='<div class="match">',i,it,val,cls;
  for(i=0;i<sc.lefts.length;i++){
    it=sc.lefts[i]; val=answers[it.qid];
    cls="blank"+(hasVal(val)?" filled":"")+(ui.left===it.qid?" active":"")+(submitted?(results[it.qid]&&results[it.qid].correct?" ok":" bad"):"");
    h+='<div class="mrow"><div style="flex:1">'+esc((i+1)+". "+it.text)+'</div>'+
      '<button type="button" class="'+cls+'" onclick="onMatchLeft(\''+it.qid+'\')">'+(hasVal(val)?esc(val):"　　")+"</button></div>";
  }
  h+="</div>";
  if(submitted){
    var rev=sc.review?'<div class="res ok">'+esc(sc.review)+"</div>":"";
    for(i=0;i<sc.lefts.length;i++) rev+=reviewBox(sc.lefts[i].qid,"");
    h+=rev;
  }
  left.insertAdjacentHTML("beforeend", h);
  var used={}, rh='<div class="hint">選項（先點字母，再點橫線；或先點橫線再點字母）</div><div class="btns">';
  for(i=0;i<sc.lefts.length;i++) if(hasVal(answers[sc.lefts[i].qid])) used[answers[sc.lefts[i].qid]]=sc.lefts[i].qid;
  for(i=0;i<sc.rights.length;i++){
    var k=sc.rights[i].key;
    cls="opt"+(ui.letter===k?" sel":"")+(used[k]?" used":"")+(submitted&&false?"":"");
    rh+='<button type="button" class="'+cls+'" onclick="onMatchLetter(\''+k+'\')"><b>'+esc(k)+"</b>　"+esc(sc.rights[i].text)+"</button>";
  }
  rh+="</div>"+navHtml();
  right.insertAdjacentHTML("beforeend", rh);

function onMatchLeft(qid){
  if(submitted) return;
  if(ui.letter){
    assignMatch(qid, ui.letter); ui.letter=null; ui.left=null; render(); return;
  }
  if(ui.left===qid && hasVal(answers[qid])){ answers[qid]=""; ui.left=null; render(); return; }
  ui.left=qid; render();
}
function onMatchLetter(k){
  if(submitted) return;
  if(ui.left){ assignMatch(ui.left, k); ui.left=null; ui.letter=null; render(); return; }
  ui.letter = (ui.letter===k?null:k); render();
}
function assignMatch(qid, k){
  var sc=QUESTIONS.screens[si], i,it;
  for(i=0;i<sc.lefts.length;i++){
    it=sc.lefts[i];
    if(it.qid!==qid && answers[it.qid]===k) answers[it.qid]="";
  }
  answers[qid]=k;
}

function renderOrder(sc,left,right){
  left.insertAdjacentHTML("beforeend", '<div class="qtext">'+esc(sc.stem)+"</div>");
  if(sc.fig) left.insertAdjacentHTML("beforeend", '<div class="fig">'+fig(sc.fig)+"</div>");
  if(!answers[sc.qid]) answers[sc.qid]=sc.preset.slice();
  var v=answers[sc.qid], h='<div class="slots">',i,cls;
  for(i=0;i<4;i++){
    if(i) h+='<span class="arrow">→</span>';
    cls="blank"+(v[i]?" filled":"")+(ui.slot===i?" active":"")+(i===0?" locked":"")+(submitted?(results[sc.qid]&&results[sc.qid].correct?" ok":" bad"):"");
    if(i===0) h+='<span class="'+cls+'">'+esc(v[0]||"B")+"</span>";
    else h+='<button type="button" class="'+cls+'" onclick="onSlot('+i+')">'+(v[i]?esc(v[i]):"　")+"</button>";
  }
  h+="</div>";
  if(submitted) h+=reviewBox(sc.qid, sc.review||"");
  left.insertAdjacentHTML("beforeend", h);
  var used={}, rh='<div class="hint">點選空位，再點字母（第一步 B 已鎖定）</div><div class="btns">';
  for(i=1;i<4;i++) if(v[i]) used[v[i]]=i;
  var keys=["A","C","D"], kk, step;
  for(i=0;i<keys.length;i++){
    kk=keys[i];
    step=null; for(var s=0;s<sc.steps.length;s++) if(sc.steps[s].key===kk) step=sc.steps[s];
    cls="opt"+(ui.letter===kk?" sel":"")+(used[kk]?" used":"");
    rh+='<button type="button" class="'+cls+'" onclick="onOrderLetter(\''+kk+'\')"><b>'+kk+"</b>　"+esc(step?step.text:"")+"</button>";
  }
  // also show B as reference (locked)
  var bstep=null; for(i=0;i<sc.steps.length;i++) if(sc.steps[i].key==="B") bstep=sc.steps[i];
  rh+='<button type="button" class="opt used" disabled><b>B</b>　'+esc(bstep?bstep.text:"")+"（已鎖定）</button>";
  rh+="</div>"+navHtml();
  right.insertAdjacentHTML("beforeend", rh);
}
function onSlot(i){
  if(submitted||i===0) return;
  var qid=QUESTIONS.screens[si].qid;
  if(!answers[qid]) answers[qid]=QUESTIONS.screens[si].preset.slice();
  if(ui.letter){ assignSlot(i, ui.letter); ui.letter=null; ui.slot=null; render(); return; }
  if(ui.slot===i && answers[qid][i]){ answers[qid][i]=null; ui.slot=null; render(); return; }
  ui.slot=i; render();
}
function onOrderLetter(k){
  if(submitted) return;
  if(ui.slot!=null){ assignSlot(ui.slot, k); ui.slot=null; ui.letter=null; render(); return; }
  ui.letter=(ui.letter===k?null:k); render();
}
function assignSlot(i,k){
  var qid=QUESTIONS.screens[si].qid, v=answers[qid], j;
  for(j=1;j<4;j++) if(j!==i && v[j]===k) v[j]=null;
  v[i]=k;
}

function renderClass(sc,left,right){
  left.insertAdjacentHTML("beforeend", '<div class="qtext">'+esc(sc.title||"")+"</div>");
  var chips='<div class="chips">',i,it,val,cls, inBox={};
  for(i=0;i<sc.items.length;i++){
    it=sc.items[i]; val=answers[it.qid];
    if(val) inBox[val]=inBox[val]||[];
    if(val) inBox[val].push(it);
    cls="chip"+(ui.item===it.qid?" sel":"")+(val?" used":"");
    chips+='<button type="button" class="'+cls+'" onclick="onClassItem(\''+it.qid+'\')">'+
      '<div class="fig small">'+fig(it.fig)+'</div>'+esc(it.key+" "+it.text)+"</button>";
  }
  chips+="</div>";
  left.insertAdjacentHTML("beforeend", chips);
  if(submitted){
    var rev=""; for(i=0;i<sc.items.length;i++) rev+=reviewBox(sc.items[i].qid,"");
    left.insertAdjacentHTML("beforeend", (sc.review?'<div class="res ok">'+esc(sc.review)+"</div>":"")+rev);
  }
  var bh='<div class="hint">先點選字母，再點所屬分類箱。可更改。</div><div class="boxes">',b,list,j;
  for(i=0;i<sc.boxes.length;i++){
    b=sc.boxes[i]; list=inBox[b.id]||[];
    bh+='<div class="box'+(ui.item?" active":"")+'" onclick="onClassBox(\''+b.id+'\')"><h3>'+esc(b.label)+"</h3><div class='inbox'>";
    for(j=0;j<list.length;j++) bh+='<span class="chip sel">'+esc(list[j].key+" "+list[j].text)+"</span>";
    bh+="</div></div>";
  }
  bh+="</div>"+navHtml();
  right.insertAdjacentHTML("beforeend", bh);
}
function onClassItem(qid){
  if(submitted) return;
  if(ui.item===qid && hasVal(answers[qid])){ answers[qid]=""; ui.item=null; render(); return; }
  ui.item=qid; render();
}
function onClassBox(boxId){
  if(submitted) return;
  if(!ui.item) return;
  answers[ui.item]=boxId; ui.item=null; render();
}

function renderShort(sc,left,right){
  left.insertAdjacentHTML("beforeend", '<div class="qno">'+esc(sc.qid)+'</div><div class="qtext">'+esc(sc.stem)+"</div>");
  if(submitted) left.insertAdjacentHTML("beforeend", reviewBox(sc.qid, sc.review||"")+'<div class="res ok">示範答案：'+esc(sc.sample)+"</div>");
  var v=answers[sc.qid]||"";
  right.innerHTML='<div class="short-wrap need-space"><div class="hint">請用完整句子或短句作答。</div>'+
    '<textarea id="sa" inputmode="text" '+(submitted?"readonly":"")+' oninput="onShortInput(\''+sc.qid+'\',this.value)">'+esc(v)+"</textarea>"+
    navHtml()+"</div>";
}
function renderPair(sc,left,right){
  left.insertAdjacentHTML("beforeend", '<div class="qtext">'+esc(sc.stem)+"</div>"+(sc.instruction?'<div class="hint">'+esc(sc.instruction)+"</div>":""));
  if(submitted){
    left.insertAdjacentHTML("beforeend", reviewBox(sc.items[0].qid,"")+reviewBox(sc.items[1].qid,"")+'<div class="res ok">示範答案：'+esc(sc.sample)+(sc.review?("<br>"+esc(sc.review)):"")+"</div>");
  }
  var a=answers[sc.items[0].qid]||"", b=answers[sc.items[1].qid]||"";
  right.innerHTML='<div class="short-wrap need-space"><div class="hint">'+esc(sc.items[0].label)+'</div>'+
    '<textarea id="sa1" inputmode="text" '+(submitted?"readonly":"")+' oninput="onShortInput(\''+sc.items[0].qid+'\',this.value)">'+esc(a)+"</textarea>"+
    '<div class="hint">'+esc(sc.items[1].label)+'</div>'+
    '<textarea id="sa2" inputmode="text" '+(submitted?"readonly":"")+' oninput="onShortInput(\''+sc.items[1].qid+'\',this.value)">'+esc(b)+"</textarea>"+
    navHtml()+"</div>";
}
function onShortInput(qid, val){ answers[qid]=val; }

function render(){
  if(mode==="start") renderStart();
  else renderExam();
}

document.addEventListener("focusin",function(e){
  var el=e.target;
  if(el.matches && el.matches("input,textarea")) setTimeout(function(){el.scrollIntoView({block:"start",behavior:"smooth"});},150);
});
$("ov").addEventListener("click",function(e){ if(e.target===$("ov") && submitted) closeOv(); });

elhReport({type:"init", total:67});
render();

</script>
