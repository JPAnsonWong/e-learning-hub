<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 英文聆聽模擬練習（兩篇）</title>
<style>
  :root {
    --bg: #f3f0ea;
    --ink: #1c2430;
    --muted: #5a6573;
    --card: #fffdf8;
    --line: #e2d8c8;
    --accent: #1f6f8b;
    --accent-soft: #e6f4f8;
    --good: #157a3a;
    --good-bg: #dff6e8;
    --bad: #b42318;
    --bad-bg: #fde8e6;
    --shadow: 0 10px 30px rgba(28,36,48,.08);
    --btn: #1f6f8b;
    --btn-ink: #fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.5;
    padding: 1.2rem 1.2rem 2rem;
  }
  h1, h2, h3 { line-height: 1.25; margin: 0 0 .6rem; }
  h1 { font-size: clamp(1.25rem, 3.2vmin, 1.85rem); }
  h2 { font-size: clamp(1.1rem, 2.6vmin, 1.45rem); color: var(--accent); }
  p { margin: 0 0 .75rem; }
  button, input[type="text"] { font-family: inherit; }
  button {
    cursor: pointer;
    border: 0;
    border-radius: .8rem;
    min-height: 3rem;
    min-width: 3rem;
    padding: .6rem 1.15rem;
    font-size: 1.05rem;
    font-weight: 700;
    background: var(--btn);
    color: var(--btn-ink);
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.secondary {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
  }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button.danger { background: #8f1d18; }
  .wrap { max-width: 58rem; margin: 0 auto; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 1.1rem;
    box-shadow: var(--shadow);
    padding: 1.1rem 1.2rem;
    margin-bottom: 1rem;
  }
  .muted { color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: .7rem; align-items: center; }
  .paper-pick {
    display: grid;
    gap: .9rem;
    grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
  }
  .paper-pick button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 1.1rem 1.2rem;
    background: var(--card);
    color: var(--ink);
    border: 2px solid var(--line);
  }
  .paper-pick button strong { display: block; font-size: 1.25rem; color: var(--accent); margin-bottom: .25rem; }
  .paper-pick button span { display: block; font-weight: 500; color: var(--muted); }
  .note {
    background: var(--accent-soft);
    border-radius: .8rem;
    padding: .8rem 1rem;
    margin: .8rem 0;
  }
  .status {
    position: sticky;
    top: 0;
    z-index: 5;
    background: #173f50;
    color: #fff;
    border-radius: .9rem;
    padding: .8rem 1rem;
    margin-bottom: 1rem;
    display: flex;
    flex-wrap: wrap;
    gap: .6rem 1rem;
    align-items: center;
    justify-content: space-between;
  }
  .status .now { font-weight: 800; }
  .part { margin: 1.4rem 0 1.8rem; }
  .q {
    border: 1px solid var(--line);
    border-radius: .9rem;
    padding: .85rem 1rem;
    margin: .7rem 0;
    background: #fff;
  }
  .q.on { outline: 3px solid #f0b429; }
  .q .qn { font-weight: 800; margin-bottom: .45rem; }
  .opts { display: grid; gap: .45rem; }
  label.opt {
    display: flex;
    gap: .65rem;
    align-items: flex-start;
    padding: .55rem .7rem;
    border: 1px solid var(--line);
    border-radius: .7rem;
    min-height: 3rem;
    cursor: pointer;
  }
  label.opt:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  label.opt input { width: 1.2rem; height: 1.2rem; margin-top: .25rem; flex: 0 0 auto; }
  .pics { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); }
  .pic-opt {
    border: 2px solid var(--line);
    border-radius: .8rem;
    padding: .45rem;
    text-align: center;
    cursor: pointer;
    background: #fff;
  }
  .pic-opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .pic-opt svg { width: 100%; height: auto; display: block; }
  .pic-opt .cap { font-weight: 700; margin: .3rem 0 .15rem; }
  .blank {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem .7rem;
    align-items: center;
    margin: .35rem 0;
  }
  .blank input[type="text"] {
    min-height: 3rem;
    min-width: 9rem;
    flex: 1;
    font-size: 1.15rem;
    padding: .4rem .7rem;
    border: 1px solid var(--line);
    border-radius: .6rem;
  }
  .hint { font-size: .92rem; color: var(--muted); }
  .score-box { text-align: center; padding: 1rem .5rem; }
  .score-box .big { font-size: clamp(2rem, 7vmin, 3.4rem); font-weight: 800; color: var(--accent); }
  .breakdown { display: grid; gap: .5rem; margin: 1rem 0; }
  .breakdown div {
    display: flex; justify-content: space-between; gap: 1rem;
    padding: .55rem .8rem; border-radius: .6rem; background: #f7f3ec;
  }
  .ok { color: var(--good); font-weight: 800; }
  .no { color: var(--bad); font-weight: 800; }
  .script {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: .8rem;
    padding: 1rem;
    margin: .7rem 0 1.1rem;
    white-space: pre-wrap;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.05rem;
    line-height: 1.7;
  }
  .script p { margin: 0 0 .4rem; white-space: normal; }
  .hk { padding: .05em .25em; border-radius: .3em; font-weight: 700; }
  .legend { display: flex; flex-wrap: wrap; gap: .45rem; margin: .5rem 0 1rem; }
  .legend span { font-size: .9rem; padding: .2rem .5rem; border-radius: .4rem; font-weight: 700; }
  .ans-line { margin: .35rem 0; }
  .hidden { display: none !important; }
  .foot-actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; }
  #parentScript {
    background: #111827; color: #f8fafc;
    padding: 1rem; border-radius: .8rem; margin-top: .8rem;
    font-family: Georgia, "Times New Roman", serif; line-height: 1.7;
  }
</style>
</head>

function getVoice() {

function unlockSpeech() {
  if (!window.speechSynthesis) return;
  try {
    const u = new SpeechSynthesisUtterance(" ");
    u.lang = "en-GB";
    u.volume = 0;
    speechSynthesis.speak(u);
    speechSynthesis.cancel();
  } catch (e) {}
  speechSynthesis.getVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = () => { voiceReady = true; };
  }
  voiceReady = true;
}
function speak(text, pitch) {
  return new Promise((resolve) => {
    if (cancelled) return resolve(false);
    if (!window.speechSynthesis) return resolve(false);
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-GB";
    u.rate = 0.9;
    u.pitch = pitch || 1;
    u.volume = 1;
    const v = getVoice();
    if (v) u.voice = v;
    u.onend = () => resolve(true);
    u.onerror = () => resolve(false);
    speechSynthesis.speak(u);
  });
}
function silence(ms) {
  return new Promise((resolve) => {
    const t = setTimeout(() => resolve(), ms);
    const iv = setInterval(() => {
      if (cancelled) { clearTimeout(t); clearInterval(iv); resolve(); }
    }, 120);
    setTimeout(() => clearInterval(iv), ms + 50);
  });
}
function stopSpeech() {

function compact(s) {
  return String(s || "")
    .toLowerCase()
    .replace(/[’']/g, "")
    .replace(/a\.?\s*m\.?/g, "am")
    .replace(/p\.?\s*m\.?/g, "pm")
    .replace(/o'?clock/g, "")
    .replace(/in the morning/g, "am")
    .replace(/in the afternoon/g, "pm")
    .replace(/midday|noon/g, "noon")
    .replace(/to|–|—|~/g, "-")
    .replace(/(\d)\.(\d)/g, "$1:$2")
    .replace(/[,.]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}
function parseDate(str) {
  const raw = compact(str).replace(/(\d)(st|nd|rd|th)/g, "$1");
  let m = raw.match(/^(\d{1,2})\s*[\/\-]\s*(\d{1,2})$/);
  if (m) return { d:+m[1], m:+m[2] };
  m = raw.match(/^the\s+([a-z\-]+)\s+of\s+([a-z]+)$/);
  if (m && ORDINALS[m[1]] && MONTHS[m[2]]) return { d:ORDINALS[m[1]], m:MONTHS[m[2]] };
  m = raw.match(/^(\d{1,2})\s+([a-z]+)$/);
  if (m && MONTHS[m[2]]) return { d:+m[1], m:MONTHS[m[2]] };
  m = raw.match(/^([a-z]+)\s+(\d{1,2})$/);
  if (m && MONTHS[m[1]]) return { d:+m[2], m:MONTHS[m[1]] };
  const ord = raw.match(/^the\s+([a-z\-]+)\s+of\s+([a-z]+)/);
  if (ord && ORDINALS[ord[1]] && MONTHS[ord[2]]) return { d:ORDINALS[ord[1]], m:MONTHS[ord[2]] };
  return null;
}
function parseMonth(str) {
  const raw = compact(str).replace(/^in\s+/, "");
  return MONTHS[raw] || null;
}
function parseTime(str) {
  let raw = compact(str);
  raw = raw.replace(/half past two/g, "2:30pm").replace(/half past one/g, "1:30pm")
    .replace(/two thirty/g, "2:30").replace(/one thirty/g, "1:30")
    .replace(/eight thirty/g, "8:30").replace(/nine\s*(am)?$/g, "9:00am")
    .replace(/twelve\s*(noon)?/g, "12:00noon");
  let m = raw.match(/(\d{1,2})\s*[:.]\s*(\d{2})\s*(am|pm|noon)?/);
  if (m) {
    const h = +m[1], min = m[2], ap = m[3] || "";
    return `${h}:${min}${ap}`;
  }
  m = raw.match(/(\d{1,2})\s+(\d{2})\s*(am|pm|noon)?/);
  if (m) {
    const h = +m[1], min = m[2], ap = m[3] || "";
    return `${h}:${min}${ap}`;
  }
  m = raw.match(/\b(\d{1,2})\s*(am|pm)\b/);
  if (m) return `${m[1]}:00${m[2]}`;
  if (/12:00noon|12noon|noon/.test(raw)) return "12:00noon";
  return raw.replace(/\s+/g, "");
}
function timeEq(a, b) {
  const na = parseTime(a), nb = parseTime(b);
  const norm = (t) => {
    const m = String(t).match(/(\d{1,2}):(\d{2})(am|pm|noon)?/);
    if (!m) return t;
    return `${+m[1]}:${m[2]}${m[3]||""}`;
  };
  return norm(na) === norm(nb);
}
function dateEq(val, expect) {
  const got = parseDate(val);
  return got && got.d === expect.d && got.m === expect.m;
}
function checkText(q, val) {
  const s = compact(val);
  if (!s) return false;
  if (q.accept === "date") return dateEq(s, q.expect);
  if (q.accept === "month") return parseMonth(s) === q.expect;
  if (q.accept === "time") return timeEq(s, q.expect);
  if (q.accept === "daterange") {
    const parts = s.split("-").map(x => x.trim()).filter(Boolean);
    if (parts.length < 2) {
      const all = s.match(/(\d{1,2}\s*[\/\-]\s*\d{1,2}|the\s+[a-z\-]+\s+of\s+[a-z]+|\d{1,2}\s+[a-z]+)/g) || [];
      if (all.length >= 2) return dateEq(all[0], q.expect[0]) && dateEq(all[1], q.expect[1]);
      return false;
    }
    return dateEq(parts[0], q.expect[0]) && dateEq(parts[1], q.expect[1]);
  }
  if (q.accept === "timerange") {
    const parts = s.split("-").map(x => x.trim()).filter(Boolean);
    if (parts.length < 2) return false;
    const end = /noon/.test(parts[1]) ? "12:00noon" : parts[1];
    return timeEq(parts[0], q.expect.t1) && (timeEq(end, q.expect.t2) || (q.expect.t2 === "12:00noon" && /noon|12:00/.test(parts[1])));
  }
  if (q.accept === "datetime") {
    let got = parseDate(s);
    if (!got) {
      const m = s.match(/(\d{1,2}\s*[\/\-]\s*\d{1,2}|the\s+[a-z\-]+\s+of\s+[a-z]+|\d{1,2}\s+[a-z]+|[a-z]+\s+\d{1,2})/);
      if (m) got = parseDate(m[0]);
    }
    const okDate = got && got.d === q.expect.d && got.m === q.expect.m;
    const okTime = timeEq(s, q.expect.t);
    return !!(okDate && okTime);
  }
  return false;
}
function getVal(id) {
  const picked = document.querySelector('input[name="'+id+'"]:checked');
  if (picked) return picked.value;
  const el = document.getElementById(id);
  return el ? String(el.value || "") : "";
}
function unanswered(paper) {
  return paper.questions.filter(q => {
    if (q.type === "text") return !String(getVal(q.id)).trim();
    return getVal(q.id) === "";
  }).length;
}
function grade(paper) {
  let score = 0;
  const detail = [];
  for (const q of paper.questions) {
    let ok = false;
    let you = "";
    if (q.type === "text") {
      you = String(getVal(q.id)).trim();
      ok = checkText(q, you);
    } else {
      you = getVal(q.id);
      ok = you !== "" && +you === q.answer;
    }
    if (ok) score += q.marks;
    detail.push({ q, ok, you });
  }
  return { score, detail };
}

      <div class="foot-actions">
        <button type="button" class="secondary" id="parentBtn">沒有聲音？改由家長朗讀</button>
        <button type="button" class="danger" id="submitBtn2">交卷</button>
      </div>
      <div id="parentBox" class="hidden"></div>
    </div>`;
  document.getElementById("submitBtn").onclick = trySubmit;
  document.getElementById("submitBtn2").onclick = trySubmit;
  document.getElementById("pauseBtn").onclick = togglePause;
  document.getElementById("parentBtn").onclick = toggleParent;
}
function togglePause() {
  if (!window.speechSynthesis) return;
  const btn = document.getElementById("pauseBtn");
  if (speechSynthesis.paused) { speechSynthesis.resume(); if (btn) btn.textContent = "Pause"; }
  else { speechSynthesis.pause(); if (btn) btn.textContent = "Resume"; }
}
function plainScript(part) {
  if (part.phonics) return part.phonics.map(x => `${x.n}. ${x.word}`).join("\n");
  return (part.lines || []).map(l => l.text).join("\n");
}
function toggleParent() {
  showParent = !showParent;
  const box = document.getElementById("parentBox");
  if (!box) return;
  if (!showParent) { box.className = "hidden"; box.innerHTML = ""; return; }
  const p = papers[paperId];
  box.className = "";
  box.innerHTML = `<div id="parentScript"><p style="font-weight:800">For the parent: please read this aloud in English. The student should look at the questions, not this script.</p>${
    p.parts.map(part => `<p><b>${part.label}</b></p><p>${plainScript(part).replace(/\n/g,"<br>")}</p>`).join("")
  }</div>`;
}
function setNow(text, partId) {
  const el = document.getElementById("nowText");
  if (el) el.textContent = text;
  document.querySelectorAll(".q").forEach(n => n.classList.remove("on"));
  const p = papers[paperId];
  p.questions.filter(q => q.part === partId).forEach(q => {
    const box = document.getElementById("box-" + q.id);
    if (box) box.classList.add("on");
  });
  const sec = document.getElementById("part-" + partId);
  if (sec) sec.scrollIntoView({ behavior: "smooth", block: "start" });
}
async function playPart(part, roundLabel) {
  setNow(`${part.label}  ·  ${roundLabel}`, part.id);
  const okIntro = await speak(part.intro, 1);
  if (cancelled) return okIntro;
  await silence(part.look || 4000);
  if (cancelled) return okIntro;
  if (part.phonics) {
    for (const item of part.phonics) {
      if (cancelled) return false;
      await speak("Number " + item.n + ".", 1);
      await silence(400);
      await speak(item.word, 1);
      await silence(700);
      await speak(item.word, 1);
      await silence(800);
    }
    return true;
  }
  for (const line of part.lines || []) {
    if (cancelled) return false;
    await speak(line.text, PITCH[line.role] || 1);
    await silence(350);
  }
  return true;
}
async function runExamAudio() {
  speaking = true;
  cancelled = false;
  const p = papers[paperId];
  for (const part of p.parts) {
    if (cancelled) break;
    await playPart(part, "first time");
    if (cancelled) break;
    await silence(1200);
    await playPart(part, "second time");
    if (cancelled) break;
    await silence(1000);
  }
  if (!cancelled) {
    await speak("This is the end of the listening test. Please check your answers and submit.", 1);
    setNow("This is the end of the listening test. Please check your answers and submit.");
  }
  speaking = false;
}
function startExam() {
  unlockSpeech();
  showParent = false;
  showReview = false;
  plays = {};
  renderExam();
  runExamAudio();
}
function trySubmit() {
  const p = papers[paperId];
  const left = unanswered(p);
  if (left > 0) {
    const yes = confirm(`還有 ${left} 題未作答。確定要交卷嗎？`);
    if (!yes) return;
  }
  stopSpeech();
  state = "result";
  renderResult();
}
function correctLabel(q) {
  if (q.type === "text") return q.show;
  if (q.type === "pic") return q.options[q.answer].label;
  return String.fromCharCode(65 + q.answer) + ". " + q.options[q.answer];
}
function yourLabel(q, you) {
  if (you === "" || you == null) return "（未作答）";
  if (q.type === "text") return you;
  if (q.type === "pic") return q.options[+you] ? q.options[+you].label : you;
  return q.options[+you] ? String.fromCharCode(65 + +you) + ". " + q.options[+you] : you;
}
function renderResult() {
  const p = papers[paperId];
  const { score, detail } = grade(p);
  const byPart = {};
  p.parts.forEach(part => {
    const items = detail.filter(d => d.q.part === part.id);
    const got = items.reduce((s, d) => s + (d.ok ? d.q.marks : 0), 0);
    byPart[part.id] = { got, max: part.marks, wrong: items.filter(d => !d.ok).length };
  });
  const pct = Math.round(score / p.total * 100);
  const review = showReview ? renderReview(p, detail) : "";
  document.getElementById("app").innerHTML = `
    <div class="card score-box">
      <h1>${p.title}　成績</h1>
      <div class="big">${score}／${p.total}</div>
      <p>${pct} 分（百分計）</p>
      <div class="breakdown">
        ${p.parts.map(part => `<div><span>${part.label}</span><span>${byPart[part.id].got}／${part.marks}</span></div>`).join("")}
      </div>
      <div class="row" style="justify-content:center">
        <button type="button" id="viewBtn">${showReview ? "收起錄音稿和答案" : "查看錄音稿和答案"}</button>
        <button type="button" class="secondary" id="retryBtn">再做同一篇</button>
        <button type="button" class="secondary" id="homeBtn">返回選擇</button>
      </div>
    </div>
    ${review}`;
  document.getElementById("viewBtn").onclick = () => { showReview = !showReview; renderResult(); };
  document.getElementById("retryBtn").onclick = () => { cancelled = false; renderIntro(); };
  document.getElementById("homeBtn").onclick = renderHome;
}
function renderReview(p, detail) {
  const legend = Object.keys(QCOLOR).filter(n => +n <= 22).map(n =>
    `<span style="background:${QCOLOR[n]}">Q${n}</span>`
  ).join("");
  const scripts = p.parts.map(part => `
    <h3>${part.label}</h3>
    <div class="script">${part.scriptHtml}</div>
  `).join("");
  const ans = detail.map(d => `
    <div class="ans-line">
      <b>Q${d.q.n}</b>
      ${d.ok ? '<span class="ok">正確</span>' : '<span class="no">不正確</span>'}
      ｜ 你的答案：${yourLabel(d.q, d.you)}
      ｜ 正確答案：${correctLabel(d.q)}
    </div>`).join("");
  return `<div class="card">
    <h2>錄音稿和答案</h2>
    <p class="muted">顏色標示的是跟該題答案相關的詞句。黃、綠、藍等色塊旁邊的題號見下圖例。</p>
    <div class="legend">${legend}</div>
    ${scripts}
    <h2>逐題對照</h2>
    ${ans}
  </div>`;
}

if (window.speechSynthesis) {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => { voiceReady = true; };
}
renderHome();
</script>
